<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SendPalm — People-first Email</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;background:#f5f5f7;color:#1d1d1f}
:root{--accent:#007AFF;--accent-dim:rgba(0,122,255,.1);--accent-hover:#0066D6;--green:#34C759;--orange:#FF9500;--red:#FF3B30;--bg-primary:#f5f5f7;--bg-secondary:#fff;--bg-tertiary:#e8e8ed;--bg-hover:#f0f0f2;--text-primary:#1d1d1f;--text-secondary:#6e6e73;--text-muted:#aeaeb2;--border:#d2d2d7;--border-subtle:#e5e5ea;--shadow-sm:0 1px 3px rgba(0,0,0,.04);--shadow-md:0 4px 14px rgba(0,0,0,.06);--shadow-lg:0 8px 30px rgba(0,0,0,.08);--radius-xs:4px;--radius-sm:6px;--radius-md:10px;--radius-lg:14px;--font-mono:'JetBrains Mono',monospace}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#b8b8bd}
[data-theme="dark"]{--bg-primary:#0d0d1a;--bg-secondary:#15152a;--bg-tertiary:#1e1e3a;--bg-hover:rgba(255,255,255,.06);--text-primary:#e4e4e7;--text-secondary:#a1a1aa;--text-muted:#3f3f4a;--border:rgba(255,255,255,.08);--border-subtle:rgba(255,255,255,.05);--accent:#7c5cfc;--accent-dim:rgba(124,92,252,.15);--accent-hover:#6b4ce8;--green:#4ade80;--orange:#f97316;--red:#f87171;--shadow-sm:none;--shadow-md:none;--shadow-lg:0 8px 30px rgba(0,0,0,.5)}
[data-theme="compact"]{--bg-primary:#f8f9fa;--bg-secondary:#fff;--bg-tertiary:#f1f3f5;--bg-hover:#f1f3f5;--text-primary:#1a1a2e;--text-secondary:#6b7280;--text-muted:#9ca3af;--border:#e5e7eb;--border-subtle:#f3f4f6;--accent:#f59e0b;--accent-dim:rgba(245,158,11,.08);--accent-hover:#d97706;--green:#10b981;--orange:#f59e0b;--red:#ef4444;--radius-xs:2px;--radius-sm:4px;--radius-md:6px;--radius-lg:8px;--shadow-sm:none;--shadow-md:none;--shadow-lg:0 1px 4px rgba(0,0,0,.04)}
[data-theme="compact"] .glass{backdrop-filter:none;background:var(--bg-secondary)}

/* Layout */
.app{display:flex;height:100vh;width:100vw}
.col{flex-shrink:0;display:flex;flex-direction:column;overflow:hidden}
.col-mbx{width:200px;background:var(--bg-secondary);border-right:1px solid var(--border-subtle);padding:var(--space-lg) 0}
.col-list{width:350px;background:var(--bg-secondary);border-right:1px solid var(--border-subtle)}
.col-pane{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg-primary)}
:root{--space-xs:4px;--space-sm:8px;--space-md:12px;--space-lg:16px;--space-xl:24px;--space-2xl:32px}

/* Mailbox */
.mbx-logo{padding:0 var(--space-lg) var(--space-lg);display:flex;align-items:center;gap:var(--space-sm);font-size:17px;font-weight:700;letter-spacing:-.03em;color:var(--text-primary)}
.mbx-logo .icon{width:26px;height:26px;border-radius:var(--radius-sm);background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.mbx-acts{padding:0 var(--space-sm);margin-bottom:var(--space-sm)}
.act-row{display:flex;align-items:center;gap:var(--space-sm);padding:6px 10px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--text-secondary)}
.act-row:hover{background:var(--bg-hover)}
.act-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.act-name{flex:1}.act-bdg{font-size:10px;color:var(--text-muted);background:var(--bg-tertiary);padding:0 6px;border-radius:99px;line-height:16px}
.mbx-sec{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);padding:var(--space-sm) var(--space-lg) 4px;margin-top:var(--space-xs)}
.mbx-item{display:flex;align-items:center;gap:var(--space-sm);padding:7px var(--space-lg);font-size:13px;font-weight:500;color:var(--text-secondary);border:none;background:none;cursor:pointer;transition:all .12s;width:100%;text-align:left;font-family:inherit}
.mbx-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.mbx-item.active{background:var(--accent-dim);color:var(--accent);font-weight:600}
.mbx-item i{font-size:16px;width:18px;text-align:center;flex-shrink:0}
.mbx-item .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;padding:0 7px;border-radius:99px;line-height:16px;font-weight:600}
.mbx-ftr{margin-top:auto;padding:var(--space-sm) var(--space-lg);border-top:1px solid var(--border-subtle)}
.theme-r{display:flex;gap:var(--space-xs);margin-bottom:var(--space-xs)}
.theme-b{flex:1;padding:5px;border:none;background:transparent;border-radius:var(--radius-xs);cursor:pointer;font-size:14px;color:var(--text-muted);transition:all .12s;text-align:center}
.theme-b:hover{background:var(--bg-hover);color:var(--text-primary)}
.theme-b.active{background:var(--accent-dim);color:var(--accent)}

/* List */
.l-tb{padding:var(--space-md) var(--space-lg) 0;border-bottom:1px solid var(--border-subtle);flex-shrink:0}
.l-row{display:flex;align-items:center;gap:var(--space-sm);margin-bottom:var(--space-sm)}
.l-title{font-size:16px;font-weight:600;letter-spacing:-.01em;flex:1}
.l-count{font-size:12px;color:var(--text-muted);font-weight:400}
.l-brief{
  background:linear-gradient(135deg,var(--accent-dim),transparent);
  border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  padding:var(--space-md);margin-bottom:var(--space-sm);
  cursor:pointer;transition:all .12s;
}
.l-brief:hover{border-color:var(--accent)}
.l-brief-top{display:flex;align-items:center;gap:var(--space-sm);margin-bottom:4px}
.l-brief-top i{font-size:14px;color:var(--accent)}
.l-brief-top span{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.l-brief-text{font-size:12px;color:var(--text-secondary);line-height:1.5}
.l-brief-items{margin-top:var(--space-sm);display:flex;flex-direction:column;gap:4px}
.l-brief-item{display:flex;align-items:center;gap:var(--space-sm);font-size:12px;color:var(--text-secondary);padding:3px 6px;border-radius:var(--radius-xs);cursor:pointer;transition:all .1s}
.l-brief-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.l-brief-item i{font-size:13px;color:var(--accent);width:16px;text-align:center}
.l-srch{padding:0 var(--space-lg) var(--space-sm);position:relative;flex-shrink:0}
.l-srch input{width:100%;height:32px;padding:0 12px 0 32px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--bg-primary);font-size:13px;font-family:inherit;color:var(--text-primary);outline:none;transition:border-color .15s}
.l-srch input:focus{border-color:var(--accent)}
.l-srch input::placeholder{color:var(--text-muted)}
.l-srch i{position:absolute;left:22px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text-muted);pointer-events:none}
.l-body{flex:1;overflow-y:auto}
.l-dg{padding:0}.l-dl{font-size:11px;font-weight:600;color:var(--text-muted);padding:var(--space-sm) var(--space-lg) var(--space-xs);letter-spacing:.04em}

/* Email row */
.em{display:flex;gap:var(--space-sm);padding:10px var(--space-lg) 10px var(--space-md);cursor:pointer;transition:all .1s;border-bottom:1px solid var(--border-subtle);align-items:flex-start;position:relative}
.em:hover{background:var(--bg-hover)}
.em.active{background:var(--accent-dim);border-bottom-color:transparent;box-shadow:inset 3px 0 0 var(--accent)}
.em.unread .em-fr{font-weight:600;color:var(--text-primary)}
.em-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:7px;display:none}
.em.unread .em-dot{display:block}
.em-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;cursor:pointer;transition:opacity .15s;margin-top:2px}
.em-av:hover{opacity:.8}
.em-c{flex:1;min-width:0}
.em-r1{display:flex;align-items:center;gap:var(--space-sm);margin-bottom:2px}
.em-fr{font-size:13px;font-weight:500;color:var(--text-secondary);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.em-fr:hover{color:var(--accent)}
.em-tm{font-size:11px;color:var(--text-muted);white-space:nowrap;flex-shrink:0}
.em-sj{font-size:12px;font-weight:500;color:var(--text-primary);margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em-pr{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.em-mt{display:flex;align-items:center;gap:6px;margin-top:3px}
.em-mt .mt-i{font-size:12px;color:var(--text-muted)}
.em-mt .at{font-size:9px;padding:0 5px;border-radius:3px;line-height:15px;font-weight:500;background:var(--bg-tertiary);color:var(--text-muted)}
.em-ac{position:absolute;right:var(--space-sm);top:50%;transform:translateY(-50%);display:none;gap:2px}
.em:hover .em-ac{display:flex}
.em-acb{width:26px;height:26px;border:none;border-radius:var(--radius-xs);background:var(--bg-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px;box-shadow:var(--shadow-sm);transition:all .1s;border:1px solid var(--border-subtle)}
.em-acb:hover{color:var(--accent);background:var(--accent-dim);border-color:var(--accent)}
.dft-bg{font-size:9px;font-weight:600;padding:0 6px;border-radius:3px;background:var(--accent-dim);color:var(--accent);line-height:16px;display:inline-flex;align-items:center;gap:3px}

/* Reading pane */
.rp-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-sm);color:var(--text-muted);text-align:center;padding:var(--space-2xl)}
.rp-empty i{font-size:48px;opacity:.3}
.rp-empty-t{font-size:17px;font-weight:600;color:var(--text-secondary)}
.rp-empty-d{font-size:13px;max-width:300px;line-height:1.5}
.rp-h{padding:var(--space-xl) var(--space-xl) var(--space-lg);flex-shrink:0;border-bottom:1px solid var(--border-subtle)}
.rp-sj{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:var(--space-md)}
.rp-fr{display:flex;align-items:flex-start;gap:var(--space-sm);margin-bottom:var(--space-sm)}
.rp-fr .rp-av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;cursor:pointer;transition:opacity .15s}
.rp-fr .rp-av:hover{opacity:.8}
.rp-fd{flex:1;min-width:0}
.rp-fn{font-size:14px;font-weight:600;color:var(--text-primary);cursor:pointer}
.rp-fn:hover{color:var(--accent)}
.rp-fe{font-size:12px;color:var(--text-muted)}
.rp-mr{display:flex;align-items:center;gap:var(--space-sm);flex-wrap:wrap;font-size:12px;color:var(--text-muted)}
.rp-mr .sep{font-size:8px;color:var(--border)}
.rp-ac{display:flex;gap:var(--space-sm);margin-top:var(--space-md);padding-top:var(--space-md);border-top:1px solid var(--border-subtle);flex-wrap:wrap}
.rp-ac button{padding:6px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;border:none;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:6px;font-family:inherit;background:var(--bg-hover);color:var(--text-secondary)}
.rp-ac button:hover{background:var(--border);color:var(--text-primary)}
.rp-ac button:active{transform:scale(.97)}
.rp-ac .prim{background:var(--accent);color:#fff}
.rp-ac .prim:hover{background:var(--accent-hover)}
.rp-b{flex:1;overflow-y:auto;padding:var(--space-xl)}
.rp-msg{margin-bottom:var(--space-xl);padding-bottom:var(--space-xl);border-bottom:1px solid var(--border-subtle);max-width:680px}
.rp-msg:last-child{border-bottom:none}
.rp-mh{display:flex;align-items:center;gap:var(--space-sm);margin-bottom:var(--space-sm)}
.rp-mav{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#fff;flex-shrink:0}
.rp-mn{font-size:13px;font-weight:600;color:var(--text-primary)}
.rp-mt{font-size:11px;color:var(--text-muted);margin-left:auto}
.rp-mb{font-size:14px;line-height:1.7;color:var(--text-primary);white-space:pre-wrap}
.rp-tab{padding:8px 0;margin-right:var(--space-lg);font-size:13px;font-weight:500;color:var(--text-muted);border:none;border-bottom:2px solid transparent;background:transparent;cursor:pointer;font-family:inherit;transition:all .12s}
.rp-tab:hover{color:var(--text-primary)}
.rp-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.rp-at{margin-top:var(--space-md);display:flex;flex-wrap:wrap;gap:var(--space-sm)}
.rp-atc{display:flex;align-items:center;gap:var(--space-sm);padding:6px 12px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--bg-primary);font-size:12px;color:var(--text-secondary);cursor:pointer;transition:all .12s}
.rp-atc:hover{border-color:var(--accent);color:var(--accent)}
.rp-atc i{font-size:16px;color:var(--accent)}
.rp-atc .sz{font-size:10px;color:var(--text-muted);margin-left:var(--space-sm)}
.rp-df{background:linear-gradient(135deg,var(--accent-dim),transparent);border:1px solid var(--accent);border-radius:var(--radius-md);padding:var(--space-lg);margin-bottom:var(--space-xl);max-width:680px}
.rp-df-lb{display:flex;align-items:center;gap:var(--space-sm);font-size:12px;font-weight:600;color:var(--accent);margin-bottom:var(--space-sm)}
.rp-df-lb i{font-size:14px}
.rp-df-lb .bdg{font-size:9px;font-weight:600;background:var(--accent);color:#fff;padding:1px 8px;border-radius:99px;line-height:16px;text-transform:uppercase;letter-spacing:.05em}
.rp-df-txt{font-size:14px;line-height:1.6;color:var(--text-primary);white-space:pre-wrap;background:var(--bg-primary);border-radius:var(--radius-sm);padding:var(--space-md);margin-bottom:var(--space-md);border:1px solid var(--border-subtle)}
.rp-df-ac{display:flex;gap:var(--space-sm);flex-wrap:wrap}
.rp-df-ac button{padding:7px 16px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;border:none;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:6px;font-family:inherit}
.rp-df-ac button:active{transform:scale(.97)}
.d-s{background:var(--accent);color:#fff}.d-s:hover{background:var(--accent-hover)}
.d-e{background:var(--bg-hover);color:var(--text-primary)}.d-e:hover{background:var(--border)}
.d-d{background:transparent;color:var(--text-muted)}.d-d:hover{color:var(--red);background:var(--red-dim)}
.rp-cp{display:flex;gap:var(--space-sm);padding:var(--space-md) var(--space-xl);border-top:1px solid var(--border-subtle);flex-shrink:0;align-items:flex-end}
.rp-cp textarea{flex:1;border:1px solid var(--border);border-radius:var(--radius-md);padding:10px var(--space-md);font-size:14px;font-family:inherit;resize:none;outline:none;background:var(--bg-secondary);color:var(--text-primary);min-height:40px;max-height:120px;transition:border-color .15s,box-shadow .15s;line-height:1.4}
.rp-cp textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.rp-cp textarea::placeholder{color:var(--text-muted)}
.rp-cp button{padding:8px 20px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:all .12s;font-family:inherit;align-self:flex-end}
.rp-cp button:hover{background:var(--accent-hover)}
.rp-cp button:active{transform:scale(.97)}

/* ============================================================
   PERSON PANEL (the revolutionary part)
   ============================================================ */
.pp{width:420px;flex-shrink:0;background:var(--bg-secondary);border-left:1px solid var(--border-subtle);display:flex;flex-direction:column;overflow:hidden;animation:slideIn .2s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.pp-h{padding:var(--space-xl);border-bottom:1px solid var(--border-subtle);flex-shrink:0}
.pp-h-top{display:flex;align-items:center;gap:var(--space-sm);margin-bottom:var(--space-md)}
.pp-back{width:28px;height:28px;border:none;border-radius:var(--radius-xs);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:16px;transition:all .1s}
.pp-back:hover{background:var(--bg-hover);color:var(--text-primary)}
.pp-h .pp-av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;margin-bottom:var(--space-sm)}
.pp-h .pp-nm{font-size:20px;font-weight:600;letter-spacing:-.02em}
.pp-h .pp-rl{font-size:13px;color:var(--text-secondary);margin-top:2px}
.pp-h .pp-og{font-size:13px;color:var(--accent);font-weight:500}
.pp-h .pp-act{margin-top:var(--space-md);display:flex;gap:var(--space-sm)}
.pp-h .pp-act button{padding:6px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:6px;font-family:inherit}
.pp-h .pp-act button:hover{background:var(--bg-hover);border-color:var(--accent);color:var(--accent)}
.pp-h .pp-act button:active{transform:scale(.97)}
.pp-h .pp-act button i{font-size:14px;color:var(--accent)}

.pp-b{flex:1;overflow-y:auto;padding:var(--space-lg) var(--space-xl)}
.pp-sec{margin-bottom:var(--space-xl)}
.pp-sec-t{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:var(--space-sm);padding-bottom:var(--space-xs);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:var(--space-sm)}
.pp-sec-t i{font-size:14px;color:var(--accent)}

/* Agent brief in person panel */
.pp-brief{background:linear-gradient(135deg,var(--accent-dim),transparent);border:1px solid var(--accent);border-radius:var(--radius-md);padding:var(--space-md);margin-bottom:var(--space-lg)}
.pp-brief-l{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:var(--space-sm);display:flex;align-items:center;gap:var(--space-sm)}
.pp-brief-l i{font-size:14px}
.pp-brief-t{font-size:13px;color:var(--text-primary);line-height:1.6;margin-bottom:var(--space-sm)}
.pp-brief-it{display:flex;flex-direction:column;gap:4px}
.pp-brief-itm{display:flex;align-items:center;gap:var(--space-sm);font-size:12px;color:var(--text-secondary);padding:5px 8px;border-radius:var(--radius-xs);cursor:pointer;transition:all .1s}
.pp-brief-itm:hover{background:var(--bg-hover);color:var(--text-primary)}
.pp-brief-itm i{font-size:13px;color:var(--accent);width:16px;text-align:center}
.pp-brief-itm .lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-left:auto}

/* Activity in person panel */
.pp-act-item{display:flex;gap:var(--space-sm);padding:8px 0;border-bottom:1px solid var(--border-subtle);cursor:pointer;transition:all .1s;align-items:flex-start}
.pp-act-item:last-child{border-bottom:none}
.pp-act-item:hover{opacity:.8}
.pp-act-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.pp-act-c{flex:1;min-width:0}
.pp-act-sj{font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:2px}
.pp-act-pr{font-size:12px;color:var(--text-muted);line-height:1.3}
.pp-act-tm{font-size:11px;color:var(--text-muted);margin-top:2px}

/* Network items */
.pp-net-item{display:flex;align-items:center;gap:var(--space-sm);padding:6px 0;font-size:13px;color:var(--text-secondary);cursor:default}
.pp-net-item .net-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#fff;flex-shrink:0}

/* Agent bar */

/* Toast */

.ts{background:#1d1d1f;color:#fff;padding:10px 20px;border-radius:var(--radius-lg);font-size:13px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.2);opacity:0;transform:translateY(12px) scale(.96);transition:all .3s cubic-bezier(.16,1,.3,1);display:flex;align-items:center;gap:var(--space-sm)}
.ts.show{opacity:1;transform:translateY(0) scale(1)}
.ts i{font-size:16px}

/* Modal */
.modal-o{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-o.show{display:flex}
.modal{width:540px;max-height:80vh;background:var(--bg-secondary);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden}

.modal-ft .mc:hover{background:var(--border);color:var(--text-primary)}

<body>
<div class="app">

</div>

<!-- AGENT BAR -->
<div class="ag">

</div>

<!-- COMPOSE MODAL -->
<div class="modal-o" id="cmp-modal"><div class="modal">

</div></div>

<div class="ts-w"><div class="ts" id="ts"><i class="ph ph-check-circle"></i><span id="ts-msg"></span></div></div>

<script>

const meetings = [

const networks = {
  c1:[{id:'c3',rel:'Direct report'},{id:'c2',rel:'Strategy partner (3 threads)'}],
  c2:[{id:'c6',rel:'Co-founder'},{id:'c1',rel:'Strategy partner'}],
  c3:[{id:'c1',rel:'Reports to'}],
  c4:[],
  c5:[],
  c6:[{id:'c2',rel:'Co-founder'}]
};

const threads = [
  { id:'t1', from:'Sarah Chen', fromId:'c1', subject:'Q2 Strategy Review — Meeting Tomorrow?', status:'need', unread:true, hasAtt:true, star:false, account:'a1',
    messages:[
      { from:'Sarah Chen', fromId:'c1', text:'Hi Edwin, wanted to sync on the Q2 strategy before our board presentation next week. The Data Migration numbers look really strong — Alice shared the latest metrics with me. Are you free tomorrow at 2pm? We can go over the slides together.\n\nAlso, I wanted to get your thoughts on the APAC expansion timeline — Bob\'s analysis suggests we should accelerate.', time:'2026-07-18T10:32:00' },
      { from:'Me', text:'That timing works. I\'ll have the updated slides ready by tomorrow morning. Should I include the APAC analysis from Bob\'s report? I agree on accelerating — the SE Asia numbers are compelling.', time:'2026-07-18T11:15:00' },
      { from:'Sarah Chen', fromId:'c1', text:'Yes, great idea — the APAC numbers will strengthen the board narrative. Also, can you incorporate the Q1 metrics comparison? I think the board will want to see YoY growth.', time:'2026-07-18T14:04:00' },
      { from:'Me', text:'Already in the deck. I\'ll send you the preview before EOD tomorrow morning.', time:'2026-07-18T14:30:00' },
      { from:'Sarah Chen', fromId:'c1', text:'Perfect! Let\'s meet at 2pm in the boardroom. I\'ll book it and bring the stakeholder feedback notes.', time:'2026-07-19T09:12:00' }
    ], preview:'Perfect! Let\'s meet at 2pm in the boardroom.', time:'2026-07-19T09:12:00',
    draft:true, draftText:'Hi Sarah,\n\nSlides are ready with the APAC data and Q1 comparison included. See you at 2pm in the boardroom.\n\nBest,\nEdwin' },
  { id:'t2', from:'James Wilson', fromId:'c4', subject:'Partnership Proposal — Apex x SendPalm', status:'need', unread:true, hasAtt:true, star:false, account:'a2',
    messages:[
      { from:'James Wilson', fromId:'c4', text:'Hi Edwin, I\'ve been following SendPalm\'s growth and I\'m impressed by what you\'re building. Apex\'s data platform could integrate naturally with your communication tools — we handle real-time data syndication across 200+ enterprise customers.\n\nWould you be open to a call next week to explore partnership opportunities?', time:'2026-07-12T08:15:00' },
      { from:'Me', text:'Hi James, thanks for reaching out. The concept sounds interesting — I\'d like to explore how Apex\'s data layer could enhance SendPalm\'s knowledge graph. Let me check my calendar and get back to you.', time:'2026-07-13T16:42:00' }
    ], preview:'I\'d like to explore how Apex\'s data layer could enhance SendPalm.', time:'2026-07-13T16:42:00',
    draft:true, draftText:'Hi James,\n\nApologies for the delay. I\'d love to explore the partnership. How does this Thursday at 2pm PST work for a call?\n\nBest,\nEdwin' },
  { id:'t3', from:'Marcus Johnson', fromId:'c2', subject:'Market Expansion — Budget Approved', status:'waiting', unread:false, hasAtt:false, star:true, account:'a1',
    messages:[
      { from:'Marcus Johnson', fromId:'c2', text:'Edwin, great news — the board approved the expansion budget for Q3. We\'re looking at $2.5M for the initial phase. We need to coordinate with Sarah\'s team on the rollout plan. I suggest a joint call next week — Bob has the market analysis ready.', time:'2026-07-17T11:20:00' },
      { from:'Me', text:'Excellent news! Let\'s set up a call. I\'m free Tuesday or Wednesday. Sarah\'s Q2 strategy work aligns well with this — I\'ll loop her in.', time:'2026-07-17T13:45:00' },
      { from:'Marcus Johnson', fromId:'c2', text:'Tuesday works best. Bob will present the market analysis findings. Can you send out the calendar invite? Let\'s include Sarah\'s team too.', time:'2026-07-18T09:30:00' }
    ], preview:'Tuesday works best. Can you send out the calendar invite?', time:'2026-07-18T09:30:00' },
  { id:'t4', from:'Alice Wang', fromId:'c3', subject:'Data Migration — Status Update (85%)', status:'waiting', unread:false, hasAtt:true, star:false, account:'a2',
    messages:[
      { from:'Alice Wang', fromId:'c3', text:'Hi Edwin, quick update on the Data Migration project — we\'re at 85% completion. The legacy database migration is the remaining piece, estimated about 2 more weeks. Sarah asked me to keep you posted for the board presentation. The Q1 metrics are fully migrated and verified.', time:'2026-07-15T15:10:00' }
    ], preview:'Quick update — the Data Migration is at 85% completion.', time:'2026-07-15T15:10:00' },
  { id:'t5', from:'Dr. Lisa Park', fromId:'c5', subject:'Research Collaboration — AI Communication', status:'done', unread:false, hasAtt:true, star:false, account:'a1',
    messages:[
      { from:'Dr. Lisa Park', fromId:'c5', text:'Dear Edwin, I came across your work on communication analytics at SendPalm. My research group at Stanford is studying AI-mediated communication patterns in organizations. I believe our work aligns well — would you be open to a collaboration? I\'ve attached our research proposal.', time:'2026-07-12T09:00:00' },
      { from:'Me', text:'Hi Lisa, thank you for reaching out. I\'m very interested in exploring this. Let me review the proposal and get back to you with some thoughts next week.', time:'2026-07-13T10:30:00' }
    ], preview:'Thank you for reaching out — I\'m very interested.', time:'2026-07-13T10:30:00' },
  { id:'t6', from:'Bob Kim', fromId:'c6', subject:'APAC Market Analysis — Initial Findings', status:'done', unread:false, hasAtt:true, star:false, account:'a1',
    messages:[
      { from:'Bob Kim', fromId:'c6', text:'Edwin — as promised, here are the initial APAC market findings. Key insight: the APAC region shows 40% growth potential, particularly in SE Asia. I\'ll present the full data at the joint call with Marcus next week.', time:'2026-07-16T15:30:00' },
      { from:'Me', text:'Great data Bob. The APAC numbers will be very useful for the Q2 strategy presentation and the expansion planning.', time:'2026-07-16T16:45:00' }
    ], preview:'Great data Bob. The APAC numbers will be very useful.', time:'2026-07-16T16:45:00' }
];

// ============================================================
// STATE
// ============================================================
let state = { mailbox:'inbox', selected:null, personMode:null, theme:localStorage.getItem('sp-t')||'light' };

function activeThreads() {
  if (state.mailbox === 'drafts') return threads.filter(t => t.draft);
  if (state.mailbox === 'archive' || state.mailbox === 'sent') return [];
  if (state.mailbox === 'vault') return [];
  return threads;
}

// ============================================================
// THEME
// ============================================================
function setTheme(t) {
  state.theme = t; document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('sp-t', t);
  document.querySelectorAll('.theme-b').forEach(b => b.classList.toggle('active', b.dataset.t === t));
}
document.querySelectorAll('.theme-b').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.t)));

// ============================================================
// ACCOUNTS + PEOPLE LIST
// ============================================================
function renderSidebar() {
  document.getElementById('act-list').innerHTML = accounts.map(a =>
    `<div class="act-row"><span class="act-dot" style="background:${a.color}"></span><span class="act-name">${a.provider}</span><span class="act-bdg">${a.unread}</span></div>`
  ).join('');
  document.getElementById('mbx-people').innerHTML = contacts.map(c =>
    `<button class="mbx-item" onclick="openPerson('${c.id}')"><i class="ph ph-user"></i><span>${c.name}</span></button>`
  ).join('');
}

// ============================================================
// AGENT BRIEF
// ============================================================
function renderBrief() {
  const need = threads.filter(t => t.status === 'need');
  const waiting = threads.filter(t => t.status === 'waiting');
  const el = document.getElementById('l-brief');
  el.innerHTML = `
    <div class="l-brief-top"><i class="ph ph-robot"></i><span>Agent Brief</span></div>
    <div class="l-brief-text">${need.length} threads need your reply. ${waiting.length} waiting for others. You have ${meetings.length} upcoming meetings.</div>
    ${need.length ? `<div class="l-brief-items">${need.map(t => `
      <div class="l-brief-item" onclick="selectThread('${t.id}')"><i class="ph ph-warning-circle"></i>${t.from}: ${t.subject}</div>
    `).join('')}</div>` : ''}
  `;
}

// ============================================================
// MESSAGE LIST
// ============================================================
function renderList() {
  const items = activeThreads();
  document.getElementById('l-cnt').textContent = items.length + ' conversations';
  document.getElementById('ibx-cnt').textContent = threads.filter(t => t.status==='need').length;
  document.getElementById('dft-cnt').textContent = threads.filter(t => t.draft).length;
  const el = document.getElementById('l-body');
  const groups = { Today:[], Yesterday:[], 'This Week':[], Earlier:[] };
  const now = new Date('2026-07-19T12:00:00'), today = now.toDateString(), yesterday = new Date(now-86400000).toDateString(), wkAgo = new Date(now-7*86400000);
  items.forEach(t => {
    const d = new Date(t.time).toDateString();
    if (d === today) groups.Today.push(t);
    else if (d === yesterday) groups.Yesterday.push(t);
    else if (new Date(t.time) > wkAgo) groups['This Week'].push(t);
    else groups.Earlier.push(t);
  });
  el.innerHTML = Object.entries(groups).filter(([,v])=>v.length).map(([l,its]) =>
    `<div class="l-dg"><div class="l-dl">${l}</div>${its.map(t => emailRow(t)).join('')}</div>`
  ).join('');
  if (!items.length) {
    el.innerHTML = `<div style="padding:var(--space-2xl);text-align:center;color:var(--text-muted);font-size:13px;line-height:1.5">
      ${state.mailbox === 'vault' ? '<i class="ph ph-files" style="font-size:32px;display:block;margin-bottom:var(--space-sm);opacity:.4"></i>Viewing Markdown Vault structure in the reading pane.' : 'No messages here'}
    </div>`;
  }
  renderBrief();
}

function fmtTime(ds) {
  const d = new Date(ds), now = new Date('2026-07-19T12:00:00');
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
  if (d.toDateString() === new Date(now-86400000).toDateString()) return 'Yesterday';
  if (d > new Date(now-7*86400000)) return d.toLocaleDateString('en-US',{weekday:'short'});
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function emailRow(t) {
  const c = contacts.find(x => x.id === t.fromId), a = accounts.find(x => x.id === t.account), sel = state.selected === t.id;
  return `<div class="em ${t.unread?'unread':''} ${sel?'active':''}" onclick="selectThread('${t.id}')">
    <span class="em-dot"></span>
    <div class="em-av" style="background:${c?.avatar||'#888'}" onclick="event.stopPropagation();openPerson('${t.fromId}')" title="View ${t.from}">${c?.initials||'?'}</div>
    <div class="em-c">
      <div class="em-r1"><span class="em-fr" onclick="event.stopPropagation();openPerson('${t.fromId}')">${t.from}</span><span class="em-tm">${fmtTime(t.time)}</span></div>
      <div class="em-sj">${t.draft?'<span class="dft-bg"><i class="ph ph-robot"></i>Draft</span> ':''}${t.subject}</div>
      <div class="em-pr">${t.preview}</div>
      <div class="em-mt">${t.hasAtt?'<span class="mt-i"><i class="ph ph-paperclip"></i></span>':''}${t.star?'<span class="mt-i" style="color:var(--orange)"><i class="ph ph-star-fill"></i></span>':''}<span class="at" style="background:${a?.color}18;color:${a?.color}">${a?.provider||''}</span></div>
    </div>
    <div class="em-ac">
      <button class="em-acb" onclick="event.stopPropagation();archiveThread('${t.id}')" title="Archive"><i class="ph ph-archive"></i></button>
      <button class="em-acb" onclick="event.stopPropagation();toggleStar('${t.id}')" title="Star"><i class="ph ${t.star?'ph-star-fill':'ph-star'}"></i></button>
    </div>
  </div>`;
}

// ============================================================
// READING PANE
// ============================================================
function selectThread(id) {
  state.selected = id; state.personMode = null;
  renderList();
  const t = threads.find(x => x.id === id); if (!t) return;
  t.unread = false; showPane(t);
}

function showPane(t) {
  const c = contacts.find(x => x.id === t.fromId), a = accounts.find(x => x.id === t.account);
  const pane = document.getElementById('rp-content');
  document.getElementById('rp-empty').style.display = 'none';
  pane.style.display = 'flex';
  pane.innerHTML = `
    <div class="rp-h">
      <div class="rp-sj">${t.subject}</div>
      <div class="rp-tabs" style="display:flex;gap:var(--space-sm);border-bottom:1px solid var(--border-subtle);margin:0 calc(-1 * var(--space-xl)) var(--space-md);padding:0 var(--space-xl)">
        <button class="rp-tab active" data-tab="read" onclick="switchTab('read','${t.id}')">Read</button>
        <button class="rp-tab" data-tab="md" onclick="switchTab('md','${t.id}')">Markdown</button>
        <button class="rp-tab" data-tab="thread" onclick="switchTab('thread','${t.id}')">Thread</button>
      </div>
      <div class="rp-fr">
        <div class="rp-av" style="background:${c?.avatar||'#888'}" onclick="openPerson('${t.fromId}')">${c?.initials||'?'}</div>
        <div class="rp-fd">
          <div class="rp-fn" onclick="openPerson('${t.fromId}')">${t.from}</div>
          <div class="rp-fe">${c?.email||''}</div>
        </div>
      </div>
      <div class="rp-mr"><span>to <strong>me</strong></span><span class="sep">·</span><span>${t.messages.length} messages</span><span class="sep">·</span><span>${new Date(t.time).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</span><span class="sep">·</span><span style="color:var(--accent)">${a?.provider}</span></div>
      <div class="rp-ac">
        <button class="prim" onclick="openPerson('${t.fromId}')"><i class="ph ph-user"></i>View ${t.from.split(' ')[0]}</button>
        <button onclick="archiveThread('${t.id}')"><i class="ph ph-archive"></i>Archive</button>
        ${t.status==='waiting'?`<button onclick="nudgeThread('${t.id}')"><i class="ph ph-bell"></i>Nudge</button>`:''}
        <button onclick="toggleStar('${t.id}')"><i class="ph ${t.star?'ph-star-fill':'ph-star'}"></i></button>
      </div>
    </div>
    <div class="rp-b" id="rp-body"></div>
    <div class="rp-cp">
      <textarea id="rp-cp-inp" placeholder="Reply… (Enter to send, Shift+Enter new line)" rows="1"></textarea>
      <button id="rp-send-btn">Send</button>
    </div>
  `;
  renderReadBody(t);
}

function renderReadBody(t) {
  let html = '';
  t.messages.forEach((m, i) => {
    const isMe = m.from === 'Me'; const mc = contacts.find(x => x.id === m.fromId);
    html += `<div class="rp-msg"><div class="rp-mh"><div class="rp-mav" style="background:${isMe ? 'var(--accent)' : mc?.avatar || '#888'}">${isMe ? 'E' : mc?.initials || '?'}</div><span class="rp-mn">${isMe ? 'Edwin Hao' : m.from}</span><span class="rp-mt">${new Date(m.time).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</span></div><div class="rp-mb">${m.text}</div></div>`;
    if (i === t.messages.length - 1 && t.draft && t.status === 'need') {
      html += `<div class="rp-df" id="df-box"><div class="rp-df-lb"><i class="ph ph-robot"></i>Agent Draft <span class="bdg">Auto</span></div><div class="rp-df-txt" id="df-txt">${esc(t.draftText)}</div><div class="rp-df-ac"><button class="d-s" onclick="sendDraft('${t.id}')"><i class="ph ph-paper-plane-right"></i>Send Draft</button><button class="d-e" onclick="editDraft('${t.id}')"><i class="ph ph-pencil"></i>Edit</button><button class="d-d" onclick="discardDraft('${t.id}')"><i class="ph ph-x-circle"></i>Discard</button></div></div>`;
    }
  });
  if (t.hasAtt) {
    let attFiles = t.fromId === 'c5' ? [{ n: 'Research_Proposal.pdf', s: '2.3 MB', ic: 'ph-file-pdf' }, { n: 'Team_Overview.pptx', s: '1.1 MB', ic: 'ph-file-presentation' }]
      : t.fromId === 'c6' ? [{ n: 'APAC_Market_Analysis.pdf', s: '2.8 MB', ic: 'ph-file-pdf' }, { n: 'Data_Appendix.xlsx', s: '0.9 MB', ic: 'ph-file-spreadsheet' }]
        : t.fromId === 'c4' ? [{ n: 'Apex_Partnership_Deck.pdf', s: '5.4 MB', ic: 'ph-file-pdf' }]
          : [{ n: 'Q2_Strategy.pptx', s: '4.2 MB', ic: 'ph-file-presentation' }, { n: 'Metrics_Q1.xlsx', s: '1.8 MB', ic: 'ph-file-spreadsheet' }];
    html += `<div style="margin-top:var(--space-md);max-width:680px"><div style="font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:var(--space-sm)">Attachments</div><div class="rp-at">${attFiles.map(f => `<div class="rp-atc"><i class="ph ${f.ic}"></i>${f.n}<span class="sz">${f.s}</span></div>`).join('')}</div></div>`;
  }
  document.getElementById('rp-body').innerHTML = html;
  document.getElementById('rp-cp-inp').value = '';
  document.getElementById('rp-cp-inp').focus();
  setupReply();
}

function switchTab(tab, id) {
  const t = threads.find(x => x.id === id); if (!t) return;
  document.querySelectorAll('.rp-tab').forEach(b => b.classList.remove('active'));
  document.querySelector(`.rp-tab[data-tab="${tab}"]`).classList.add('active');
  if (tab === 'read') { renderReadBody(t); return; }
  if (tab === 'thread') { renderThreadView(t); return; }
  if (tab === 'md') { renderMarkdownView(t); return; }
}

function renderThreadView(t) {
  let html = `<div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:var(--space-md);text-transform:uppercase;letter-spacing:.06em">Thread Timeline</div>`;
  html += `<div style="border-left:1.5px solid var(--border);padding-left:var(--space-md);margin-left:8px;">`;
  t.messages.forEach((m, i) => {
    const isMe = m.from === 'Me'; const mc = contacts.find(x => x.id === m.fromId);
    html += `<div style="position:relative;margin-bottom:var(--space-lg);padding-left:var(--space-sm)">
      <div style="position:absolute;left:-25px;top:2px;width:11px;height:11px;border-radius:50%;background:${isMe ? 'var(--accent)' : mc?.avatar || '#888'};border:2px solid var(--bg-primary)"></div>
      <div style="font-size:12px;font-weight:600;color:var(--text-primary)">${isMe ? 'Edwin Hao' : m.from}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">${new Date(m.time).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</div>
      <div style="font-size:13px;color:var(--text-secondary);line-height:1.5">${m.text}</div>
    </div>`;
  });
  html += `</div>`;
  document.getElementById('rp-body').innerHTML = html;
}

function renderMarkdownView(t) {
  const c = contacts.find(x => x.id === t.fromId);
  const a = accounts.find(x => x.id === t.account);
  const last = t.messages[t.messages.length - 1];
  let md = `---\n`;
  md += `thread: ${t.id}\n`;
  md += `subject: ${t.subject}\n`;
  md += `from: ${t.from}\n`;
  md += `from_email: ${c?.email || ''}\n`;
  md += `to: Edwin Hao\n`;
  md += `account: ${a?.provider || ''}\n`;
  md += `status: ${t.status}\n`;
  md += `messages: ${t.messages.length}\n`;
  md += `tags: [${t.tags.join(', ')}]\n`;
  md += `last_update: ${t.time}\n`;
  md += `---\n\n`;

  md += `# ${t.subject}\n\n`;

  t.messages.forEach((m, i) => {
    const mc = contacts.find(x => x.id === m.fromId);
    const author = m.from === 'Me' ? 'Edwin Hao' : m.from;
    md += `## [${i + 1}] ${new Date(m.time).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })} — ${author}\n\n`;
    let body = m.text
      .replace(/Alice Wang/g, '[[Alice Wang]]')
      .replace(/Bob Kim/g, '[[Bob Kim]]')
      .replace(/Sarah Chen/g, '[[Sarah Chen]]')
      .replace(/Marcus Johnson/g, '[[Marcus Johnson]]')
      .replace(/James Wilson/g, '[[James Wilson]]')
      .replace(/Dr\. Lisa Park/g, '[[Dr. Lisa Park]]')
      .replace(/Q2 strategy/gi, '[[Q2 Strategy]]')
      .replace(/Data Migration/gi, '[[Data Migration]]')
      .replace(/APAC expansion/gi, '[[APAC Expansion]]')
      .replace(/board presentation/gi, '[[Board Presentation]]')
      .replace(/Market Expansion/gi, '[[Market Expansion]]');
    md += `${body}\n\n`;
  });

  if (t.draft) {
    md += `---\n\n## Agent Draft (unsaved)\n\n\`\`\`\n${t.draftText}\n\`\`\`\n\n`;
  }

  md += `---\n\n**File path:**\n\n\`\`\`\nthreads/${t.id}/${last.time.split('T')[0]}_${t.from.replace(/\s+/g, '-').toLowerCase()}.md\n\`\`\`\n`;

  document.getElementById('rp-body').innerHTML = `
    <div style="max-width:680px">
      <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:var(--space-sm)">Raw Markdown</div>
      <div style="background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:var(--space-lg);font-family:var(--font-mono);font-size:12px;line-height:1.6;color:var(--text-primary);white-space:pre-wrap;overflow:auto">${esc(md)}</div>
    </div>
  `;
}

// ============================================================
// PERSON PANEL (the core innovation)
// ============================================================
function openPerson(id) {
  const c = contacts.find(x => x.id === id); if (!c) return;
  state.personMode = id; state.selected = null;
  const pane = document.getElementById('rp-content');
  document.getElementById('rp-empty').style.display = 'none';
  pane.style.display = 'flex';
  document.getElementById('l-body').querySelectorAll('.em.active').forEach(e => e.classList.remove('active'));

  const personThreads = threads.filter(t => t.fromId === id);
  const pMeetings = meetings.filter(m => m.with === id);
  const pFiles = sharedFiles[id] || [];
  const pNet = networks[id] || [];
  const note = personNotes[id] || '';
  const needItems = personThreads.filter(t => t.status === 'need');
  const waitItems = personThreads.filter(t => t.status === 'waiting');

  pane.innerHTML = `
    <div class="pp" style="width:100%;border-left:none;animation:none">
      <div class="pp-h">
        <div class="pp-h-top"><button class="pp-back" onclick="backFromPerson()"><i class="ph ph-arrow-left"></i></button></div>
        <div class="pp-av" style="background:${c.avatar}">${c.initials}</div>
        <div class="pp-nm">${c.name}</div>
        <div class="pp-rl">${c.role}</div>
        <div class="pp-og">${c.org}</div>
        <div class="pp-act">
          <button onclick="openCompose('${c.email}','')"><i class="ph ph-envelope"></i>Email</button>
          <button onclick="showToast('Calendar link sent')"><i class="ph ph-calendar-plus"></i>Schedule</button>
          <button onclick="editNote('${id}')"><i class="ph ph-note-pencil"></i>Note</button>
        </div>
      </div>
      <div class="pp-b">
        <!-- Agent Brief -->
        <div class="pp-brief">
          <div class="pp-brief-l"><i class="ph ph-robot"></i>Agent Insights</div>
          <div class="pp-brief-t">${needItems.length ? c.name + ' has ' + needItems.length + ' open item' + (needItems.length>1?'s':'') + ' needing your response.' : waitItems.length ? 'Waiting on ' + c.name + ' for ' + waitItems.length + ' item' + (waitItems.length>1?'s':'') : 'All caught up with ' + c.name + '.'}</div>
          <div class="pp-brief-it">
            ${needItems.map(t => `<div class="pp-brief-itm" onclick="selectThread('${t.id}')"><i class="ph ph-warning-circle"></i>${t.subject} <span class="lbl">needs reply</span></div>`).join('')}
            ${waitItems.map(t => `<div class="pp-brief-itm"><i class="ph ph-clock"></i>${t.subject} <span class="lbl">waiting</span></div>`).join('')}
            ${pMeetings.map(m => `<div class="pp-brief-itm"><i class="ph ph-calendar"></i>${m.title} — ${m.date}</div>`).join('')}
            <div class="pp-brief-itm"><i class="ph ph-chats"></i>${personThreads.length} conversations · ${personThreads.reduce((s,t)=>s+t.messages.length,0)} messages</div>
          </div>
        </div>

        <!-- Recent Activity -->
        <div class="pp-sec">
          <div class="pp-sec-t"><i class="ph ph-clock"></i>Recent Activity</div>
          ${personThreads.length ? personThreads.slice(0, 4).map(t => {
            const col = t.status === 'need' ? 'var(--orange)' : t.status === 'waiting' ? 'var(--text-muted)' : 'var(--green)';
            return `<div class="pp-act-item" onclick="selectThread('${t.id}')"><span class="pp-act-dot" style="background:${col}"></span><div class="pp-act-c"><div class="pp-act-sj">${t.subject}</div><div class="pp-act-pr">${t.preview}</div><div class="pp-act-tm">${fmtTime(t.time)}</div></div></div>`;
          }).join('') : '<div style="font-size:13px;color:var(--text-muted);padding:8px 0">No conversations</div>'}
        </div>

        <!-- Backlinks (this demonstrates the Markdown/obsidian linking) -->
        <div class="pp-sec">
          <div class="pp-sec-t"><i class="ph ph-link"></i>Backlinks <span style="color:var(--text-muted);font-weight:400">${countBacklinks(c.name)}</span></div>
          <div style="font-size:13px;color:var(--text-secondary);line-height:1.5;margin-bottom:var(--space-sm)">
            This person is referenced in ${countBacklinks(c.name)} markdown files across your vault.
          </div>
          <div class="pp-brief-it">
            ${getBacklinks(c.name).map(th => `<div class="pp-brief-itm" onclick="selectThread('${th.id}')"><i class="ph ph-file-text"></i>${th.subject} <span class="lbl">${th.fromId === c.id ? 'direct' : 'mentioned'}</span></div>`).join('')}
          </div>
        </div>

        <!-- Shared Files -->
        <div class="pp-sec"><div class="pp-sec-t"><i class="ph ph-folder"></i>Shared Files</div>
          ${pFiles.length ? pFiles.map(f => `<div class="pp-file-item"><i class="ph ${f.icon}"></i>${f.name}<span class="sz">${f.size}</span></div>`).join('') : '<div style="font-size:13px;color:var(--text-muted);padding:8px 0">No shared files</div>'}
        </div>

        <!-- Network -->
        <div class="pp-sec"><div class="pp-sec-t"><i class="ph ph-share-network"></i>Network</div>
          ${pNet.length ? pNet.map(n => {
            const nc = contacts.find(x => x.id === n.id);
            return nc ? `<div class="pp-net-item"><div class="net-av" style="background:${nc.avatar}">${nc.initials}</div>${nc.name}<span class="net-rel">${n.rel}</span></div>` : '';
          }).join('') : '<div style="font-size:13px;color:var(--text-muted);padding:8px 0">No known connections</div>'}

        <!-- Notes -->

          <div class="pp-notes-add" id="pp-notes-act-${id}" style="${state.editingNote === id ? 'display:flex' : 'display:none'}">
            <button class="nsv" onclick="saveNote('${id}')">Save</button>
            <button class="nsc" onclick="cancelNote('${id}')">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function backFromPerson() {
  state.personMode = null;
  if (state.selected) { selectThread(state.selected); return; }
  document.getElementById('rp-empty').style.display = 'flex';
  document.getElementById('rp-content').style.display = 'none';
}

function editNote(id) {
  state.editingNote = id;
  const el = document.getElementById('pp-notes-'+id);
  if (el) {
    el.contentEditable = 'true';
    el.focus();
    // Remove placeholder if showing
    if (el.querySelector('span')) el.textContent = personNotes[id] || '';
  }
  const act = document.getElementById('pp-notes-act-'+id);
  if (act) act.style.display = 'flex';
}

function saveNote(id) {
  const el = document.getElementById('pp-notes-'+id);
  if (el) { personNotes[id] = el.textContent.trim(); }
  state.editingNote = null;
  document.getElementById('pp-notes-act-'+id).style.display = 'none';
  if (el) el.contentEditable = 'false';
  showToast('Note saved');
}

function cancelNote(id) {
  const el = document.getElementById('pp-notes-'+id);
  if (el) { el.textContent = personNotes[id] || ''; el.contentEditable = 'false'; }
  state.editingNote = null;
  document.getElementById('pp-notes-act-'+id).style.display = 'none';
}

// ============================================================
// ACTIONS
// ============================================================
function archiveThread(id) {
  const t = threads.find(x => x.id === id); if (!t) return;
  t.status = 'done'; t.draft = false; state.selected = null;
  showToast('Archived ✓');
  renderList();
  document.getElementById('rp-empty').style.display = 'flex';
  document.getElementById('rp-content').style.display = 'none';
}

function toggleStar(id) {
  const t = threads.find(x => x.id === id); if (!t) return;
  t.star = !t.star;
  if (state.selected === id) showPane(t);
  renderList();
  showToast(t.star ? '★ Starred' : '☆ Unstarred');
}

function nudgeThread(id) {
  const t = threads.find(x => x.id === id);
  showToast('✦ Nudge sent to ' + (t?.from.split(' ')[0] || 'them'));
}

function sendDraft(id) {
  const t = threads.find(x => x.id === id); if (!t) return;
  t.messages.push({ from:'Me', text:t.draftText, time:new Date().toISOString() });
  t.draft = false; t.status = 'waiting'; t.unread = false;
  showToast('Draft sent ✓'); renderList(); showPane(t);
}

function editDraft(id) {
  const t = threads.find(x => x.id === id); if (!t) return;
  document.getElementById('rp-cp-inp').value = t.draftText;
  document.getElementById('rp-cp-inp').focus();
}

function discardDraft(id) {
  const t = threads.find(x => x.id === id); if (!t) return;
  t.draft = false;
  const box = document.getElementById('df-box'); if (box) box.style.display = 'none';
  document.getElementById('rp-cp-inp').focus();
  showToast('Draft discarded');
}

// ============================================================
// REPLY
// ============================================================
function setupReply() {
  const btn = document.getElementById('rp-send-btn');
  const inp = document.getElementById('rp-cp-inp');
  if (!btn || !inp) return;
  btn.onclick = doReply;
  inp.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doReply(); } };
}

function doReply() {
  if (!state.selected) return;
  const inp = document.getElementById('rp-cp-inp'); if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  const t = threads.find(x => x.id === state.selected); if (!t) return;
  t.messages.push({ from:'Me', text, time:new Date().toISOString() });
  t.status = t.status === 'need' ? 'waiting' : t.status;
  t.draft = false; t.unread = false; inp.value = '';
  showToast('Sent ✓'); renderList(); showPane(t);
}

// ============================================================
// COMPOSE MODAL
// ============================================================
function openCompose(to, subj) {
  document.getElementById('cmp-modal').classList.add('show');
  document.getElementById('cmp-to').value = to || '';
  document.getElementById('cmp-sj').value = subj || '';
  document.getElementById('cmp-body').value = '';
}
function closeCompose() { document.getElementById('cmp-modal').classList.remove('show'); }
function sendCompose() {
  const to = document.getElementById('cmp-to').value.trim();
  if (!to) { showToast('Enter a recipient'); return; }
  showToast('✈️ Sent to ' + to); closeCompose();
}

// ============================================================
// AGENT BAR
// ============================================================
document.getElementById('ag-inp').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const v = document.getElementById('ag-inp').value.trim();
    if (!v) return;
    document.getElementById('ag-inp').value = '';
    const l = v.toLowerCase();
    if (l.includes('draft')||l.includes('reply')) {
      if (!state.selected) { showToast('Open a message first'); return; }
      const t = threads.find(x=>x.id===state.selected); if (!t) return;
      t.draft = true; t.draftText = `Hi ${t.from.split(' ')[0]},\n\nThanks for reaching out. I\'ve reviewed the details and I think this is a great direction. Let me follow up with more specifics shortly.\n\nBest,\nEdwin`;
      showPane(t); showToast('✦ Draft generated');
    } else if (l.includes('archive')) { if (state.selected) archiveThread(state.selected); else showToast('Open a message first');
    } else if (l.includes('nudge')) { if (state.selected) nudgeThread(state.selected); else showToast('Open a message first');
    } else if (l.includes('summarize')) {
      if (!state.selected) { showToast('Open a message first'); return; }
      const t = threads.find(x=>x.id===state.selected);
      showToast('✨ '+t.messages.length+' messages, latest from '+t.messages[t.messages.length-1].from);
    } else showToast('Try: "draft", "archive", "nudge", "summarize"');
  }
});

// ============================================================
// KEYBOARD / MAILBOX / SEARCH
// ============================================================
document.addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('ag-inp').focus(); }
  if (e.key === 'Escape') { document.getElementById('ag-inp').blur(); closeCompose(); }
});
document.querySelectorAll('[data-mbx]').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('[data-mbx]').forEach(n => n.classList.remove('active'));
    item.classList.add('active');
    state.mailbox = item.dataset.mbx; state.selected = null; state.personMode = null;
    const names = { inbox: 'Inbox', sent: 'Sent', drafts: 'Drafts', archive: 'Archive', vault: 'Markdown Vault' };
    document.querySelector('.l-title').innerHTML = names[item.dataset.mbx] + ' <span class="l-count" id="l-cnt"></span>';
    if (item.dataset.mbx === 'vault') {
      document.getElementById('rp-empty').style.display = 'none';
      document.getElementById('rp-content').style.display = 'flex';
      document.getElementById('rp-content').innerHTML = renderVaultHTML();
      renderList();
    } else {
      document.getElementById('rp-empty').style.display = 'flex';
      document.getElementById('rp-content').style.display = 'none';
      renderList();
    }
  });
});
document.getElementById('src-inp').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  if (!q) { renderList(); return; }
  const filtered = threads.filter(t => t.subject.toLowerCase().includes(q) || t.from.toLowerCase().includes(q) || t.preview.toLowerCase().includes(q));
  document.getElementById('l-body').innerHTML = filtered.map(t => emailRow(t)).join('');
});

function showToast(msg) {
  const el = document.getElementById('ts'), sp = document.getElementById('ts-msg');
  sp.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2200);
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function countBacklinks(name) { return getBacklinks(name).length; }
function getBacklinks(name) {
  return threads.filter(t => {
    const text = t.messages.map(m => m.text).join(' ');
    return text.includes(name) || t.from === name || (t.draftText && t.draftText.includes(name));
  });
}
