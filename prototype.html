<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay — 完整产品原型 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,700,701,2,500,501,3,400,401&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:'Inter',-apple-system,sans-serif;background:#09090b;color:#fafafa;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:20px}
:root{--accent:#3b82f6;--accent-dim:#1e3a5f;--surface:#0c0c0e;--card:#18181b;--border:#27272a;--border-light:#1e1e22;--text:#fafafa;--text2:#a1a1aa;--text3:#52525b;--fd:'Satoshi','Inter',sans-serif;--fm:'JetBrains Mono',monospace;--rs:6px;--rm:10px;--rl:14px}
.win{width:100%;max-width:1360px;height:820px;max-height:90dvh;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(255,255,255,0.03),0 20px 60px rgba(0,0,0,0.5)}
.titlebar{height:38px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--border-light);flex-shrink:0}
.titlebar-dots{display:flex;gap:7px;margin-right:14px}
.titlebar-dot{width:11px;height:11px;border-radius:50%}
.titlebar-dot:nth-child(1){background:#ff5f57}.titlebar-dot:nth-child(2){background:#febc2e}.titlebar-dot:nth-child(3){background:#28c840}
.titlebar-text{font-size:0.7rem;color:var(--text3);margin:0 auto;font-family:var(--fm)}
.body{display:flex;flex:1;overflow:hidden}
.sb{width:56px;flex-shrink:0;border-right:1px solid var(--border-light);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:2px;background:#09090b}
.sb-logo{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;color:white;margin-bottom:6px}
.sb-item{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.12s;border:none;background:none;color:var(--text3);position:relative}
.sb-item:hover{background:rgba(255,255,255,0.04);color:var(--text2)}
.sb-item.active{background:rgba(59,130,246,0.1);color:var(--accent)}
.sb-item svg{width:20px;height:20px}
.sb-item .badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:white;font-size:0.5rem;display:flex;align-items:center;justify-content:center;font-weight:600;padding:0 4px}
.sb-avatar{margin-top:auto;width:32px;height:32px;border-radius:50%;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:var(--accent);font-weight:600;cursor:pointer}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:48px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border-light);flex-shrink:0;gap:10px}
.topbar-title{font-family:var(--fd);font-weight:600;font-size:0.9rem;white-space:nowrap}
.topbar-badge{font-size:0.55rem;padding:2px 8px;border-radius:6px;background:rgba(59,130,246,0.1);color:var(--accent);font-family:var(--fm);white-space:nowrap}
.topbar-search{flex:1;max-width:380px;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--rs);border:1px solid var(--border-light);background:rgba(255,255,255,0.03);color:var(--text3);font-size:0.75rem;cursor:text;transition:all 0.2s}
.topbar-search:hover,.topbar-search:focus-within{border-color:var(--text3)}
.topbar-search input{flex:1;background:none;border:none;color:var(--text);font-size:0.75rem;outline:none;font-family:inherit}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.topbar-right .notif{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--text3);transition:all 0.12s}
.topbar-right .notif:hover{background:rgba(255,255,255,0.04);color:var(--text2)}
.topbar-right .notif .nd{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#f87171}
.topbar-right .notif svg{width:16px;height:16px}
.topbar-status{font-size:0.65rem;color:var(--text3);display:flex;align-items:center;gap:4px;white-space:nowrap}
.content{flex:1;overflow:hidden;display:none;padding:0}
.content.active{display:block}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rm);padding:20px}
.split{display:flex;height:100%}
.split-l{width:300px;flex-shrink:0;border-right:1px solid var(--border-light);display:flex;flex-direction:column;overflow:hidden}
.split-r{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.ls{padding:10px 14px;border-bottom:1px solid var(--border-light);flex-shrink:0}
.ls input{width:100%;padding:7px 10px;border-radius:var(--rs);border:1px solid var(--border-light);background:rgba(255,255,255,0.03);color:var(--text);font-size:0.78rem;outline:none}
.ls input:focus{border-color:var(--accent)}
.lf{display:flex;gap:4px;padding:6px 12px 2px;flex-wrap:wrap;flex-shrink:0}
.lf button{padding:2px 9px;border-radius:10px;font-size:0.6rem;background:transparent;border:1px solid var(--border-light);color:var(--text3);cursor:pointer;transition:all 0.12s}
.lf button.active{background:rgba(59,130,246,0.1);border-color:var(--accent);color:var(--accent)}
.lsc{flex:1;overflow-y:auto;padding:2px 6px}

.pc{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--rs);cursor:pointer;transition:all 0.12s}
.pc:hover{background:rgba(255,255,255,0.03)}
.pc.active{background:rgba(59,130,246,0.08)}
.pc .av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:600}
.pc .inf{flex:1;min-width:0}
.pc .inf .nm{font-size:0.8rem;font-weight:500}
.pc .inf .mt{font-size:0.62rem;color:var(--text3);margin-top:1px}
.pc .sd{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.pc .sc{font-size:0.6rem;font-family:var(--fm);padding:1px 5px;border-radius:5px;flex-shrink:0}

.dtl{padding:16px 22px;flex:1;overflow-y:auto}
.dtl-hdr{display:flex;align-items:flex-start;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--border-light)}
.dtl-hdr .av{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.95rem;font-weight:600}
.dtl-hdr .nm{font-family:var(--fd);font-weight:700;font-size:1.1rem}
.dtl-hdr .ttl{font-size:0.75rem;color:var(--text2);margin-top:1px}
.dtl-ch{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.dtl-ch span{font-size:0.55rem;padding:1px 6px;border-radius:3px;background:rgba(255,255,255,0.04);color:var(--text3);font-family:var(--fm);display:flex;align-items:center;gap:3px}
.dtl-ch span .d{width:4px;height:4px;border-radius:50%;display:inline-block}
.dtl-hlth{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 12px;background:rgba(255,255,255,0.02);border-radius:var(--rs);border:1px solid var(--border-light)}
.dtl-hlth .scr{display:flex;align-items:center;gap:5px;font-size:0.78rem;font-weight:600}
.dtl-hlth .trd{font-size:0.55rem;font-family:var(--fm);padding:1px 5px;border-radius:4px}
.dtl-hlth .trd.up{background:rgba(34,197,94,0.1);color:#4ade80}
.dtl-hlth .trd.dn{background:rgba(239,68,68,0.1);color:#f87171}
.dtl-hlth .lbl{font-size:0.7rem;color:var(--text2)}
.dtl-hlth .sug{margin-left:auto;font-size:0.65rem;color:var(--accent);cursor:pointer;white-space:nowrap}
.dtl-tabs{display:flex;gap:0;border-bottom:1px solid var(--border-light);margin-top:12px;flex-shrink:0}
.dtl-tab{padding:8px 16px;font-size:0.72rem;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.12s;white-space:nowrap}
.dtl-tab:hover{color:var(--text2)}
.dtl-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.dtl-pn{flex:1;overflow-y:auto;padding:10px 0}

.msg-r{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--border-light);cursor:pointer;transition:opacity 0.12s}
.msg-r:hover{opacity:0.8}
.msg-r .ic{width:26px;height:26px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.8rem;background:rgba(255,255,255,0.03)}
.msg-r .bd{flex:1;min-width:0}
.msg-r .hd{display:flex;align-items:center;gap:6px;margin-bottom:1px}
.msg-r .hd .fm{font-size:0.75rem;font-weight:500}
.msg-r .hd .tg{font-size:0.5rem;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,0.04);color:var(--text3);font-family:var(--fm)}
.msg-r .hd .tm{font-size:0.55rem;color:var(--text3);margin-left:auto;font-family:var(--fm)}
.msg-r .subj{font-size:0.75rem;color:var(--text2)}
.msg-r .prev{font-size:0.65rem;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-r .fl{
  display:inline-flex;align-items:center;gap:3px;font-size:0.5rem;padding:1px 6px;border-radius:3px;margin-top:3px;cursor:pointer;font-family:var(--fm)
}
.msg-r .fl.todo{background:rgba(250,204,21,0.1);color:#facc15}
.msg-r .fl.done{background:rgba(34,197,94,0.1);color:#4ade80}
.msg-r .fl.wait{background:rgba(59,130,246,0.1);color:var(--accent)}
.msg-r .at{display:flex;gap:3px;margin-top:3px}
.msg-r .at span{font-size:0.5rem;padding:1px 5px;border-radius:3px;background:rgba(59,130,246,0.06);color:var(--accent)}

.agent-bar{flex-shrink:0;border-top:1px solid var(--border-light);padding:10px 22px;display:flex;align-items:center;gap:8px;background:rgba(59,130,246,0.02)}
.agent-bar input{flex:1;padding:8px 12px;border-radius:var(--rs);border:1px solid var(--border-light);background:rgba(255,255,255,0.03);color:var(--text);font-size:0.78rem;font-family:inherit;outline:none}
.agent-bar input:focus{border-color:var(--accent)}
.agent-bar button{padding:8px 16px;background:var(--accent);color:white;border:none;border-radius:var(--rs);cursor:pointer;font-size:0.7rem;font-weight:600}

.agv{display:flex;height:100%}
.agv-c{flex:1;display:flex;flex-direction:column;overflow:hidden}
.agv-c .h{padding:14px 22px 2px;font-weight:600;font-size:0.88rem;flex-shrink:0}
.agv-c .s{font-size:0.7rem;color:var(--text3);padding:0 22px 10px;flex-shrink:0}
.agv-ms{flex:1;overflow-y:auto;padding:6px 22px;display:flex;flex-direction:column;gap:10px}
.agv-m{display:flex;gap:9px;max-width:80%}
.agv-m.u{margin-left:auto;flex-direction:row-reverse}
.agv-m .b{padding:9px 12px;border-radius:var(--rm);font-size:0.78rem;line-height:1.5}
.agv-m.r .b{background:rgba(255,255,255,0.03);border:1px solid var(--border-light);color:var(--text2)}
.agv-m.u .b{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.2);color:var(--text)}
.agv-m .av{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.55rem;font-weight:600}
.agv-in{border-top:1px solid var(--border-light);padding:10px 22px;display:flex;gap:8px}
.agv-in input{flex:1;padding:8px 12px;border-radius:var(--rs);border:1px solid var(--border-light);background:rgba(255,255,255,0.03);color:var(--text);font-size:0.78rem;font-family:inherit;outline:none}
.agv-in input:focus{border-color:var(--accent)}
.agv-in button{padding:8px 16px;background:var(--accent);color:white;border:none;border-radius:var(--rs);cursor:pointer;font-size:0.7rem;font-weight:600}
.agv-s{width:280px;flex-shrink:0;border-left:1px solid var(--border-light);padding:14px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.agv-s .st{font-size:0.68rem;font-weight:600;color:var(--text3);margin-bottom:2px}
.tsk{padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--rs)}
.tsk .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.tsk .n{font-size:0.75rem;font-weight:500}
.tsk .s{font-size:0.5rem;padding:1px 6px;border-radius:4px;font-family:var(--fm)}
.tsk .s.go{background:rgba(59,130,246,0.1);color:var(--accent)}
.tsk .s.dn{background:rgba(34,197,94,0.1);color:#4ade80}
.tsk .s.wt{background:rgba(250,204,21,0.1);color:#facc15}
.tsk .d{font-size:0.65rem;color:var(--text3);line-height:1.4}
.tsk .step{font-size:0.6rem;color:var(--text2);margin-top:4px;font-family:var(--fm)}
.tsk .step .sp{color:#4ade80}
.tsk .step .sd{color:var(--text3)}

.iv{display:flex;height:100%}
.il{width:340px;flex-shrink:0;border-right:1px solid var(--border-light);overflow-y:auto}
.ii{padding:12px 16px;border-bottom:1px solid var(--border-light);cursor:pointer}
.ii:hover,.ii.active{background:rgba(255,255,255,0.02)}
.ii .tp{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.ii .tp .nm{font-size:0.78rem;font-weight:500}
.ii .tp .tg{font-size:0.5rem;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,0.04);color:var(--text3);font-family:var(--fm);margin-left:auto}
.ii .subj{font-size:0.75rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ii .prev{font-size:0.65rem;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ii .tm{font-size:0.55rem;color:var(--text3);margin-top:3px}
.ii .fl{display:inline-flex;align-items:center;gap:2px;font-size:0.5rem;padding:1px 5px;border-radius:3px;font-family:var(--fm);margin-top:2px}
.ii .fl.todo{background:rgba(250,204,21,0.1);color:#facc15}
.id{flex:1;padding:18px 22px;overflow-y:auto}
.id .subj{font-family:var(--fd);font-size:1rem;font-weight:600;margin-bottom:3px}
.id .from{font-size:0.75rem;color:var(--text2);margin-bottom:10px}
.id .acts{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.id .acts button{padding:4px 10px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.68rem}
.id .acts button:hover{border-color:var(--accent);color:var(--accent)}
.id .body{font-size:0.82rem;color:var(--text2);line-height:1.7}

.ang{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px;height:100%;overflow-y:auto}
.anc{padding:18px}
.anc .t{font-size:0.8rem;font-weight:600;margin-bottom:14px}
.anc .ar{display:flex;align-items:center;gap:8px;padding:5px 0}
.anc .ar .bar{height:7px;border-radius:3px;transition:width 0.3s}
.anc .ar .l{font-size:0.68rem;color:var(--text2);width:50px;flex-shrink:0}
.anc .ar .v{font-size:0.6rem;color:var(--text3);font-family:var(--fm);width:25px;text-align:right}

.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:16px 20px;overflow-y:auto;height:100%}
.fc{padding:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;transition:all 0.12s}
.fc:hover{border-color:rgba(59,130,246,0.2)}
.fc .ic{font-size:1.3rem;margin-bottom:6px}
.fc .nm{font-size:0.75rem;font-weight:500;word-break:break-all}
.fc .mt{font-size:0.55rem;color:var(--text3);margin-top:3px}

.cl{padding:18px;overflow-y:auto;height:100%}
.ci{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border-light)}
.ci .dt{text-align:center;width:44px;flex-shrink:0}
.ci .dt .dy{font-family:var(--fd);font-size:1.3rem;font-weight:700;line-height:1}
.ci .dt .mn{font-size:0.55rem;color:var(--text3);text-transform:uppercase;margin-top:2px}
.ci .inf{flex:1}
.ci .inf .t{font-weight:500;font-size:0.82rem}
.ci .inf .p{font-size:0.7rem;color:var(--text2);margin-top:2px}
.ci .inf .mt{font-size:0.6rem;color:var(--text3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.ci .inf .mt .tag{font-size:0.5rem;padding:1px 5px;border-radius:3px;background:rgba(59,130,246,0.1);color:var(--accent);font-family:var(--fm)}

.ss{overflow-y:auto;height:100%;max-width:580px;padding:18px}
.sg{margin-bottom:28px}
.sg .st{font-size:0.8rem;font-weight:600;margin-bottom:10px}
.si{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-light)}
.si:last-child{border-bottom:none}
.si .nm{font-size:0.78rem;font-weight:500}
.si .dc{font-size:0.62rem;color:var(--text3);margin-top:1px}
.si .vl{font-size:0.62rem;font-family:var(--fm);flex-shrink:0}
.tg{width:34px;height:18px;border-radius:9px;background:var(--border);cursor:pointer;position:relative;transition:background 0.2s;flex-shrink:0}
.tg.on{background:var(--accent)}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:white;transition:transform 0.2s}
.tg.on::after{transform:translateX(16px)}

/* notifications panel */
.notif-panel{position:absolute;top:48px;right:16px;width:320px;background:var(--card);border:1px solid var(--border);border-radius:var(--rm);box-shadow:0 10px 40px rgba(0,0,0,0.4);z-index:100;display:none;max-height:400px;overflow-y:auto}
.notif-panel.show{display:block}
.notif-panel .h{padding:12px 16px;border-bottom:1px solid var(--border-light);font-size:0.78rem;font-weight:600}
.notif-item{padding:10px 16px;border-bottom:1px solid var(--border-light);display:flex;gap:8px;cursor:pointer}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:rgba(255,255,255,0.02)}
.notif-item .nd{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:4px;flex-shrink:0}
.notif-item .txt{font-size:0.72rem;color:var(--text2)}
.notif-item .txt strong{color:var(--text)}
.notif-item .tm{font-size:0.55rem;color:var(--text3);margin-top:2px}

/* search results */
.sr-overlay{position:absolute;top:48px;left:80px;right:20px;max-width:500px;background:var(--card);border:1px solid var(--border);border-radius:var(--rm);box-shadow:0 10px 40px rgba(0,0,0,0.4);z-index:100;display:none;max-height:400px;overflow-y:auto}
.sr-overlay.show{display:block}
.sr-grp{padding:8px 0}
.sr-grp .st{padding:4px 16px;font-size:0.6rem;color:var(--text3);font-family:var(--fm);text-transform:uppercase}
.sr-item{padding:8px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:0.75rem}
.sr-item:hover{background:rgba(255,255,255,0.03)}
.sr-item .av{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.5rem}
.sr-item .txt{color:var(--text2)}
.sr-item .txt em{color:var(--accent);font-style:normal}

/* draft box */
.dr{margin-top:6px;padding:8px 10px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--rs);font-size:0.72rem;color:var(--text2);line-height:1.5}
.dr .ac{display:flex;gap:5px;margin-top:6px}
.dr .ac button{padding:3px 10px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.6rem}

let cid='zl', pfilt='all', fftype='all';
function rpl(f,pq){
  const el=document.getElementById('pl');
  let list=[...D.contacts];
  if(f==='active') list=list.filter(c=>c.grp==='active');
  else if(f==='risk') list=list.filter(c=>c.grp==='risk');
  else if(f==='cold') list=list.filter(c=>c.grp==='cold');
  if(pq) list=list.filter(c=>c.name.includes(pq)||c.co.includes(pq));
  
  if(f==='company'){
    const groups = {};
    tlist=list;
    tlist.forEach(c=>{if(!groups[c.co])groups[c.co]=[];groups[c.co].push(c)});
    el.innerHTML = Object.entries(groups).map(([co,cs])=>`
      <div style="font-size:0.55rem;font-family:var(--fm);color:var(--text3);padding:10px 8px 4px;letter-spacing:0.05em;">${co.toUpperCase()}</div>
      ${cs.map(c=>pcHTML(c)).join('')}
    `).join('');
    return;
  }
  
  const sorted = [...list].sort((a,b)=>{
    if(a.id===cid)return -1;if(b.id===cid)return 1;
    return b.sc-a.sc;
  });
  el.innerHTML = sorted.map(c=>pcHTML(c)).join('');
}

    <div class="inf"><div class="nm">${c.name}</div><div class="mt">${c.co} · ${c.lc}</div></div>
    <span class="sd" style="background:${c.scC}"></span>
    <span class="sc" style="background:${c.scC}15;color:${c.scC}">${c.sc}</span>
  </div>`;

function rf(){
  const g=document.getElementById('fg');
  let fs=[...D._files];
  if(fftype!=='all')fs=fs.filter(f=>f.tp===fftype);
  g.innerHTML=fs.map(f=>{
    const p=D.getP(f.pid);
    return `<div class="fc"><div class="ic">${f.tp==='image'?'🖼️':'📄'}</div><div class="nm">${f.name}</div><div class="mt">${p?.name||'未知'} · ${f.sz} · ${f.dt}</div></div>`;
  }).join('')||'<div class="empty" style="grid-column:1/-1;"><p>没有匹配的文件</p></div>';
}
function ff(q){
  document.querySelectorAll('.fc').forEach(c=>{c.style.display=(c.querySelector('.nm')?.textContent||'').includes(q)?'':'none';});
}
function fft(f,btn){
  fftype=f;
  document.querySelectorAll('#ff button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  rf();
}

// SEARCH

function onSearch(q){
  const o=document.getElementById('searchOverlay');
  if(!q.trim()){o.classList.remove('show');o.innerHTML='';return;}
  const cl=D.contacts.filter(c=>c.name.includes(q)||c.co.includes(q));
  const ms=D._msgs.filter(m=>m.subj.includes(q)||m.prev.includes(q));
  const fl=D._files.filter(f=>f.name.includes(q));
  let h='';
  if(cl.length)h+=`<div class="sr-grp"><div class="st">联系人 (${cl.length})</div>${cl.map(c=>`<div class="sr-item" onclick="sp('${c.id}');sv('people');hideSearch()"><div class="av" style="background:${c.scC}15;color:${c.scC};width:22px;height:22px;font-size:0.5rem;">${c.name[0]}</div><span class="txt"><em>${c.name}</em> · ${c.co}</span></div>`).join('')}</div>`;
  if(ms.length)h+=`<div class="sr-grp"><div class="st">消息 (${ms.length})</div>${ms.slice(0,3).map(m=>`<div class="sr-item"><span class="txt"><em>${m.subj}</em> · ${m.prev.slice(0,30)}</span></div>`).join('')}</div>`;
  if(fl.length)h+=`<div class="sr-grp"><div class="st">文件 (${fl.length})</div>${fl.slice(0,3).map(f=>`<div class="sr-item"><span class="txt"><em>${f.name}</em></span></div>`).join('')}</div>`;
  o.innerHTML=h||`<div style="padding:16px;font-size:0.7rem;color:var(--text3);text-align:center;">无结果</div>`;
  o.classList.add('show');
}
function showSearchResults(q){if(q&&q.trim())onSearch(q);}
function hideSearch(){document.getElementById('searchOverlay').classList.remove('show');}

let notifOpen=false;
function toggleNotif(){
  const p=document.getElementById('notifPanel');
  notifOpen=!notifOpen;p.classList.toggle('show',notifOpen);
}
document.addEventListener('click',e=>{

const vn={people:'联系人',agent:'AI 助手',inbox:'收件箱',analytics:'洞察',files:'文件',calendar:'日历',settings:'设置'};
function sv(v){
  document.querySelectorAll('.sb-item').forEach(e=>e.classList.remove('active'));
  document.querySelector(`.sb-item[data-v="${v}"]`).classList.add('active');
  document.querySelectorAll('.content').forEach(e=>e.classList.remove('active'));
  const mid={p:'vp',a:'va',i:'vi',n:'van',f:'vf',c:'vc',s:'vs'};
  document.getElementById(mid[v[0]]||'vp').classList.add('active');
  document.getElementById('vt').textContent=vn[v]||v;

  if(v==='analytics')ra2();
  if(v==='files')rf();
  if(v==='calendar')rc();

}
