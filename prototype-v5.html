<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay v5 — AI 通信副驾</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
:root{--bg:#070708;--surface:#0d0d0f;--card:#111113;--border:#1a1a1e;--text:#e8e8ed;--text2:#888;--text3:#555;--accent:#5b8def;--accent2:#7c5bef;--green:#4ade80;--yellow:#facc15;--red:#f87171;--purple:#a78bfa;--cyan:#22d3ee;--fm:'Inter','SF Pro',system-ui,sans-serif;--radius:8px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--fm);font-size:14px;line-height:1.5;overflow:hidden;height:100vh;-webkit-font-smoothing:antialiased;}
.win{display:flex;flex-direction:column;height:100vh;background:var(--surface);}
/* Titlebar */
.titlebar{display:flex;align-items:center;justify-content:space-between;height:32px;padding:0 12px;background:var(--bg);border-bottom:1px solid var(--border);-webkit-app-region:drag;user-select:none;flex-shrink:0;}
.titlebar-l{display:flex;align-items:center;gap:8px;}
.titlebar-dots{display:flex;gap:5px;}
.titlebar-dot{width:8px;height:8px;border-radius:50%;background:var(--border);}
.titlebar-dot:nth-child(1){background:#f87171;}
.titlebar-dot:nth-child(2){background:#facc15;}
.titlebar-dot:nth-child(3){background:#4ade80;}
.titlebar-text{font-size:.55rem;color:var(--text3);font-weight:500;letter-spacing:.02em;}
.titlebar-r{display:flex;align-items:center;gap:6px;-webkit-app-region:no-drag;}
.titlebar-btn{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;color:var(--text2);font-size:.55rem;background:transparent;border:1px solid transparent;}
.titlebar-btn:hover{background:var(--card);border-color:var(--border);color:var(--text);}
/* Main layout */
.body{display:flex;flex:1;overflow:hidden;}
.sb{width:44px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;flex-shrink:0;}
.sb-logo{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.65rem;color:#fff;margin-bottom:4px;}
.sb-item{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);position:relative;border:none;background:transparent;transition:.15s;}
.sb-item svg{width:16px;height:16px;}
.sb-item:hover{color:var(--text);background:var(--card);}
.sb-item.active{color:var(--accent);background:rgba(91,141,239,.12);}
.sb-item .badge{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:var(--red);color:#fff;font-size:.4rem;display:flex;align-items:center;justify-content:center;}
.sb-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:2px;}
.sb-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:.5rem;color:#fff;font-weight:600;cursor:pointer;margin-top:2px;}
/* Main area */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{display:flex;align-items:center;height:38px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border);gap:10px;flex-shrink:0;}
.topbar-title{font-size:.65rem;font-weight:600;color:var(--text);white-space:nowrap;}
.topbar-badge{font-size:.5rem;color:var(--text3);background:var(--card);padding:1px 6px;border-radius:4px;}
.topbar-s{flex:1;max-width:240px;position:relative;}
.topbar-s svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:12px;height:12px;color:var(--text3);}
.topbar-s input{width:100%;height:26px;background:var(--card);border:1px solid var(--border);border-radius:5px;padding:0 8px 0 24px;font-size:.55rem;color:var(--text);outline:none;}
.topbar-s input:focus{border-color:var(--accent);}
.topbar-s input::placeholder{color:var(--text3);}
.topbar-r{display:flex;align-items:center;gap:6px;margin-left:auto;}
.topbar-notif{position:relative;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;color:var(--text2);background:transparent;border:1px solid transparent;}
.topbar-notif:hover{background:var(--card);border-color:var(--border);}
.topbar-notif .nd{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent);}
/* Content */
.content-wrap{flex:1;overflow:hidden;position:relative;}
.view{display:none;height:100%;overflow-y:auto;}
.view.active{display:block;}
/* Lock screen */
.lock-overlay{position:fixed;inset:0;z-index:999;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.lock-overlay.show{display:flex;}
.lock-overlay .logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;color:#fff;}
.lock-hint{font-size:.6rem;color:var(--text2);}
.pin-row{display:flex;gap:10px;}
.pin-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--border);}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);}
.keypad{display:grid;grid-template-columns:repeat(3,52px);gap:8px;}
.keypad button{width:52px;height:52px;border-radius:50%;border:none;background:var(--card);color:var(--text);font-size:.75rem;cursor:pointer;font-family:var(--fm);transition:.1s;}
.keypad button:hover{background:var(--border);}
.keypad button.bi{color:var(--text3);font-size:.6rem;}
/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;font-size:.55rem;color:var(--text);display:flex;align-items:center;gap:10px;z-index:999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
.toast .undo{color:var(--accent);cursor:pointer;font-size:.5rem;text-decoration:underline;}
.toast .close{cursor:pointer;color:var(--text3);font-size:.5rem;}
/* Notif panel */
.notif-panel{position:absolute;top:34px;right:0;width:260px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);display:none;z-index:50;max-height:300px;overflow-y:auto;}
.notif-panel.show{display:block;}
.ni{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:.52rem;}
.ni:last-child{border:none;}
.ni-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.ni-t{flex:1;color:var(--text2);}
.ni-tm{color:var(--text3);font-size:.45rem;white-space:nowrap;}
/* Account dropdown */
.acct-dropdown{position:absolute;top:28px;right:0;width:220px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);display:none;z-index:50;}
.acct-dropdown.show{display:block;}
.ad-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--border);font-size:.52rem;}
.ad-item:last-child{border:none;}
.ad-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ad-m{flex:1;}
.ad-l{color:var(--text);font-weight:500;}
.ad-l span{color:var(--red);}
.ad-e{color:var(--text3);font-size:.45rem;}
.ad-s{font-size:.45rem;white-space:nowrap;}
/* People View */
.sp-split{display:flex;height:100%;}
.sp-list{width:300px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.sp-detail{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.ls{padding:8px 10px;border-bottom:1px solid var(--border);}
.ls input{width:100%;height:28px;background:var(--card);border:1px solid var(--border);border-radius:5px;padding:0 8px;font-size:.55rem;color:var(--text);outline:none;}
.ls input:focus{border-color:var(--accent);}
.lf{display:flex;gap:2px;padding:6px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.lf button{font-size:.5rem;padding:2px 8px;border-radius:4px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-family:var(--fm);}
.lf button.active{background:rgba(91,141,239,.15);color:var(--accent);}
.lf button:hover{color:var(--text);}
.lsc{flex:1;overflow-y:auto;padding:4px;}
.lc{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;transition:.1s;}
.lc:hover{background:var(--card);}
.lc.active{background:rgba(91,141,239,.1);}
.lc-a{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:.55rem;color:#fff;font-weight:600;flex-shrink:0;}
.lc-m{flex:1;min-width:0;}
.lc-n{font-size:.58rem;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lc-n span{font-weight:400;}
.lc-s{font-size:.48rem;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lc-r{display:flex;align-items:center;gap:4px;}
.sc{font-size:.45rem;padding:1px 6px;border-radius:3px;color:#000;font-weight:600;}
/* Detail */
.dtl{flex:1;overflow-y:auto;padding:14px;}
.pd-h{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.pd-av{width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:.75rem;color:#fff;font-weight:600;}
.pd-sc{display:flex;align-items:center;gap:6px;margin:8px 0;}
.pd-info{font-size:.52rem;color:var(--text2);}
.pd-ig{display:flex;align-items:center;gap:6px;margin:3px 0;}
.pd-ig svg{flex-shrink:0;}
.pd-fc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;}
.pd-c{padding:8px;background:var(--card);border-radius:6px;}
.pd-cl{font-size:.48rem;color:var(--text3);margin-bottom:2px;}
.pd-cv{font-size:.55rem;color:var(--text);}
.acct-tag{font-size:.45rem;padding:1px 5px;border-radius:3px;border:1px solid;margin:0 2px;}
.topic-tag{font-size:.48rem;color:var(--accent);cursor:pointer;margin:0 2px;}
.topic-tag:hover{text-decoration:underline;}
.pd-conns{background:var(--card);border-radius:6px;padding:8px;margin:8px 0;}
.pd-s{font-size:.52rem;font-weight:600;color:var(--text2);margin-bottom:4px;}
.pd-conn{display:flex;align-items:center;gap:6px;padding:4px;cursor:pointer;border-radius:4px;}
.pd-conn:hover{background:var(--border);}
.pd-msgs{margin:8px 0;}
.pd-msg{padding:6px 0;border-bottom:1px solid var(--border);font-size:.52rem;}
.pm-h{display:flex;align-items:center;gap:4px;}
.pm-ic{font-size:.4rem;padding:1px 4px;border-radius:2px;background:var(--card);color:var(--text3);}
.pm-fm{font-weight:500;color:var(--text);}
.pm-tm{margin-left:auto;color:var(--text3);font-size:.48rem;}
.pm-sub{font-size:.55rem;font-weight:500;margin:2px 0;}
.pm-prev{color:var(--text2);font-size:.5rem;}
.pm-at{display:flex;gap:4px;margin-top:2px;}
.pm-a{font-size:.45rem;padding:1px 5px;background:var(--card);border-radius:3px;color:var(--text2);}
.pd-acts{display:flex;gap:6px;margin-top:10px;}
.pd-acts button{font-size:.5rem;padding:4px 12px;border-radius:5px;border:none;background:var(--card);color:var(--text2);cursor:pointer;font-family:var(--fm);}
.pd-acts button:hover{background:var(--border);color:var(--text);}
/* Agent bar */
.agent-bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--border);background:var(--surface);}
.agent-bar input{flex:1;height:30px;background:var(--card);border:1px solid var(--border);border-radius:5px;padding:0 8px;font-size:.52rem;color:var(--text);outline:none;}
.agent-bar input:focus{border-color:var(--accent);}
.agent-bar button{height:30px;padding:0 12px;border-radius:5px;border:none;background:var(--accent);color:#fff;font-size:.5rem;cursor:pointer;font-family:var(--fm);}
/* Agent View */
.agv{display:flex;height:100%;}
.agv-c{flex:1;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border);}
.agv-c .h{font-size:.65rem;font-weight:600;padding:12px 14px 0;}
.agv-c .s{font-size:.5rem;color:var(--text3);padding:2px 14px 8px;}
.agv-ms{flex:1;overflow-y:auto;padding:0 14px;}
.am{padding:8px 0;}
.am-u{background:var(--card);padding:8px;border-radius:6px;font-size:.55rem;margin-bottom:4px;color:var(--text);}
.am-r{background:rgba(91,141,239,.06);padding:8px;border-radius:6px;font-size:.52rem;color:var(--text2);line-height:1.6;}
.am-r b{color:var(--text);}
.agv-in{display:flex;gap:6px;padding:8px 14px;border-top:1px solid var(--border);}
.agv-in input{flex:1;height:30px;background:var(--card);border:1px solid var(--border);border-radius:5px;padding:0 8px;font-size:.52rem;color:var(--text);outline:none;}
.agv-in button{height:30px;padding:0 12px;border-radius:5px;border:none;background:var(--accent);color:#fff;font-size:.5rem;cursor:pointer;font-family:var(--fm);}
.agv-s{width:280px;overflow-y:auto;flex-shrink:0;}
.ast{display:flex;border-bottom:1px solid var(--border);padding:6px 8px;gap:2px;}
.ast button{flex:1;font-size:.5rem;padding:3px 6px;border-radius:4px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-family:var(--fm);}
.ast button.active{background:rgba(91,141,239,.12);color:var(--accent);}
.at{padding:6px 10px;border-bottom:1px solid var(--border);}
.at-h{display:flex;align-items:center;gap:6px;font-size:.52rem;font-weight:500;}
.at-s{font-size:.4rem;padding:1px 5px;border-radius:3px;}
.at-s.go{background:rgba(74,222,128,.15);color:var(--green);}
.at-s.wt{background:rgba(250,204,21,.15);color:var(--yellow);}
.at-steps{padding:4px 0 0 10px;}
.at-step{font-size:.48rem;color:var(--text3);padding:1px 0;}
.at-step.done{color:var(--text2);}
.at-step.done::before{content:"\\2713 ";color:var(--green);}
.ad{padding:6px 10px;border-bottom:1px solid var(--border);font-size:.52rem;}
.ad-to{color:var(--text3);font-size:.48rem;}
.ad-sub{font-weight:500;}
.ad-acts{display:flex;gap:4px;margin-top:4px;}
.ad-acts button{font-size:.45rem;padding:2px 8px;border-radius:4px;border:none;background:var(--card);color:var(--text2);cursor:pointer;font-family:var(--fm);}
.ad-acts button:hover{background:var(--border);}
.al{display:flex;align-items:center;gap:4px;padding:5px 10px;border-bottom:1px solid var(--border);font-size:.48rem;}
.al-high{font-size:.38rem;padding:1px 4px;border-radius:2px;background:rgba(248,113,113,.15);color:var(--red);}
.al-low{font-size:.38rem;padding:1px 4px;border-radius:2px;background:rgba(74,222,128,.15);color:var(--green);}
.al-a{color:var(--text);width:40px;}
.al-t{color:var(--text2);flex:1;}
.al-tm{color:var(--text3);font-size:.42rem;}
/* Inbox View */
.iv{display:flex;height:100%;}
.il{width:340px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;}
.ii{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;}
.ii:hover{background:var(--card);}
.ii-a{width:24px;height:24px;border-radius:5px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:.45rem;flex-shrink:0;font-weight:600;}
.ii-m{min-width:0;}
.ii-h{display:flex;align-items:center;gap:4px;}
.ii-f{font-size:.55rem;font-weight:500;}
.ii-p{font-size:.45rem;color:var(--text3);}
.ii-t{margin-left:auto;font-size:.45rem;color:var(--text3);}
.ii-s{font-size:.52rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ii-pr{font-size:.48rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ii-tag{font-size:.4rem;padding:1px 4px;border-radius:3px;background:rgba(91,141,239,.12);color:var(--accent);margin-right:4px;}
.ii-fl{font-size:.4rem;padding:1px 4px;border-radius:3px;background:rgba(250,204,21,.12);color:var(--yellow);}
.id{flex:1;overflow-y:auto;padding:14px;}
.btn-sm{font-size:.48rem;padding:3px 10px;border-radius:4px;border:none;background:var(--card);color:var(--text2);cursor:pointer;font-family:var(--fm);}
.btn-sm:hover{background:var(--border);color:var(--text);}
.att-item{font-size:.5rem;padding:4px 8px;background:var(--card);border-radius:4px;margin:2px 0;display:inline-block;}
/* Analytics */
.ang{padding:16px 20px;}
.stat-card{background:var(--card);padding:10px;border-radius:6px;text-align:center;}
.stat-v{font-size:.85rem;font-weight:700;color:var(--text);}
.stat-l{font-size:.5rem;color:var(--text3);margin-top:2px;}
.barchart{display:flex;gap:8px;height:80px;align-items:flex-end;padding:8px 0;}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;}
.bc-b{width:100%;border-radius:4px 4px 0 0;min-height:12px;opacity:.8;transition:.2s;}
.bc-l{font-size:.45rem;margin-top:4px;color:var(--text2);}
/* Files */
.fg{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;}
.fc{display:flex;align-items:center;gap:8px;padding:8px;background:var(--card);border-radius:6px;}
.fc-ic{width:28px;height:28px;border-radius:6px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:.5rem;color:var(--text2);}
.fc-m{min-width:0;}
.fc-n{font-size:.52rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fc-meta{font-size:.45rem;color:var(--text3);}
.file-toolbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;}
.file-toolbar input{width:200px;height:28px;background:var(--card);border:1px solid var(--border);border-radius:5px;padding:0 8px;font-size:.52rem;color:var(--text);outline:none;}
/* Calendar */
.cl{padding:14px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:.5rem;border-radius:4px;cursor:pointer;color:var(--text2);}
.cal-d.today{background:var(--accent);color:#fff;font-weight:600;}
.cal-d.has::after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:var(--accent);bottom:2px;}
.cal-d:hover{background:var(--card);}
.me{padding:8px;background:var(--card);border-radius:6px;margin-bottom:6px;}
.me-p{font-size:.5rem;padding:2px 8px;background:rgba(91,141,239,.12);color:var(--accent);border-radius:4px;cursor:pointer;}
/* Settings */
.ss{padding:14px;}
.setting-label{font-size:.55rem;font-weight:600;color:var(--text);margin-bottom:6px;}
.sd{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);}
.sd-l{font-size:.52rem;color:var(--text2);}
.sd-t input[type=checkbox]{accent-color:var(--accent);}
/* Graph View */
.gv{height:100%;display:flex;flex-direction:column;}
.gv-toolbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
.gv-toolbar .h{font-size:.6rem;font-weight:600;}
.gv canvas{flex:1;width:100%!important;height:auto!important;}
.gv-info{position:absolute;bottom:10px;left:14px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:.48rem;color:var(--text2);pointer-events:none;}
/* Extraction View */
.exv{padding:14px;}
.ex-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;}
.ex-card .h{font-size:.58rem;font-weight:600;margin-bottom:6px;}
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.ex-item{padding:4px 6px;background:var(--surface);border-radius:4px;}
.ex-label{font-size:.45rem;color:var(--text3);}
.ex-val{font-size:.52rem;color:var(--text);}
.ex-source{font-size:.4rem;color:var(--text3);margin-top:2px;display:flex;gap:4px;}
.ex-source .tag{padding:1px 4px;border-radius:2px;font-size:.38rem;}
/* Entity resolution */
.er-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;}
.er-card .h{font-size:.58rem;font-weight:600;margin-bottom:6px;}
.er-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border);}
.er-row:last-child{border:none;}
.er-prov{width:40px;font-size:.45rem;color:var(--text3);}
.er-val{flex:1;font-size:.52rem;}
.er-match{font-size:.4rem;padding:1px 6px;border-radius:3px;}
.er-match.high{background:rgba(74,222,128,.15);color:var(--green);}
.er-match.med{background:rgba(250,204,21,.15);color:var(--yellow);}
.er-match.low{background:rgba(248,113,113,.15);color:var(--red);}
/* Unified search */
.us-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding-top:60px;}
.us-overlay.show{display:flex;}
.us-panel{width:520px;max-height:70vh;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.us-input{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);}
.us-input input{flex:1;border:none;background:transparent;font-size:.6rem;color:var(--text);outline:none;font-family:var(--fm);}
.us-input input::placeholder{color:var(--text3);}
.us-close{cursor:pointer;color:var(--text3);font-size:.55rem;}
.us-results{max-height:50vh;overflow-y:auto;}
.us-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;}
.us-item:hover{background:var(--surface);}
.us-type{font-size:.4rem;padding:1px 5px;border-radius:3px;background:var(--surface);color:var(--text3);flex-shrink:0;width:36px;text-align:center;}
.us-t{font-size:.52rem;color:var(--text);flex:1;}
.us-sub{font-size:.45rem;color:var(--text3);}
/* Draft preview */
.draft-preview{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:8px;margin:4px 0;font-size:.5rem;color:var(--text2);}
/* Search overlay */
.sr-overlay{position:absolute;top:36px;left:50%;transform:translateX(-50%);width:400px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);display:none;z-index:50;max-height:300px;overflow-y:auto;}
.sr-overlay.show{display:block;}
.sr-item{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--border);font-size:.5rem;cursor:pointer;}
.sr-item:last-child{border:none;}
.sr-item:hover{background:var(--surface);}
.sr-t{font-size:.4rem;padding:1px 4px;border-radius:2px;background:var(--surface);color:var(--text3);}
/* Onboarding */
.onboard-overlay{position:fixed;inset:0;z-index:888;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;}
.onboard-overlay.show{display:flex;}
.ob-card{width:380px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;text-align:center;}
.ob-card .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;color:#fff;margin:0 auto 10px;}
.ob-card h2{font-size:.75rem;font-weight:600;margin-bottom:4px;}
.ob-card p{font-size:.55rem;color:var(--text3);margin-bottom:12px;}
.ob-steps{display:flex;justify-content:center;gap:6px;margin-bottom:14px;}
.ob-steps .ss{width:6px;height:6px;border-radius:50%;background:var(--border);}
.ob-steps .ss.active{background:var(--accent);}
.ob-providers{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;}
.pr{padding:8px;border:1px solid var(--border);border-radius:6px;font-size:.52rem;cursor:pointer;color:var(--text2);}
.pr:hover{border-color:var(--accent);color:var(--text);}
.primary{width:100%;padding:8px;border-radius:6px;border:none;background:var(--accent);color:#fff;font-size:.55rem;cursor:pointer;font-family:var(--fm);}
.primary:hover{opacity:.9;}
.ob-demo-btn{background:none;border:none;color:var(--text3);font-size:.5rem;cursor:pointer;margin-top:8px;font-family:var(--fm);}
.ob-demo-btn:hover{color:var(--text);}
.ob-progress{width:100%;height:4px;background:var(--border);border-radius:2px;margin-bottom:8px;overflow:hidden;}
.ob-progress .f{height:100%;background:var(--accent);border-radius:2px;transition:width 1s;}
.ob-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.ob-grid .item{padding:10px;background:var(--surface);border-radius:6px;}
.ob-grid .v{font-size:.9rem;font-weight:700;}
.ob-grid .l{font-size:.5rem;color:var(--text3);}
/* Graph nodes legend */
.graph-legend{position:absolute;top:10px;right:14px;display:flex;flex-direction:column;gap:3px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:.45rem;}
.graph-legend .gl-item{display:flex;align-items:center;gap:6px;color:var(--text2);}
.graph-legend .gl-dot{width:8px;height:8px;border-radius:50%;}
/* Cross-account badge */
.ca-badge{display:inline-flex;align-items:center;gap:3px;font-size:.38rem;padding:1px 5px;border-radius:3px;background:rgba(91,141,239,.1);color:var(--accent);}
/* Scrollbar */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
::-webkit-scrollbar-thumb:hover{background:var(--text3);}
.h{font-size:.6rem;font-weight:600;margin-bottom:4px;}
.s{font-size:.5rem;color:var(--text3);}
/* Lc groups */
.lc-grp{margin-bottom:4px;}
.lc-gh{font-size:.48rem;color:var(--text3);padding:4px 8px;font-weight:500;}
.lc-gh span{color:var(--text2);font-size:.45rem;}
</style>
</head>

// ============== GRAPH ==============
function renderGraph(mode){gmode=mode||'all';
  const canvas=$id('graphCanvas');const ctx=canvas.getContext('2d');
  const W=canvas.parentElement.clientWidth||800;
  const H=canvas.parentElement.clientHeight||500;
  canvas.width=W;canvas.height=H;
  ctx.clearRect(0,0,W,H);
  let nodes=GRAPH.nodes.map(n=>({...n}));
  if(mode==='active'){const activeIds=D.contacts.filter(c=>c.grp==='active').map(c=>'p_'+c.id);nodes=nodes.filter(n=>activeIds.includes(n.id)||n.type!=='person'||n.id.startsWith('c_'));}
  else if(mode==='topic'){nodes=nodes.filter(n=>n.type==='topic'||n.type==='person');}
  const edges=GRAPH.edges.filter(e=>nodes.find(n=>n.id===e.s)&&nodes.find(n=>n.id===e.t));
  // Simple force layout
  const ps={};nodes.forEach((n,i)=>{ps[n.id]={x:W/2+(Math.random()-0.5)*W*0.5,y:H/2+(Math.random()-0.5)*H*0.5,vx:0,vy:0};});
  const center={x:W/2,y:H/2};
  for(let iter=0;iter<120;iter++){
    nodes.forEach(n=>{const p=ps[n.id];const dx=center.x-p.x;const dy=center.y-p.y;p.vx+=dx*0.001;p.vy+=dy*0.001;});
    nodes.forEach(a=>{nodes.forEach(b=>{if(a.id===b.id)return;const pa=ps[a.id],pb=ps[b.id];const dx=pb.x-pa.x,dy=pb.y-pa.y;const dist=Math.max(1,Math.sqrt(dx*dx+dy*dy));const force=100/(dist*dist);pa.vx-=dx/dist*force;pa.vy-=dy/dist*force;pb.vx+=dx/dist*force;pb.vy+=dy/dist*force;});});
    edges.forEach(e=>{const pa=ps[e.s],pb=ps[e.t];const dx=pb.x-pa.x,dy=pb.y-pa.y;const dist=Math.sqrt(dx*dx+dy*dy);const force=(dist-80)*0.01;pa.vx+=dx/dist*force;pa.vy+=dy/dist*force;pb.vx-=dx/dist*force;pb.vy-=dy/dist*force;});
    nodes.forEach(n=>{const p=ps[n.id];p.x+=p.vx;p.y+=p.vy;p.vx*=0.85;p.vy*=0.85;p.x=Math.max(10,Math.min(W-10,p.x));p.y=Math.max(10,Math.min(H-10,p.y));});
  }
  ctx.clearRect(0,0,W,H);
  edges.forEach(e=>{const pa=ps[e.s],pb=ps[e.t];ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);
    ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=.5;ctx.stroke();});
  nodes.forEach(n=>{const p=ps[n.id];
    const color=n.type==='person'?'#5b8def':n.type==='company'?'#4ade80':n.type==='topic'?'#facc15':'#a78bfa';
    const r=n.type==='person'?14:n.type==='company'?10:8;
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.globalAlpha=.7;ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle='#fff';ctx.font='6px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    if(n.label.length<=2)ctx.fillText(n.label,p.x,p.y);else{ctx.font='5px Inter,sans-serif';ctx.fillText(n.label.substring(0,3),p.x,p.y);}
  });
  canvas.onmousemove=function(e){const r=canvas.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;let found=null;
    nodes.forEach(n=>{const p=ps[n.id];const d=Math.sqrt((mx-p.x)**2+(my-p.y)**2);const maxR=n.type==='person'?16:n.type==='company'?12:10;if(d<maxR)found=n;});
    const info=$id('graphInfo');if(found){info.textContent=found.label+(found.co?' · '+found.co:'')+(found.sc?' · 评分:'+found.sc:'');info.style.display='block';}else{info.textContent='悬停查看关系';info.style.display='block';}}
}

function renderFiles(){const fg=$id('fg');const items=fftype==='all'?D._files:D._files.filter(f=>f.tp===fftype);
  fg.innerHTML=items.map(f=>{const p=D.getP(f.pid);return '<div class="fc"><div class="fc-ic">'+(f.tp==='pdf'?'e':f.tp==='image'?'i':'d')+'</div><div class="fc-m"><div class="fc-n">'+f.name+'</div><div class="fc-meta">'+f.sz+' · '+f.dt+(p?' · '+p.name:'')+'</div></div></div>';}).join('');}

function renderCalendar(){const cal=$id('cal');const today=new Date();const days=['日','一','二','三','四','五','六'];
  const firstDay=new Date(today.getFullYear(),today.getMonth(),1).getDay();
  const dim=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
  cal.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;padding:0 0 10px 0;"><div class="h">'+today.getFullYear()+'年'+(today.getMonth()+1)+'月</div></div>'+
    '<div class="cal-grid"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">'+days.map(d=>'<div style="text-align:center;font-size:.45rem;color:var(--text3);padding:4px 0;">'+d+'</div>').join('')+
    Array.from({length:firstDay},()=>'<div></div>').join('')+
    Array.from({length:dim},(_,i)=>{const day=i+1;const dayLabels={};D._meetings.forEach(m=>{if(m.dt==='今天')dayLabels[today.getDate()]=1;else if(m.dt==='明天')dayLabels[today.getDate()+1]=1;else if(m.dt==='昨天')dayLabels[today.getDate()-1]=1;});const hasEv=!!dayLabels[day];return '<div class="cal-d'+(day===today.getDate()?' today':'')+(hasEv?' has':'')+'" onclick="st(\''+day+'日详情\')">'+day+'</div>';}).join('')+
    '</div></div><div style="margin-top:10px;"><div class="h" style="margin-bottom:6px;">会议 ('+D._meetings.length+')</div>'+
    D._meetings.map(m=>{return '<div class="me"><div style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-size:.55rem;font-weight:500;">'+m.title+'</div><div style="font-size:.48rem;color:var(--text2);margin-top:2px;">'+m.ppl+' · '+m.dt+' '+m.tm+(m.br?' · 线上':' · 线下')+'</div></div><span class="me-p" onclick="selectP(\''+m.pids[0]+'\')">'+m.ppl.split(' ')[0]+'</span></div></div>';}).join('')+'</div>';}

// ============== SEARCH + NOTIF ==============
$id('gs').addEventListener('input',function(){const q=this.value.trim();if(!q)return;st('搜索: "'+q+'" — 跨账户搜索联系人/消息/文件/提取数据');});
$id('gs').addEventListener('keydown',function(e){if(e.key!=='Enter')return;const q=this.value.trim();if(!q)return;
  const lq=q.toLowerCase();let r=[];D.contacts.filter(c=>c.name.includes(lq)||c.co.includes(lq)||c.em.includes(lq)).forEach(c=>r.push(c.name+' · '+c.co));
  D._msgs.filter(m=>m.subj.toLowerCase().includes(lq)||m.prev.toLowerCase().includes(lq)).slice(0,3).forEach(m=>{const p=D.getP(m.pid);if(p)r.push('消息: '+m.subj.substring(0,30)+' — '+p.name);});
  D._files.filter(f=>f.name.toLowerCase().includes(lq)).slice(0,3).forEach(f=>r.push('文件: '+f.name));
  st('跨账户搜索结果: '+(r.length?r.slice(0,5).join(' | '):'无结果'));});
// ============== VIEW SWITCHER ==============
function switchView(view){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelectorAll('.sb-item').forEach(b=>b.classList.remove('active'));
  const vm={people:'vp',graph:'vg',agent:'va',inbox:'vi',extraction:'ve',analytics:'van',files:'vf',calendar:'vc',settings:'vs'};
  const vId=vm[view];if(vId){$id(vId).classList.add('active');const btn=document.querySelector('.sb-item[data-v="'+view+'"]');if(btn)btn.classList.add('active');}
  const t={people:'联系人',graph:'关系图谱',agent:'AI 助手',inbox:'统一收件箱',extraction:'AI 数据提取',analytics:'洞察',files:'文件管理',calendar:'日历',settings:'设置'};
  $id('vt').textContent=t[view]||'Relay';$id('vBadge').textContent='v5 · AI 提取 · 图谱';
  if(view==='people'){rpl(pfilt,$id('ps').value);if(cid)selectP(cid);else selectP('zl');}
  else if(view==='graph')setTimeout(()=>renderGraph(gmode),50);
  else if(view==='agent'){renderAgentSidebar(agentTab);}
  else if(view==='inbox')renderInbox();
  else if(view==='extraction')renderExtraction();
  else if(view==='analytics')renderAnalytics();
  else if(view==='files')renderFiles();
  else if(view==='calendar')renderCalendar();
  else if(view==='settings')renderSettings();}
document.querySelectorAll('.sb-item').forEach(btn=>{btn.addEventListener('click',function(){switchView(this.dataset.v);});});
