<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay — 完整产品原型 v3a</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,700,701,2,500,501,3,400,401&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:'Inter',-apple-system,sans-serif;background:#09090b;color:#fafafa;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:20px;overflow:hidden}
:root{--accent:#3b82f6;--accent-dim:#1e3a5f;--surface:#0c0c0e;--card:#18181b;--border:#27272a;--border-light:#1e1e22;--text:#fafafa;--text2:#a1a1aa;--text3:#52525b;--fd:'Satoshi','Inter',sans-serif;--fm:'JetBrains Mono',monospace;--rs:6px;--rm:10px;--rl:14px}
.win{width:100%;max-width:1360px;height:820px;max-height:90dvh;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(255,255,255,0.03),0 20px 60px rgba(0,0,0,0.5);position:relative}
.titlebar{height:38px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--border-light);flex-shrink:0}
.titlebar-dots{display:flex;gap:7px;margin-right:14px}
.titlebar-dot{width:11px;height:11px;border-radius:50%}
.titlebar-dot:nth-child(1){background:#ff5f57}.titlebar-dot:nth-child(2){background:#febc2e}.titlebar-dot:nth-child(3){background:#28c840}
.titlebar-text{font-size:0.7rem;color:var(--text3);margin:0 auto;font-family:var(--fm)}
.titlebar-lock{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);transition:all.12s;margin-left:auto;margin-right:10px}
.titlebar-lock:hover{color:var(--text2);background:rgba(255,255,255,0.04)}
.titlebar-lock.locked{color:var(--accent)}
.body{display:flex;flex:1;overflow:hidden}
.sb{width:56px;flex-shrink:0;border-right:1px solid var(--border-light);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:2px;background:#09090b}
.sb-logo{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;color:white;margin-bottom:6px}
.sb-item{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.12s;border:none;background:none;color:var(--text3);position:relative}
.sb-item:hover{background:rgba(255,255,255,0.04);color:var(--text2)}
.sb-item.active{background:rgba(59,130,246,0.1);color:var(--accent)}
.sb-item svg{width:20px;height:20px}
.sb-item .badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:white;font-size:0.5rem;display:flex;align-items:center;justify-content:center;font-weight:600;padding:0 4px}
.sb-avatar{margin-top:auto;width:32px;height:32px;border-radius:50%;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:var(--accent);font-weight:600;cursor:pointer}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:48px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border-light);flex-shrink:0;gap:10px}
.topbar-title{font-family:var(--fd);font-weight:600;font-size:0.9rem;white-space:nowrap}
.topbar-badge{font-size:0.55rem;padding:2px 8px;border-radius:6px;background:rgba(59,130,246,0.1);color:var(--accent);font-family:var(--fm);white-space:nowrap}
.topbar-search{flex:1;max-width:380px;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--rs);border:1px solid var(--border-light);background:rgba(255,255,255,0.03);color:var(--text3);font-size:0.75rem;cursor:text;transition:all 0.2s}
.topbar-search:hover,.topbar-search:focus-within{border-color:var(--text3)}
.topbar-search input{flex:1;background:none;border:none;color:var(--text);font-size:0.75rem;outline:none;font-family:inherit}
.topbar-right{display:flex;align-items:center;gap:6px;margin-left:auto}
.topbar-right .notif{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--text3);transition:all 0.12s}
.topbar-right .notif:hover{background:rgba(255,255,255,0.04);color:var(--text2)}
.topbar-right .notif .nd{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#f87171}
.topbar-right .notif svg{width:16px;height:16px}
.topbar-status{font-size:0.65rem;color:var(--text3);display:flex;align-items:center;gap:4px;white-space:nowrap}
.acct-pill{display:flex;align-items:center;gap:4px;padding:2px 8px 2px 4px;border-radius:6px;border:1px solid var(--border-light);cursor:pointer;font-size:0.55rem;color:var(--text3);position:relative;transition:all.12s}
.acct-pill:hover{border-color:var(--text3)}
.acct-pill .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.acct-dropdown{position:absolute;top:100%;left:0;margin-top:4px;width:240px;background:var(--card);border:1px solid var(--border);border-radius:var(--rm);box-shadow:0 10px 40px rgba(0,0,0,0.4);z-index:200;display:none;max-height:320px;overflow-y:auto}
.acct-dropdown.show{display:block}
.acct-dd-item{padding:8px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:1px solid var(--border-light)}
.acct-dd-item:last-child{border-bottom:none}
.acct-dd-item:hover{background:rgba(255,255,255,0.02)}
.acct-dd-item .av{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:0.5rem;font-weight:600;color:white;flex-shrink:0}
.acct-dd-item .inf{flex:1;min-width:0}
.acct-dd-item .inf .l{font-size:0.72rem;font-weight:500}
.acct-dd-item .inf .s{font-size:0.55rem;color:var(--text3);margin-top:1px}
.acct-dd-item .st{font-size:0.5rem;font-family:var(--fm);padding:1px 6px;border-radius:4px}
.acct-dd-item .st.ok{background:rgba(34,197,94,0.1);color:#4ade80}
.acct-dd-item .st.er{background:rgba(239,68,68,0.1);color:#f87171}
.acct-dd-item .st.sy{background:rgba(250,204,21,0.1);color:#facc15}
.content{flex:1;overflow:hidden;display:none;padding:0}
.content.active{display:block}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rm);padding:20px}
.split{display:flex;height:100%}
.split-l{width:300px;flex-shrink:0;border-right:1px solid var(--border-light);display:flex;flex-direction:column;overflow:hidden}
.split-r{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.ls{padding:10px 14px;border-bottom:1px solid var(--border-light);flex-shrink:0}
.ls input{width:100%;padding:7px 10px;border-radius:var(--rs);border:1px solid var(--border-light);background:rgba(255,255,255,0.03);color:var(--text);font-size:0.78rem;outline:none}
.ls input:focus{border-color:var(--accent)}
.lf{display:flex;gap:4px;padding:6px 12px 2px;flex-wrap:wrap;flex-shrink:0}
.lf button{padding:2px 9px;border-radius:10px;font-size:0.6rem;background:transparent;border:1px solid var(--border-light);color:var(--text3);cursor:pointer;transition:all 0.12s}
.lf button.active{background:rgba(59,130,246,0.1);border-color:var(--accent);color:var(--accent)}
.lsc{flex:1;overflow-y:auto;padding:2px 6px}
.pc{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--rs);cursor:pointer;transition:all 0.12s}
.pc:hover{background:rgba(255,255,255,0.03)}
.pc.active{background:rgba(59,130,246,0.08)}
.pc .av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:600}
.pc .inf{flex:1;min-width:0}
.pc .inf .nm{font-size:0.8rem;font-weight:500}
.pc .inf .mt{font-size:0.62rem;color:var(--text3);margin-top:1px}
.pc .sd{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.pc .sc{font-size:0.6rem;font-family:var(--fm);padding:1px 5px;border-radius:5px;flex-shrink:0}
.dtl{padding:16px 22px;flex:1;overflow-y:auto}
.dtl-hdr{display:flex;align-items:flex-start;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--border-light)}
.dtl-hdr .av{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.95rem;font-weight:600}
.dtl-hdr .nm{font-family:var(--fd);font-weight:700;font-size:1.1rem}
.dtl-hdr .ttl{font-size:0.75rem;color:var(--text2);margin-top:1px}
.dtl-hdr .stage{font-size:0.5rem;padding:1px 7px;border-radius:4px;font-family:var(--fm);margin-left:6px}
.dtl-ch{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.dtl-ch span{font-size:0.55rem;padding:1px 6px;border-radius:3px;background:rgba(255,255,255,0.04);color:var(--text3);font-family:var(--fm);display:flex;align-items:center;gap:3px}
.dtl-ch span .d{width:4px;height:4px;border-radius:50%;display:inline-block}
.dtl-hlth{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 12px;background:rgba(255,255,255,0.02);border-radius:var(--rs);border:1px solid var(--border-light)}
.dtl-hlth .scr{display:flex;align-items:center;gap:5px;font-size:0.78rem;font-weight:600}
.dtl-hlth .trd{font-size:0.55rem;font-family:var(--fm);padding:1px 5px;border-radius:4px}
.dtl-hlth .trd.up{background:rgba(34,197,94,0.1);color:#4ade80}
.dtl-hlth .trd.dn{background:rgba(239,68,68,0.1);color:#f87171}
.dtl-hlth .lbl{font-size:0.7rem;color:var(--text2)}
.dtl-hlth .sug{margin-left:auto;font-size:0.65rem;color:var(--accent);cursor:pointer;white-space:nowrap}
.dtl-tabs{display:flex;gap:0;border-bottom:1px solid var(--border-light);margin-top:12px;flex-shrink:0}
.dtl-tab{padding:8px 16px;font-size:0.72rem;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.12s;white-space:nowrap}
.dtl-tab:hover{color:var(--text2)}
.dtl-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.dtl-pn{flex:1;overflow-y:auto;padding:10px 0}
.msg-r{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--border-light);cursor:pointer;transition:opacity 0.12s}
.msg-r:hover{opacity:0.8}
.msg-r .ic{width:26px;height:26px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.8rem;background:rgba(255,255,255,0.03)}
.msg-r .bd{flex:1;min-width:0}
.msg-r .hd{display:flex;align-items:center;gap:6px;margin-bottom:1px}
.msg-r .hd .fm{font-size:0.75rem;font-weight:500}
.msg-r .hd .tg{font-size:0.5rem;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,0.04);color:var(--text3);font-family:var(--fm)}
.msg-r .hd .tm{font-size:0.55rem;color:var(--text3);margin-left:auto;font-family:var(--fm)}
.msg-r .hd .acct-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-right:2px}
.msg-r .subj{font-size:0.75rem;color:var(--text2)}
.msg-r .prev{font-size:0.65rem;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-r .fl{display:inline-flex;align-items:center;gap:3px;font-size:0.5rem;padding:1px 6px;border-radius:3px;margin-top:3px;cursor:pointer;font-family:var(--fm)}
.msg-r .fl.todo{background:rgba(250,204,21,0.1);color:#facc15}
.msg-r .fl.done{background:rgba(34,197,94,0.1);color:#4ade80}
.msg-r .fl.wait{background:rgba(59,130,246,0.1);color:var(--accent)}
.msg-r .at{display:flex;gap:3px;margin-top:3px}
.msg-r .at span{font-size:0.5rem;padding:1px 5px;border-radius:3px;background:rgba(59,130,246,0.06);color:var(--accent)}
.msg-r .ctx{font-size:0.55rem;color:var(--text3);margin-top:3px;display:flex;gap:4px}
.msg-r .ctx span{padding:1px 5px;border-radius:3px;background:rgba(255,255,255,0.03);display:flex;align-items:center;gap:3px}
.agent-bar{flex-shrink:0;border-top:1px solid var(--border-light);padding:10px 22px;display:flex;align-items:center;gap:8px;background:rgba(59,130,246,0.02)}
.agent-bar input{flex:1;padding:8px 12px;border-radius:var(--rs);border:1px solid var(--border-light);background:rgba(255,255,255,0.03);color:var(--text);font-size:0.78rem;font-family:inherit;outline:none}
.agent-bar input:focus{border-color:var(--accent)}
.agent-bar button{padding:8px 16px;background:var(--accent);color:white;border:none;border-radius:var(--rs);cursor:pointer;font-size:0.7rem;font-weight:600}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);gap:6px;padding:30px;text-align:center}
.empty p{font-size:0.78rem}
.empty .sub{font-size:0.62rem;color:var(--text3);margin-top:2px}
.empty .cta{margin-top:10px;padding:6px 16px;border-radius:var(--rs);background:var(--accent);color:white;border:none;cursor:pointer;font-size:0.65rem}
.merge-sug{padding:6px 10px;margin-top:8px;border:1px solid rgba(59,130,246,0.2);background:rgba(59,130,246,0.04);border-radius:var(--rs);font-size:0.62rem;color:var(--text2);display:flex;align-items:center;gap:8px}
.merge-sug button{padding:3px 10px;border-radius:var(--rs);border:1px solid var(--accent);background:rgba(59,130,246,0.1);color:var(--accent);cursor:pointer;font-size:0.55rem;white-space:nowrap}
.merge-sug .sp{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.lock-overlay{position:absolute;inset:0;z-index:500;background:rgba(9,9,11,0.92);backdrop-filter:blur(30px);display:none;flex-direction:column;align-items:center;justify-content:center;border-radius:14px}
.lock-overlay.show{display:flex}
.lock-overlay .logo{width:48px;height:48px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;color:white;margin-bottom:20px}
.lock-overlay .hint{font-size:0.65rem;color:var(--text3);margin-bottom:16px}
.pin-input{display:flex;gap:10px;margin-bottom:20px}
.pin-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--text3);transition:all.2s}
.pin-dot.filled{background:var(--accent);border-color:var(--accent)}
.pin-dot.active{border-color:var(--accent)}
.lock-overlay .keypad{display:grid;grid-template-columns:repeat(3,60px);gap:8px}
.lock-overlay .keypad button{width:60px;height:60px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text);font-size:1.1rem;cursor:pointer;transition:all.12s;display:flex;align-items:center;justify-content:center}
.lock-overlay .keypad button:hover{background:rgba(255,255,255,0.04);border-color:var(--text3)}
.lock-overlay .keypad button:active{background:rgba(59,130,246,0.1)}
.lock-overlay .keypad button.bi{font-size:0.5rem;color:var(--text3)}
.onboard-overlay{position:absolute;inset:0;z-index:400;background:rgba(9,9,11,0.95);backdrop-filter:blur(30px);display:none;flex-direction:column;align-items:center;justify-content:center;border-radius:14px}
.onboard-overlay.show{display:flex}
.ob-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:36px 40px;max-width:480px;width:90%;text-align:center}
.ob-card .logo{width:52px;height:52px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;color:white;margin:0 auto 16px}
.ob-card h2{font-family:var(--fd);font-size:1.2rem;margin-bottom:6px}
.ob-card p{font-size:0.78rem;color:var(--text2);line-height:1.6;margin-bottom:20px}
.ob-card .steps{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.ob-card .steps .ss{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all.3s}
.ob-card .steps .ss.active{background:var(--accent);width:24px;border-radius:4px}
.ob-card .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ob-card .btn-row button{padding:10px 24px;border-radius:var(--rs);font-size:0.78rem;font-weight:500;cursor:pointer;border:none}
.ob-card .btn-row .primary{background:var(--accent);color:white}
.ob-card .btn-row .secondary{background:transparent;border:1px solid var(--border);color:var(--text2)}
.ob-card .btn-row .link{background:none;color:var(--text3);font-size:0.7rem}
.ob-card .provider-list{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.ob-card .provider-list .pr{width:48px;height:48px;border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:var(--text2);cursor:pointer;transition:all.12s}
.ob-card .provider-list .pr:hover{border-color:var(--accent);color:var(--text)}
.ob-card .progress-bar{height:4px;border-radius:2px;background:var(--border);overflow:hidden;margin-bottom:16px}
.ob-card .progress-bar .f{height:100%;background:var(--accent);transition:width.5s;border-radius:2px}
.ob-card .demo-btn{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:8px 20px;border-radius:var(--rs);border:1px solid var(--border-light);color:var(--text2);cursor:pointer;font-size:0.7rem;background:transparent;transition:all.12s}
.ob-card .demo-btn:hover{border-color:var(--text3);color:var(--text)}
.milestone{padding:6px 0;border-left:2px solid var(--border);padding-left:14px;margin-left:4px;position:relative}
.milestone::before{content:'';position:absolute;left:-5px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.milestone .md{font-size:0.62rem;color:var(--text2)}
.milestone .mt{font-size:0.55rem;color:var(--text3);font-family:var(--fm)}
.toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--rm);font-size:0.72rem;color:var(--text2);box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:300;display:none;align-items:center;gap:8px}
.toast.show{display:flex}
.toast .undo{padding:4px 12px;border-radius:var(--rs);border:1px solid var(--accent);background:rgba(59,130,246,0.1);color:var(--accent);cursor:pointer;font-size:0.6rem}
.toast .close{margin-left:4px;cursor:pointer;color:var(--text3);font-size:0.7rem}
.ang{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px;height:100%;overflow-y:auto}
.anc{padding:18px}
.anc .t{font-size:0.8rem;font-weight:600;margin-bottom:14px}
.anc .ar{display:flex;align-items:center;gap:8px;padding:5px 0}
.anc .ar .bar{height:7px;border-radius:3px;transition:width 0.3s}
.anc .ar .l{font-size:0.68rem;color:var(--text2);width:50px;flex-shrink:0}
.anc .ar .v{font-size:0.6rem;color:var(--text3);font-family:var(--fm);width:25px;text-align:right}
.kg{padding:14px;height:220px;position:relative;overflow:hidden;background:rgba(255,255,255,0.01);border-radius:var(--rs)}
.kg .node{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.5rem;font-weight:600;cursor:pointer;transition:transform.2s;border:2px solid}
.kg .node:hover{transform:scale(1.2);z-index:10}
.sr-overlay{position:absolute;top:48px;left:80px;right:20px;max-width:500px;background:var(--card);border:1px solid var(--border);border-radius:var(--rm);box-shadow:0 10px 40px rgba(0,0,0,0.4);z-index:100;display:none;max-height:400px;overflow-y:auto}
.sr-overlay.show{display:block}
.sr-grp{padding:8px 0}
.sr-grp .st{padding:4px 16px;font-size:0.6rem;color:var(--text3);font-family:var(--fm);text-transform:uppercase}
.sr-item{padding:8px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:0.75rem}
.sr-item:hover{background:rgba(255,255,255,0.03)}
.sr-item .av{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.5rem}
.sr-item .txt{color:var(--text2)}
.sr-item .txt em{color:var(--accent);font-style:normal}
.sr-item .ct{font-size:0.52rem;color:var(--text3);margin-left:auto;font-family:var(--fm)}
.dr{margin-top:6px;padding:8px 10px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--rs);font-size:0.72rem;color:var(--text2);line-height:1.5}
.dr .ac{display:flex;gap:5px;margin-top:6px}
.dr .ac button{padding:3px 10px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.6rem}
.dr .ac button.apr{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,0.06)}
.dr .ac button.undo{color:#f87171;border-color:rgba(239,68,68,0.2)}
@keyframes fa{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.content.active>*{animation:fa 0.25s ease}
@media(max-width:1000px){
  body{padding:0}
  .win{max-height:100dvh;height:100dvh;max-width:100%;border-radius:0}
  .split-l{width:200px}
  .ang{grid-template-columns:1fr}
  .topbar-search{max-width:200px}
}
</style>
<style>
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:16px 20px;overflow-y:auto;height:100%}
.fc{padding:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;transition:all 0.12s}
.fc:hover{border-color:rgba(59,130,246,0.2)}
.fc .ic{font-size:1.3rem;margin-bottom:6px}
.fc .nm{font-size:0.75rem;font-weight:500;word-break:break-all}
.fc .mt{font-size:0.55rem;color:var(--text3);margin-top:3px}
.cl{padding:18px;overflow-y:auto;height:100%}
.ci{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border-light)}
.ci .dt{text-align:center;width:44px;flex-shrink:0}
.ci .dt .dy{font-family:var(--fd);font-size:1.3rem;font-weight:700;line-height:1}
.ci .dt .mn{font-size:0.55rem;color:var(--text3);text-transform:uppercase;margin-top:2px}
.ci .inf{flex:1}
.ci .inf .t{font-weight:500;font-size:0.82rem}
.ci .inf .p{font-size:0.7rem;color:var(--text2);margin-top:2px}
.ci .inf .mt{font-size:0.6rem;color:var(--text3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.ci .inf .mt .tag{font-size:0.5rem;padding:1px 5px;border-radius:3px;background:rgba(59,130,246,0.1);color:var(--accent);font-family:var(--fm)}
.ss{overflow-y:auto;height:100%;max-width:580px;padding:18px}
.sg{margin-bottom:28px}
.sg .st{font-size:0.8rem;font-weight:600;margin-bottom:10px}
.si{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-light)}
.si:last-child{border-bottom:none}
.si .nm{font-size:0.78rem;font-weight:500}
.si .dc{font-size:0.62rem;color:var(--text3);margin-top:1px}
.si .vl{font-size:0.62rem;font-family:var(--fm);flex-shrink:0}
.tg{width:34px;height:18px;border-radius:9px;background:var(--border);cursor:pointer;position:relative;transition:background 0.2s;flex-shrink:0}
.tg.on{background:var(--accent)}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:white;transition:transform 0.2s}
.tg.on::after{transform:translateX(16px)}
</style>
</head>
<body>
<script src="prototype-data.js"></script>
<div class="win" id="app">

<div class="lock-overlay" id="lockScreen">
  <div class="logo">R</div>
  <div class="hint" id="lockHint">输入 PIN 解锁</div>
  <div class="pin-input" id="pinDisplay"></div>
  <div class="keypad" id="keypad"></div>
</div>

<div class="onboard-overlay" id="onboardOverlay">
  <div class="ob-card"><div class="logo">R</div>
    <h2 id="obTitle">欢迎来到 Relay</h2>
    <p id="obDesc">你的 AI 通信副驾。数据归你，AI 替你行动。</p>
    <div class="steps" id="obSteps"><span class="ss active"></span><span class="ss"></span><span class="ss"></span></div>
    <div id="obBody"></div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><span class="undo" id="toastUndo" style="display:none">撤销</span><span class="close" onclick="ht()">✕</span></div>

<div class="titlebar">
  <div class="titlebar-dots"><div class="titlebar-dot"></div><div class="titlebar-dot"></div><div class="titlebar-dot"></div></div>
  <div class="titlebar-text">Relay — 你的 AI 通信副驾</div>
  <div class="titlebar-lock locked" id="lockBtn" onclick="toggleLock()">🔒</div>
</div>
<div class="body">
  <div class="sb">
    <div class="sb-logo">R</div>
    <button class="sb-item active" data-v="people" title="联系人"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="7" r="3"/><path d="M4 17c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg></button>
    <button class="sb-item" data-v="agent" title="AI 助手"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><path d="M6 10h8M10 6v8"/></svg><span class="badge">3</span></button>
    <button class="sb-item" data-v="inbox" title="收件箱"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="16" height="14" rx="2"/><path d="M2 10h4l2 3h4l2-3h4"/></svg><span class="badge">5</span></button>
    <button class="sb-item" data-v="analytics" title="洞察"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 18h16M5 14l3-7 4 4 4-9"/></svg></button>
    <button class="sb-item" data-v="files" title="文件"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h7l3 3v9a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg></button>
    <button class="sb-item" data-v="calendar" title="日历"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="16" height="15" rx="2"/><path d="M2 8h16M6 1v3M14 1v3"/></svg></button>
    <button class="sb-item" data-v="settings" title="设置"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="2.5"/><path d="M10 1.5v2M10 16.5v2M18.5 10h-2M3.5 10h-2M15.95 4.05l-1.41 1.41M5.46 14.54l-1.41 1.41M15.95 15.95l-1.41-1.41M5.46 5.46L4.05 4.05"/></svg></button>
    <div class="sb-avatar">E</div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="vt">联系人</div>
      <span class="topbar-badge">本地 · 2,139 条</span>
      <div style="position:relative" id="acctDropdownContainer">
        <div class="acct-pill" onclick="toggleAcctDropdown()">
          <span class="dot" style="background:#22c55e" id="acctStatusDot"></span>
          <span id="acctCount">6 账户</span><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3l3 4 3-4"/></svg>
        </div>
        <div class="acct-dropdown" id="acctDropdown"></div>
      </div>
      <div class="topbar-search" onclick="document.querySelector('.topbar-search input').focus()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10l3 3"/></svg>
        <input type="text" placeholder="搜索联系人、消息、文件..." oninput="onSearch(this.value)" onfocus="showSearchResults(this.value)" onblur="setTimeout(()=>hideSearch(),200)">
      </div>
      <div style="position:relative">
        <div class="topbar-right"><div class="notif" onclick="toggleNotif()"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3a6 6 0 00-6 6c0 3-1 4-2 5h16c-1-1-2-2-2-5a6 6 0 00-6-6zM8 16a2 2 0 004 0"/></svg><span class="nd"></span></div></div>
        <div class="notif-panel" id="notifPanel"></div>
      </div>
      <span class="topbar-status"><span style="width:5px;height:5px;border-radius:50%;background:#22c55e;display:inline-block;"></span> 索引中</span>
      <div class="sr-overlay" id="searchOverlay"></div>
    </div>

    <!-- ===== PEOPLE ===== -->
    <div class="content active" id="vp">
      <div class="split">
        <div class="split-l">
          <div class="ls"><input type="text" placeholder="搜索联系人..." oninput="searchPeople(this.value)" id="ps"></div>
          <div class="lf" id="pf">
            <button class="active" onclick="fp('all',this)">全部</button>
            <button onclick="fp('active',this)">活跃</button>
            <button onclick="fp('risk',this)">需跟进</button>
            <button onclick="fp('cold',this)">已冷淡</button>
            <button onclick="fp('company',this)">按公司</button>
          </div>
          <div class="lsc" id="pl"></div>
        </div>
        <div class="split-r">
          <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
            <div class="dtl" id="pd"></div>
            <div class="agent-bar">
              <input type="text" placeholder="跟 Relay 说：总结 / 起草 / 跟进..." id="pai" onkeydown="if(event.key==='Enter')hpa()">
              <button onclick="hpa()">发送</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== ANALYTICS ===== -->
    <div class="content" id="van"><div class="ang" id="ac"></div></div>

    <!-- ===== FILES placeholder ===== -->
    <div class="content" id="vf"><div class="empty"><p>文件视图</p><div class="sub">在 v3b 中查看完整功能</div></div></div>
    <!-- ===== CALENDAR placeholder ===== -->
    <div class="content" id="vc"><div class="empty"><p>日历视图</p><div class="sub">在 v3b 中查看完整功能</div></div></div>
    <!-- ===== SETTINGS placeholder ===== -->
    <div class="content" id="vs"><div class="empty"><p>设置视图</p><div class="sub">在 v3b 中查看完整功能</div></div></div>
    <!-- ===== AGENT placeholder ===== -->
    <div class="content" id="va"><div class="empty"><p>AI 助手</p><div class="sub">在 v3b 中查看完整功能</div></div></div>
    <!-- ===== INBOX placeholder ===== -->
    <div class="content" id="vi"><div class="empty"><p>收件箱</p><div class="sub">在 v3b 中查看完整功能</div></div></div>

  </div>
</div></div>

<script>
// GLOBALS
let cid='zl', pfilt='all', locked=false, pin='', pinCode='1234', acctOpen=false, notifOpen=false, obStep=0, toastTimer=null;

// ===== LOCK SCREEN =====
function renderPin(){
  const d=document.getElementById('pinDisplay');d.innerHTML='';
  for(let i=0;i<4;i++){const dot=document.createElement('div');dot.className='pin-dot'+(i<pin.length?' filled':'')+(i===pin.length?' active':'');d.appendChild(dot);}
}
function toggleLock(){
  if(locked){pin='';document.getElementById('lockScreen').classList.remove('show');document.getElementById('lockBtn').textContent='🔓';locked=false;return;}
  locked=true;document.getElementById('lockScreen').classList.add('show');document.getElementById('lockBtn').textContent='🔒';document.getElementById('lockHint').textContent='输入 PIN 解锁';pin='';renderPin();
}
(function(){
  const kp=document.getElementById('keypad');
  for(let i=1;i<=9;i++){const b=document.createElement('button');b.textContent=i;b.onclick=()=>{if(pin.length<4){pin+=String(i);renderPin();if(pin.length===4){if(pin===pinCode){setTimeout(()=>{document.getElementById('lockScreen').classList.remove('show');document.getElementById('lockBtn').textContent='🔓';locked=false;},200);}else{document.getElementById('lockHint').textContent='PIN 错误';setTimeout(()=>{pin='';renderPin();document.getElementById('lockHint').textContent='输入 PIN 解锁';},500);}}}};kp.appendChild(b);}
  const b0=document.createElement('button');b0.textContent='0';b0.onclick=()=>{if(pin.length<4){pin+='0';renderPin();}};kp.appendChild(b0);
  const bf=document.createElement('button');bf.textContent='⌫';bf.className='bi';bf.onclick=()=>{if(pin.length){pin=pin.slice(0,-1);renderPin();}};kp.appendChild(bf);
  const be=document.createElement('button');be.textContent='✓';be.className='bi';be.onclick=()=>{if(pin.length===4&&pin===pinCode){document.getElementById('lockScreen').classList.remove('show');document.getElementById('lockBtn').textContent='🔓';locked=false;}};kp.appendChild(be);
})();

// ===== ONBOARDING =====
function renderOnboarding(){
  document.querySelectorAll('#obSteps .ss').forEach((s,i)=>s.classList.toggle('active',i===obStep));
  const ob=document.getElementById('obBody');
  if(obStep===0){
    document.getElementById('obTitle').textContent='欢迎来到 Relay';document.getElementById('obDesc').textContent='你的 AI 通信副驾。数据归你，AI 替你行动。';
    ob.innerHTML=`<div class="provider-list"><div class="pr" onclick="obStep=2;renderOnboarding()">📧 Gmail</div><div class="pr">📧 Outlook</div><div class="pr">💬 Slack</div><div class="pr">💬 微信</div><div class="pr">📅 日历</div><div class="pr">➕</div></div><div class="btn-row"><button class="primary" onclick="obStep=2;renderOnboarding()">连接我的账户</button></div><button class="demo-btn" onclick="dismissOnboarding()">🎮 先看看演示</button>`;
  } else if(obStep===2){
    document.getElementById('obTitle').textContent='正在建立索引';document.getElementById('obDesc').textContent='Relay 正在学习你的通信模式';
    ob.innerHTML=`<div class="progress-bar"><div class="f" style="width:65%"></div></div><div style="color:var(--text3);font-size:0.65rem;margin-bottom:6px;font-family:var(--fm);">SendPalm 工作 · 已索引 824/1,247</div><div style="display:flex;gap:8px;justify-content:center;font-size:0.6rem;color:var(--text2);margin-bottom:16px;"><span>12 联系人</span><span>·</span><span>24 话题</span><span>·</span><span>3 关系圈</span></div><button class="primary" onclick="obStep=3;renderOnboarding()">继续</button>`;
  } else {
    document.getElementById('obTitle').textContent='你的第一个人脉洞察';document.getElementById('obDesc').textContent='这就是 Relay 的价值';
    ob.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0;"><div style="background:rgba(59,130,246,0.06);padding:12px;border-radius:var(--rs);text-align:center;"><div style="font-family:var(--fd);font-size:1.5rem;font-weight:700;color:var(--accent);">47</div><div style="font-size:0.6rem;color:var(--text3);">联系人</div></div><div style="background:rgba(74,222,128,0.06);padding:12px;border-radius:var(--rs);text-align:center;"><div style="font-family:var(--fd);font-size:1.5rem;font-weight:700;color:#4ade80;">2,139</div><div style="font-size:0.6rem;color:var(--text3);">消息</div></div><div style="background:rgba(250,204,21,0.06);padding:12px;border-radius:var(--rs);text-align:center;"><div style="font-family:var(--fd);font-size:1.5rem;font-weight:700;color:#facc15;">3</div><div style="font-size:0.6rem;color:var(--text3);">需跟进</div></div><div style="background:rgba(59,130,246,0.06);padding:12px;border-radius:var(--rs);text-align:center;"><div style="font-family:var(--fd);font-size:1.5rem;font-weight:700;color:var(--accent);">12.8h</div><div style="font-size:0.6rem;color:var(--text3);">可节省/周</div></div></div><button class="primary" onclick="dismissOnboarding()">开始使用</button>`;
  }
}
function dismissOnboarding(){document.getElementById('onboardOverlay').classList.remove('show');}

// ===== ACCOUNTS DROPDOWN =====
function toggleAcctDropdown(){
  acctOpen=!acctOpen;document.getElementById('acctDropdown').classList.toggle('show',acctOpen);
}
document.addEventListener('click',e=>{if(!e.target.closest('#acctDropdownContainer')){document.getElementById('acctDropdown').classList.remove('show');acctOpen=false;}});
function renderAcctDropdown(){
  const el=document.getElementById('acctDropdown');
  const accts=accounts.map(a=>{
    const stCl=a.status==='connected'?'ok':a.status==='error'?'er':'sy';
    const stLb=a.status==='connected'?'已连接':a.status==='error'?'⚠ 错误':`同步中 ${a.syncProgress?.done||0}/${a.syncProgress?.total||0}`;
    return `<div class="acct-dd-item"><div class="av" style="background:${a.color}">${a.avatar}</div><div class="inf"><div class="l">${a.label}</div><div class="s">${a.email||''} · ${a.synced}条 · ${a.lastSync}</div></div><span class="st ${stCl}">${stLb}</span></div>`;
  }).join('');
  const errBanner=accounts.filter(a=>a.status==='error').length?`<div style="padding:8px 12px;background:rgba(239,68,68,0.06);border-top:1px solid var(--border-light);font-size:0.62rem;color:#f87171;">⚠ ${accounts.filter(a=>a.status==='error').map(a=>a.label+': '+a.error).join('；')}</div>`:'';
  el.innerHTML=accts+errBanner;
  document.getElementById('acctStatusDot').style.background=accounts.some(a=>a.status==='error')?'#f87171':accounts.some(a=>a.status==='syncing')?'#facc15':'#22c55e';
}

// ===== TOAST =====
function showToast(msg,undoFn){
  document.getElementById('toastMsg').textContent=msg;
  const u=document.getElementById('toastUndo');
  if(undoFn){u.style.display='inline-block';u.onclick=()=>{undoFn();ht();};}else u.style.display='none';
  document.getElementById('toast').classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(ht,10000);
}
function ht(){document.getElementById('toast').classList.remove('show');clearTimeout(toastTimer);}

// ===== NOTIFICATIONS =====
function toggleNotif(){
  notifOpen=!notifOpen;document.getElementById('notifPanel').classList.toggle('show',notifOpen);
}
document.addEventListener('click',e=>{if(!e.target.closest('.notif')&&!e.target.closest('.notif-panel')){document.getElementById('notifPanel').classList.remove('show');notifOpen=false;}});
function renderNotif(){
  document.getElementById('notifPanel').innerHTML=`<div class="h">通知</div>${D.notifications.map(n=>`<div class="notif-item"><span class="nd"></span><div><div class="txt">${n.txt}</div><div class="tm">${n.tm}</div></div></div>`).join('')}`;
}

// ===== SEARCH =====
function onSearch(q){
  const o=document.getElementById('searchOverlay');
  if(!q.trim()){o.classList.remove('show');o.innerHTML='';return;}
  const cl=D.contacts.filter(c=>c.name.includes(q)||c.co.includes(q));
  const ms=D._msgs.filter(m=>m.subj.includes(q)||m.prev.includes(q));
  const fl=D._files.filter(f=>f.name.includes(q));
  let h='';
  if(cl.length)h+=`<div class="sr-grp"><div class="st">联系人 (${cl.length})</div>${cl.map(c=>`<div class="sr-item" onclick="sp('${c.id}');sv('people');hideSearch()"><div class="av" style="background:${c.scC}15;color:${c.scC}">${c.name[0]}</div><span class="txt"><em>${c.name}</em> · ${c.co}</span><span class="ct">${D.stageLabel[c.stage]||''}</span></div>`).join('')}</div>`;
  if(ms.length)h+=`<div class="sr-grp"><div class="st">消息 (${ms.length})</div>${ms.slice(0,3).map(m=>`<div class="sr-item"><span class="txt"><em>${m.subj}</em></span><span class="ct">${m.tm}</span></div>`).join('')}</div>`;
  if(fl.length)h+=`<div class="sr-grp"><div class="st">文件 (${fl.length})</div>${fl.slice(0,3).map(f=>`<div class="sr-item"><span class="txt"><em>${f.name}</em></span></div>`).join('')}</div>`;
  o.innerHTML=h||`<div style="padding:16px;font-size:0.7rem;color:var(--text3);text-align:center;">无结果</div>`;
  o.classList.add('show');
}
function showSearchResults(q){if(q&&q.trim())onSearch(q);}
function hideSearch(){document.getElementById('searchOverlay').classList.remove('show');}

// ===== PEOPLE =====
function rpl(f,pq){
  const el=document.getElementById('pl');
  let list=[...D.contacts];
  if(f==='active')list=list.filter(c=>c.grp==='active');
  else if(f==='risk')list=list.filter(c=>c.grp==='risk');
  else if(f==='cold')list=list.filter(c=>c.grp==='cold');
  if(pq)list=list.filter(c=>c.name.includes(pq)||c.co.includes(pq));
  if(!list.length){el.innerHTML='<div class="empty" style="height:200px;"><p>暂无联系人</p><div class="sub">连接账户来发现联系人</div></div>';return;}
  if(f==='company'){const g={};list.forEach(c=>{if(!g[c.co])g[c.co]=[];g[c.co].push(c)});
    el.innerHTML=Object.entries(g).map(([co,cs])=>`<div style="font-size:0.55rem;font-family:var(--fm);color:var(--text3);padding:10px 8px 4px;letter-spacing:0.05em;">${co.toUpperCase()}</div>${cs.map(c=>pcHTML(c)).join('')}`).join('');return;}
  const sorted=[...list].sort((a,b)=>{if(a.id===cid)return -1;if(b.id===cid)return 1;return b.sc-a.sc;});
  el.innerHTML=sorted.map(c=>pcHTML(c)).join('');
}
function pcHTML(c){

function sp(id){
  cid=id;const p=D.getP(id);if(!p)return;
  const msgs=D.getMsgs(id),files=D.getFiles(id),conns=D.getConnections(id),meets=D.getMeetings(id);
  const flL={todo:'需跟进',done:'已跟进',wait:'等回复'};
  const stC=D.stageColor[p.stage]||'';const stL=D.stageLabel[p.stage]||'';
  const acctPills=p.accounts.map(aid=>{const a=D.getAcct(aid);return a?`<span><span class="d" style="background:${a.color}"></span>${a.label.slice(0,8)}</span>`:''}).join('');
  const msgH=msgs.length?msgs.map(m=>{
    const a=m.accountId?D.getAcct(m.accountId):null;
    const ctx=m.ctx&&m.ctx.topic?`<div class="ctx">${m.ctx.topic?`<span>🏷️ ${m.ctx.topic}</span>`:''}${m.ctx.people&&m.ctx.people.length?`<span>👥 ${m.ctx.people.map(pid=>D.getP(pid)?.name||pid).join(',')}</span>`:''}</div>`:'';
    return `<div class="msg-r"><div class="ic">${m.ic}</div><div class="bd"><div class="hd">${a?`<span class="acct-dot" style="background:${a.color}"></span>`:''}<span class="fm">${m.fm}</span><span class="tg">${m.tag}</span><span class="tm">${m.tm}</span></div><div class="subj">${m.subj}</div><div class="prev">${m.prev}</div>${m.at.length?`<div class="at">${m.at.map(a=>`<span>📎 ${a}</span>`).join('')}</div>`:''}${m.fl?`<span class="fl ${m.fl}" onclick="event.stopPropagation();this.classList.toggle('done');this.textContent=this.classList.contains('done')?'✓ 已跟进':'○ ${flL[m.fl]}'">${m.fl==='todo'?'○ 需跟进':m.fl==='done'?'✓ 已跟进':'⟳ 等回复'}</span>`:''}${ctx}</div></div>`;
  }).join(''):'<div class="empty"><p>暂无沟通记录</p></div>';
  const fileH=files.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;">${files.map(f=>`<div style="padding:10px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;"><div style="font-size:1rem;margin-bottom:4px;">${f.tp==='image'?'🖼️':'📄'}</div><div style="font-size:0.68rem;font-weight:500;word-break:break-all;">${f.name}</div><div style="font-size:0.5rem;color:var(--text3);margin-top:2px;">${f.sz} · ${f.dt}</div></div>`).join('')}</div>`:'<div class="empty"><p>暂无文件</p></div>';
  const connH=conns.length?conns.map(c=>`<div class="pc" style="padding:6px 0;" onclick="sp('${c.id}')"><div class="av" style="width:28px;height:28px;font-size:0.6rem;background:${c.scC}15;color:${c.scC}">${c.name[0]}</div><div class="inf"><div class="nm" style="font-size:0.72rem;">${c.name}</div><div class="mt">${c.co===p.co?'同公司':'相似联系人'} · 健康度 ${c.sc}</div></div><span class="sc" style="font-size:0.55rem;background:${c.scC}15;color:${c.scC}">${c.sc}</span></div>`).join(''):'<div class="empty"><p>暂无相关联系人</p></div>';
  const calH=meets.length?meets.map(m=>`<div class="msg-r"><div class="ic">📅</div><div class="bd"><div class="hd"><span class="fm">${m.title}</span><span class="tg">${m.br?'简报✓':'待简报'}</span><span class="tm">${m.dt}</span></div><div class="prev">${m.ppl} · ${m.tm}</div><div style="font-size:0.6rem;color:var(--text3);margin-top:2px;">${m.notes}</div></div></div>`).join(''):'<div class="empty"><p>暂无会议</p></div>';
  const milestoneH=p.milestones.length?p.milestones.map(m=>`<div class="milestone"><div class="md">${m}</div></div>`).join(''):'';
  const topicH=p.topics.map(t=>`<span style="font-size:0.55rem;padding:1px 8px;border-radius:4px;background:rgba(59,130,246,0.08);color:var(--accent);font-family:var(--fm);cursor:pointer;" onclick="sv('analytics')">${t}</span>`).join(' ');
  document.getElementById('pd').innerHTML=`<div class="dtl-hdr"><div class="av" style="background:${p.scC}15;color:${p.scC}">${p.name[0]}</div><div style="flex:1"><div style="display:flex;align-items:center;gap:6px;"><div class="nm">${p.name}</div><span class="stage" style="background:${stC}15;color:${stC}">${stL}</span></div><div class="ttl">${p.co} · ${p.tl}</div><div class="dtl-ch">${acctPills}</div><div style="font-size:0.6rem;color:var(--text3);margin-top:3px;">${p.em} · 首次联系 ${p.firstContact}</div></div></div><div class="dtl-hlth"><div class="scr"><span style="width:8px;height:8px;border-radius:50%;background:${p.scC};display:inline-block;"></span>${p.sc}/100</div><span class="trd ${p.trd}">${p.trd==='up'?'↑ 上升':p.trd==='dn'?'↓ 下降':'→ 持平'}</span><span class="lbl">${p.scL}</span><span class="sug" onclick="sv('agent')">${D.stageSuggest[p.stage]||'AI 建议 →'}</span></div><div style="display:flex;gap:10px;margin-top:8px;padding:8px 10px;background:rgba(255,255,255,0.02);border-radius:var(--rs);font-size:0.65rem;color:var(--text2);flex-wrap:wrap;"><span>📊 ${p.pattern}</span><span style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">🏷️ ${topicH}</span></div>${p.accounts.length>1?`<div class="merge-sug">🔗 已自动合并 ${p.accounts.length} 个账户信息<button onclick="showToast('已拆分联系人')">详情</button></div>`:''}${milestoneH?`<div style="margin-top:10px;">${milestoneH}</div>`:''}<div class="dtl-tabs"><div class="dtl-tab active" onclick="sdt(this,'tl')">沟通记录${msgs.length?'('+msgs.length+')':''}</div><div class="dtl-tab" onclick="sdt(this,'fl')">文件(${files.length})</div><div class="dtl-tab" onclick="sdt(this,'cn')">关系网络(${conns.length})</div><div class="dtl-tab" onclick="sdt(this,'cl')">日历(${meets.length})</div></div><div class="dtl-pn" id="dpn">${msgH}</div>`;
  rpl(document.querySelector('#pf .active')?.textContent||'all');
}
function sdt(el,tab){
  document.querySelectorAll('.dtl-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
  const p=D.getP(cid);if(!p)return;
  const msgs=D.getMsgs(cid),files=D.getFiles(cid),conns=D.getConnections(cid),meets=D.getMeetings(cid);
  const flL={todo:'需跟进',done:'已跟进',wait:'等回复'};const pe=document.getElementById('dpn');
  if(tab==='tl'){pe.innerHTML=msgs.length?msgs.map(m=>{const a=m.accountId?D.getAcct(m.accountId):null;return `<div class="msg-r"><div class="ic">${m.ic}</div><div class="bd"><div class="hd">${a?`<span class="acct-dot" style="background:${a.color}"></span>`:''}<span class="fm">${m.fm}</span><span class="tg">${m.tag}</span><span class="tm">${m.tm}</span></div><div class="subj">${m.subj}</div><div class="prev">${m.prev}</div>${m.at.length?`<div class="at">${m.at.map(a=>`<span>📎 ${a}</span>`).join('')}</div>`:''}${m.fl?`<span class="fl ${m.fl}" onclick="event.stopPropagation();this.classList.toggle('done');this.textContent=this.classList.contains('done')?'✓ 已跟进':'○ ${flL[m.fl]}'">${m.fl==='todo'?'○ 需跟进':m.fl==='done'?'✓ 已跟进':'⟳ 等回复'}</span>`:''}</div></div>`;}).join(''):'<div class="empty"><p>暂无沟通记录</p></div>';}
  else if(tab==='fl'){pe.innerHTML=files.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;">${files.map(f=>`<div style="padding:10px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;"><div style="font-size:1rem;margin-bottom:4px;">${f.tp==='image'?'🖼️':'📄'}</div><div style="font-size:0.68rem;font-weight:500;word-break:break-all;">${f.name}</div><div style="font-size:0.5rem;color:var(--text3);margin-top:2px;">${f.sz} · ${f.dt}</div></div>`).join('')}</div>`:'<div class="empty"><p>暂无文件</p></div>';}
  else if(tab==='cn'){pe.innerHTML=conns.length?conns.map(c=>`<div class="pc" style="padding:6px 0;" onclick="sp('${c.id}')"><div class="av" style="width:28px;height:28px;font-size:0.6rem;background:${c.scC}15;color:${c.scC}">${c.name[0]}</div><div class="inf"><div class="nm" style="font-size:0.72rem;">${c.name}</div><div class="mt">${c.co===p.co?'🏢 同公司':'🔗 相似联系人'} · ${c.sc}</div></div><span class="sc" style="font-size:0.55rem;background:${c.scC}15;color:${c.scC}">${c.sc}</span></div>`).join(''):'<div class="empty"><p>暂无相关联系人</p></div>';}
  else{pe.innerHTML=meets.length?meets.map(m=>`<div class="msg-r"><div class="ic">📅</div><div class="bd"><div class="hd"><span class="fm">${m.title}</span><span class="tg">${m.br?'✅ 简报已生成':'⏳ 待生成'}</span><span class="tm">${m.dt}</span></div><div class="prev">${m.ppl} · ${m.tm}</div><div style="font-size:0.6rem;color:var(--text3);margin-top:2px;">${m.notes}</div></div></div>`).join(''):'<div class="empty"><p>暂无会议</p></div>';}
}
function searchPeople(q){rpl(document.querySelector('#pf .active')?.textContent||'all',q)}
function fp(f,btn){document.querySelectorAll('#pf button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');rpl(f,document.getElementById('ps').value);}
function hpa(){
  const inp=document.getElementById('pai'),txt=inp?.value?.trim();if(!txt)return;
  const pn=document.getElementById('dpn');if(!pn)return;const p=D.getP(cid);
  const d=document.createElement('div');d.style.cssText='padding:8px 0;border-bottom:1px solid var(--border-light);';
  const n=p?.name||'该联系人';let resp='';
  if(txt.includes('总结'))resp='好的，我总结了'+n+'的沟通记录：近期有'+D.getMsgs(cid).length+'条消息，主要涉及'+(p?.topics.join('、')||'多个话题')+'。';
  else if(txt.includes('起草')||txt.includes('写')){resp='好的，我已经起草了一封给'+n+'的邮件草稿。<div class="dr">Hi '+n+'，<br><br>希望一切顺利。关于我们上次讨论的'+(p?.topics[0]||'合作')+'，想同步一下最新进展。<br><br>Edwin<div class="ac"><button class="apr">✓ 批准发送</button><button>编辑</button><button class="undo">撤销</button></div></div>';showToast('✏️ 已起草给 '+n+' 的邮件',()=>{showToast('已撤销草稿');});}
  else if(txt.includes('跟进'))resp='好的，我会提醒你在合适的时间跟进'+n+'。目前'+(p?.lc.includes('天')?'已经'+p?.lc:'最近'+p?.lc)+'联系。';
  else resp='好的，关于'+n+'的「'+txt+'」，我来处理。';
  d.innerHTML='<div style="font-size:0.75rem;color:var(--accent);">🤖 Relay：'+resp+'</div>';pn.insertBefore(d,pn.firstChild);inp.value='';
}

function ra2(){
  const el=document.getElementById('ac');
  const days=['7/12','7/13','7/14','7/15','7/16','7/17','7/18'],vols=[12,8,15,10,18,22,12],mv=Math.max(...vols);
  const top=[...D.contacts].sort((a,b)=>b.sc-a.sc).slice(0,6),msc=top[0]?.sc||1;
  const kgNodes=[...D.contacts.slice(0,8),...Array.from(new Set(Object.values(D.contextLinks).flatMap(c=>c.people)))].filter((v,i,a)=>a.indexOf(v)===i).slice(0,10);
  el.innerHTML=`<div class="card anc"><div class="t">📊 沟通量趋势（近7天）</div>${days.map((d,i)=>`<div class="ar"><span class="l">${d}</span><div style="flex:1;background:rgba(255,255,255,0.03);border-radius:3px;height:7px;overflow:hidden;"><div class="bar" style="width:${(vols[i]/mv)*100}%;background:var(--accent);"></div></div><span class="v">${vols[i]}</span></div>`).join('')}<div style="margin-top:6px;font-size:0.6rem;color:var(--text3);">总计 97 条 · 日均 13.8 条</div></div>
  <div class="card anc"><div class="t">🏆 Top 联系人</div>${top.map(p=>`<div class="ar"><span class="l" style="width:40px;">${p.name}</span><div style="flex:1;background:rgba(255,255,255,0.03);border-radius:3px;height:7px;overflow:hidden;"><div class="bar" style="width:${(p.sc/msc)*100}%;background:${p.scC};"></div></div><span class="v">${p.sc}</span></div>`).join('')}<div style="margin-top:6px;font-size:0.6rem;color:var(--text3);">共 ${D.contacts.length} 个联系人 · 按健康度排序</div></div>
  <div class="card anc"><div class="t">⏱ 回复时间分布</div>${[{l:'1小时内',v:35},{l:'2-4h',v:28},{l:'半天',v:20},{l:'1-2天',v:12},{l:'>2天',v:5}].map(r=>`<div class="ar"><span class="l" style="width:65px;">${r.l}</span><div style="flex:1;background:rgba(255,255,255,0.03);border-radius:3px;height:7px;overflow:hidden;"><div class="bar" style="width:${(r.v/35)*100}%;background:#22c55e;"></div></div><span class="v">${r.v}%</span></div>`).join('')}<div style="margin-top:6px;font-size:0.6rem;color:var(--text3);">平均 3.2h · 比上月快 12%</div></div>
  <div class="card anc"><div class="t">📱 渠道占比</div>${[{l:'Gmail',v:68,c:'#ea4335'},{l:'Slack',v:18,c:'#4a154b'},{l:'Calendar',v:10,c:'#a78bfa'},{l:'微信',v:4,c:'#22c55e'}].map(c=>`<div class="ar"><span class="l" style="width:65px;">${c.l}</span><div style="flex:1;background:rgba(255,255,255,0.03);border-radius:3px;height:7px;overflow:hidden;"><div class="bar" style="width:${(c.v/68)*100}%;background:${c.c};"></div></div><span class="v">${c.v}%</span></div>`).join('')}</div>
  <div class="card anc"><div class="t">🕐 沟通时段分布</div>${[{l:'9-12点',v:40},{l:'12-14点',v:15},{l:'14-18点',v:35},{l:'18-21点',v:10}].map(t=>`<div class="ar"><span class="l" style="width:65px;">${t.l}</span><div style="flex:1;background:rgba(255,255,255,0.03);border-radius:3px;height:7px;overflow:hidden;"><div class="bar" style="width:${(t.v/40)*100}%;background:var(--accent);"></div></div><span class="v">${t.v}%</span></div>`).join('')}<div style="margin-top:6px;font-size:0.6rem;color:var(--text3);">高峰期：周二上午 + 周四下午</div></div>
  <div class="card anc"><div class="t">🔄 关系网络概览</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">${['华为','字节跳动','阿里巴巴','腾讯','美团','京东','百度','网易'].map(co=>{const cs=D.contacts.filter(c=>c.co===co);const avg=cs.length?Math.round(cs.reduce((s,c)=>s+c.sc,0)/cs.length):0;return `<div style="padding:8px;background:rgba(255,255,255,0.02);border-radius:var(--rs);"><div style="font-size:0.68rem;font-weight:500;">${co}</div><div style="font-size:0.55rem;color:var(--text3);margin-top:2px;">${cs.length}人 · 平均 ${avg}</div></div>`;}).join('')}</div></div>

    kg.innerHTML=nodes.map(n=>`<div class="node" style="left:${n.x}px;top:${n.y}px;width:${n.r}px;height:${n.r}px;border-color:${n.color};color:${n.color};background:${n.color}10;font-size:${Math.max(0.4,n.r/40)}rem;" title="${n.label}">${n.label[0]}</div>`).join('');
  }
}

const vn={people:'联系人',agent:'AI 助手',inbox:'收件箱',analytics:'洞察',files:'文件',calendar:'日历',settings:'设置'};
