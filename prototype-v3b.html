<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay — 完整产品原型 v3b</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,700,701,2,500,501,3,400,401&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:'Inter',-apple-system,sans-serif;background:#09090b;color:#fafafa;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:20px;overflow:hidden}
:root{--accent:#3b82f6;--accent-dim:#1e3a5f;--surface:#0c0c0e;--card:#18181b;--border:#27272a;--border-light:#1e1e22;--text:#fafafa;--text2:#a1a1aa;--text3:#52525b;--fd:'Satoshi','Inter',sans-serif;--fm:'JetBrains Mono',monospace;--rs:6px;--rm:10px;--rl:14px}
.win{width:100%;max-width:1360px;height:820px;max-height:90dvh;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(255,255,255,0.03),0 20px 60px rgba(0,0,0,0.5);position:relative}
.titlebar{height:38px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--border-light);flex-shrink:0}
.titlebar-dots{display:flex;gap:7px;margin-right:14px}
.titlebar-dot{width:11px;height:11px;border-radius:50%}
.titlebar-dot:nth-child(1){background:#ff5f57}.titlebar-dot:nth-child(2){background:#febc2e}.titlebar-dot:nth-child(3){background:#28c840}
.titlebar-text{font-size:0.7rem;color:var(--text3);margin:0 auto;font-family:var(--fm)}
.body{display:flex;flex:1;overflow:hidden}
.sb{width:56px;flex-shrink:0;border-right:1px solid var(--border-light);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:2px;background:#09090b}
.sb-logo{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;color:white;margin-bottom:6px}
.sb-item{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.12s;border:none;background:none;color:var(--text3);position:relative}
.sb-item:hover{background:rgba(255,255,255,0.04);color:var(--text2)}
.sb-item.active{background:rgba(59,130,246,0.1);color:var(--accent)}
.sb-item svg{width:20px;height:20px}
.sb-item .badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:white;font-size:0.5rem;display:flex;align-items:center;justify-content:center;font-weight:600;padding:0 4px}
.sb-avatar{margin-top:auto;width:32px;height:32px;border-radius:50%;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:var(--accent);font-weight:600;cursor:pointer}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:48px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border-light);flex-shrink:0;gap:10px}
.topbar-title{font-family:var(--fd);font-weight:600;font-size:0.9rem;white-space:nowrap}
.topbar-badge{font-size:0.55rem;padding:2px 8px;border-radius:6px;background:rgba(59,130,246,0.1);color:var(--accent);font-family:var(--fm);white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:6px;margin-left:auto}
.topbar-right .notif{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--text3);transition:all 0.12s}
.topbar-right .notif:hover{background:rgba(255,255,255,0.04);color:var(--text2)}
.topbar-right .notif .nd{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#f87171}
.topbar-right .notif svg{width:16px;height:16px}
.content{flex:1;overflow:hidden;display:none;padding:0}
.content.active{display:block}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.agv{display:flex;height:100%}
.agv-c{flex:1;display:flex;flex-direction:column;overflow:hidden}
.agv-c .h{padding:14px 22px 2px;font-weight:600;font-size:0.88rem;flex-shrink:0}
.agv-c .s{font-size:0.7rem;color:var(--text3);padding:0 22px 10px;flex-shrink:0}
.agv-ms{flex:1;overflow-y:auto;padding:6px 22px;display:flex;flex-direction:column;gap:10px}
.agv-m{display:flex;gap:9px;max-width:85%}
.agv-m.u{margin-left:auto;flex-direction:row-reverse}
.agv-m .b{padding:9px 12px;border-radius:var(--rm);font-size:0.78rem;line-height:1.5}
.agv-m.r .b{background:rgba(255,255,255,0.03);border:1px solid var(--border-light);color:var(--text2)}
.agv-m.u .b{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.2);color:var(--text)}
.agv-m .av{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.55rem;font-weight:600}
.agv-in{border-top:1px solid var(--border-light);padding:10px 22px;display:flex;gap:8px}
.agv-in input{flex:1;padding:8px 12px;border-radius:var(--rs);border:1px solid var(--border-light);background:rgba(255,255,255,0.03);color:var(--text);font-size:0.78rem;font-family:inherit;outline:none}
.agv-in input:focus{border-color:var(--accent)}
.agv-in button{padding:8px 16px;background:var(--accent);color:white;border:none;border-radius:var(--rs);cursor:pointer;font-size:0.7rem;font-weight:600}
.agv-s{width:280px;flex-shrink:0;border-left:1px solid var(--border-light);padding:14px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.agv-s .sb-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-light);margin-bottom:8px}
.agv-s .sb-tab{padding:6px 10px;font-size:0.65rem;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.agv-s .sb-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.agv-s .st{font-size:0.68rem;font-weight:600;color:var(--text3);margin-bottom:2px}
.tsk{padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--rs)}
.tsk .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.tsk .n{font-size:0.75rem;font-weight:500}
.tsk .s{font-size:0.5rem;padding:1px 6px;border-radius:4px;font-family:var(--fm)}
.tsk .s.go{background:rgba(59,130,246,0.1);color:var(--accent)}
.tsk .s.dn{background:rgba(34,197,94,0.1);color:#4ade80}
.tsk .s.wt{background:rgba(250,204,21,0.1);color:#facc15}
.tsk .d{font-size:0.65rem;color:var(--text3);line-height:1.4}
.tsk .step{font-size:0.6rem;color:var(--text2);margin-top:4px;font-family:var(--fm)}
.tsk .step .sp{color:#4ade80}
.tsk .step .sd{color:var(--text3)}
.ae{padding:6px 0;border-bottom:1px solid var(--border-light);font-size:0.65rem;display:flex;align-items:flex-start;gap:6px}
.ae:last-child{border-bottom:none}
.ae .ad{flex:1}
.ae .ad .aa{color:var(--text2)}
.ae .ad .at{color:var(--text3);font-size:0.55rem;margin-top:1px}
.ae .undo-btn{padding:2px 8px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--text3);cursor:pointer;font-size:0.5rem;flex-shrink:0}
.ae .undo-btn:hover{border-color:var(--accent);color:var(--accent)}
.ae .ast{font-size:0.5rem;padding:1px 5px;border-radius:3px;flex-shrink:0}
.ae .ast.done{background:rgba(34,197,94,0.1);color:#4ade80}
.ae .ast.pend{background:rgba(250,204,21,0.1);color:#facc15}
.ae .ast.err{background:rgba(239,68,68,0.1);color:#f87171}
.iv{display:flex;height:100%}
.il{width:340px;flex-shrink:0;border-right:1px solid var(--border-light);overflow-y:auto}
.ii{padding:12px 16px;border-bottom:1px solid var(--border-light);cursor:pointer}
.ii:hover,.ii.active{background:rgba(255,255,255,0.02)}
.ii .tp{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.ii .tp .nm{font-size:0.78rem;font-weight:500}
.ii .tp .tg{font-size:0.5rem;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,0.04);color:var(--text3);font-family:var(--fm);margin-left:auto}
.ii .subj{font-size:0.75rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ii .prev{font-size:0.65rem;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ii .tm{font-size:0.55rem;color:var(--text3);margin-top:3px}
.ii .fl{display:inline-flex;align-items:center;gap:2px;font-size:0.5rem;padding:1px 5px;border-radius:3px;font-family:var(--fm);margin-top:2px}
.ii .fl.todo{background:rgba(250,204,21,0.1);color:#facc15}
.id{flex:1;padding:18px 22px;overflow-y:auto;display:flex;flex-direction:column}
.id .subj{font-family:var(--fd);font-size:1rem;font-weight:600;margin-bottom:3px}
.id .from{font-size:0.75rem;color:var(--text2);margin-bottom:10px}
.id .acts{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.id .acts button{padding:4px 10px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.68rem}
.id .acts button:hover{border-color:var(--accent);color:var(--accent)}
.id .body{font-size:0.82rem;color:var(--text2);line-height:1.7;flex-shrink:0}
.id .ctx-panel{margin-top:14px;padding:12px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:var(--rs)}
.id .ctx-panel .t{font-size:0.65rem;font-weight:600;color:var(--text3);margin-bottom:6px}
.ctx-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.ctx-row span{font-size:0.58rem;padding:2px 8px;border-radius:4px;background:rgba(59,130,246,0.06);color:var(--accent);cursor:pointer}
.ctx-row span.s{background:rgba(34,197,94,0.06);color:#4ade80}
.ctx-row span.c{background:rgba(250,204,21,0.06);color:#facc15}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:16px 20px;overflow-y:auto;height:100%}
.fc{padding:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;transition:all 0.12s}
.fc:hover{border-color:rgba(59,130,246,0.2)}
.fc .ic{font-size:1.3rem;margin-bottom:6px}
.fc .nm{font-size:0.75rem;font-weight:500;word-break:break-all}
.fc .mt{font-size:0.55rem;color:var(--text3);margin-top:3px}
.cl{padding:18px;overflow-y:auto;height:100%}
.ci{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border-light)}
.ci .dt{text-align:center;width:44px;flex-shrink:0}
.ci .dt .dy{font-family:var(--fd);font-size:1.3rem;font-weight:700;line-height:1}
.ci .dt .mn{font-size:0.55rem;color:var(--text3);text-transform:uppercase;margin-top:2px}
.ci .inf{flex:1}
.ci .inf .t{font-weight:500;font-size:0.82rem}
.ci .inf .p{font-size:0.7rem;color:var(--text2);margin-top:2px}
.ci .inf .mt{font-size:0.6rem;color:var(--text3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.ci .inf .mt .tag{font-size:0.5rem;padding:1px 5px;border-radius:3px;background:rgba(59,130,246,0.1);color:var(--accent);font-family:var(--fm)}
.ss{overflow-y:auto;height:100%;max-width:580px;padding:18px}
.sg{margin-bottom:28px}
.sg .st{font-size:0.8rem;font-weight:600;margin-bottom:10px}
.si{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-light)}
.si:last-child{border-bottom:none}
.si .nm{font-size:0.78rem;font-weight:500}
.si .dc{font-size:0.62rem;color:var(--text3);margin-top:1px}
.si .vl{font-size:0.62rem;font-family:var(--fm);flex-shrink:0}
.tg{width:34px;height:18px;border-radius:9px;background:var(--border);cursor:pointer;position:relative;transition:background 0.2s;flex-shrink:0}
.tg.on{background:var(--accent)}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:white;transition:transform 0.2s}
.tg.on::after{transform:translateX(16px)}
.dr{margin-top:6px;padding:8px 10px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--rs);font-size:0.72rem;color:var(--text2);line-height:1.5}
.dr .ac{display:flex;gap:5px;margin-top:6px}
.dr .ac button{padding:3px 10px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.6rem}
.dr .ac button.apr{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,0.06)}
.dr .ac button.undo{color:#f87171;border-color:rgba(239,68,68,0.2)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);gap:6px;padding:30px;text-align:center}
.empty p{font-size:0.78rem}
.empty .sub{font-size:0.62rem;color:var(--text3);margin-top:2px}
.empty .cta{margin-top:10px;padding:6px 16px;border-radius:var(--rs);background:var(--accent);color:white;border:none;cursor:pointer;font-size:0.65rem}
.toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--rm);font-size:0.72rem;color:var(--text2);box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:300;display:none;align-items:center;gap:8px}
.toast.show{display:flex}
.toast .undo{padding:4px 12px;border-radius:var(--rs);border:1px solid var(--accent);background:rgba(59,130,246,0.1);color:var(--accent);cursor:pointer;font-size:0.6rem}
.toast .close{margin-left:4px;cursor:pointer;color:var(--text3);font-size:0.7rem}
@keyframes fa{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.content.active>*{animation:fa 0.25s ease}
@media(max-width:1000px){
  body{padding:0}
  .win{max-height:100dvh;height:100dvh;max-width:100%;border-radius:0}
  .il{width:250px}
  .agv-s{width:220px}
  .topbar-search{max-width:200px}
}
</style>
</head>
<body>
<script src="prototype-data.js"></script>
<div class="win" id="app">
<div class="toast" id="toast"><span id="toastMsg"></span><span class="undo" id="toastUndo" style="display:none">撤销</span><span class="close" onclick="ht()">✕</span></div>
<div class="titlebar">
  <div class="titlebar-dots"><div class="titlebar-dot"></div><div class="titlebar-dot"></div><div class="titlebar-dot"></div></div>
  <div class="titlebar-text">Relay — 你的 AI 通信副驾</div>
</div>
<div class="body">
  <div class="sb">
    <div class="sb-logo">R</div>
    <button class="sb-item" data-v="people" title="联系人"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="7" r="3"/><path d="M4 17c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg></button>
    <button class="sb-item active" data-v="agent" title="AI 助手"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><path d="M6 10h8M10 6v8"/></svg><span class="badge">3</span></button>
    <button class="sb-item" data-v="inbox" title="收件箱"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="16" height="14" rx="2"/><path d="M2 10h4l2 3h4l2-3h4"/></svg><span class="badge">5</span></button>
    <button class="sb-item" data-v="analytics" title="洞察"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 18h16M5 14l3-7 4 4 4-9"/></svg></button>
    <button class="sb-item" data-v="files" title="文件"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h7l3 3v9a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg></button>
    <button class="sb-item" data-v="calendar" title="日历"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="16" height="15" rx="2"/><path d="M2 8h16M6 1v3M14 1v3"/></svg></button>
    <button class="sb-item" data-v="settings" title="设置"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="2.5"/><path d="M10 1.5v2M10 16.5v2M18.5 10h-2M3.5 10h-2M15.95 4.05l-1.41 1.41M5.46 14.54l-1.41 1.41M15.95 15.95l-1.41-1.41M5.46 5.46L4.05 4.05"/></svg></button>
    <div class="sb-avatar">E</div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="vt">AI 助手</div>
      <span class="topbar-badge">本地 · 2,139 条</span>
      <div class="sr-overlay" id="searchOverlay"></div>
    </div>

    <!-- ===== AGENT ===== -->
    <div class="content active" id="va">
      <div class="agv">
        <div class="agv-c">
          <div class="h">AI 助手</div>
          <div class="s">像跟助理说话一样，让 Relay 帮你处理沟通事务</div>
          <div class="agv-ms" id="ams"></div>
          <div class="agv-in">
            <input type="text" placeholder="跟 Relay 说..." id="ai" onkeydown="if(event.key==='Enter')sam()">
            <button onclick="sam()">发送</button>
          </div>
        </div>
        <div class="agv-s" id="as"></div>
      </div>
    </div>

    <!-- ===== INBOX ===== -->
    <div class="content" id="vi">
      <div class="iv">
        <div class="il" id="il"></div>
        <div class="id" id="idd"></div>
      </div>
    </div>

    <!-- ===== FILES ===== -->
    <div class="content" id="vf">
      <div style="display:flex;flex-direction:column;height:100%;">
        <div style="display:flex;gap:10px;padding:10px 18px;border-bottom:1px solid var(--border-light);align-items:center;flex-shrink:0;">
          <input type="text" placeholder="搜索文件..." style="flex:1;max-width:300px;padding:7px 10px;border-radius:var(--rs);border:1px solid var(--border-light);background:rgba(255,255,255,0.03);color:var(--text);font-size:0.75rem;outline:none;" oninput="ff(this.value)">
          <div class="lf" style="padding:0;" id="ff">
            <button class="active" onclick="fft('all',this)">全部</button>
            <button onclick="fft('pdf',this)">PDF</button>
            <button onclick="fft('doc',this)">文档</button>
            <button onclick="fft('image',this)">图片</button>
          </div>
        </div>
        <div class="fg" id="fg"></div>
      </div>
    </div>

    <!-- ===== CALENDAR ===== -->
    <div class="content" id="vc"><div class="cl" id="cal"></div></div>

    <!-- ===== SETTINGS ===== -->
    <div class="content" id="vs"><div class="ss" id="ss"></div></div>

  </div>
</div></div>

<script>
let agentSideTab='tasks',ia=0,fftype='all',toastTimer=null;

function showToast(msg,undoFn){
  document.getElementById('toastMsg').textContent=msg;
  const u=document.getElementById('toastUndo');
  if(undoFn){u.style.display='inline-block';u.onclick=()=>{undoFn();ht();};}else u.style.display='none';
  document.getElementById('toast').classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(ht,10000);
}
function ht(){document.getElementById('toast').classList.remove('show');clearTimeout(toastTimer);}

// ===== AGENT =====
function ra(){
  const ms=document.getElementById('ams');
  ms.innerHTML='<div class="agv-m r"><div class="av" style="background:rgba(59,130,246,0.15);color:var(--accent);">R</div><div class="b">早上好！昨晚处理了 47 条消息。<br><br><strong>建议操作：</strong><br>• 给王洋写 Q4 提案跟进邮件（45天未回复）<br>• 回复陈欣的合作更新（1小时前）<br>• 激活李晨关系（62天未联系）</div></div>';
  rs();
}
function rs(){
  const s=document.getElementById('as');
  s.innerHTML=`<div class="sb-tabs"><div class="sb-tab ${agentSideTab==='tasks'?'active':''}" onclick="switchAgentTab('tasks')">任务</div><div class="sb-tab ${agentSideTab==='log'?'active':''}" onclick="switchAgentTab('log')">操作日志</div></div>`;
  if(agentSideTab==='tasks'){
    const tasks=D.agentTasks.map(t=>`<div class="tsk"><div class="h"><span class="n">${t.name}</span><span class="s ${t.status}">${t.status==='go'?'进行中':t.status==='done'?'已完成':'待处理'}</span></div><div class="step">${t.steps.map(st=>`<div style="margin:2px 0;">${st.d?'<span class="sp">✓</span>':'<span class="sd">○</span>'} ${st.l}</div>`).join('')}</div></div>`).join('');
    const drafts=D.agentDrafts.map(d=>`<div class="tsk" style="border-color:rgba(59,130,246,0.15);"><div class="h"><span class="n">✏️ 给 ${d.to}</span><span class="s wt">待审批</span></div><div class="d" style="font-size:0.6rem;">${d.subj}</div></div>`).join('');
    const comp=D.agentCompleted.map(c=>`<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:0.65rem;color:var(--text2);"><span style="color:#4ade80;">✓</span><span style="flex:1;">${c.name}</span><span style="color:var(--text3);font-size:0.55rem;">${c.saved}</span></div>`).join('');
    s.innerHTML+=`<div class="st">进行中的任务</div>${tasks||'<div style="font-size:0.65rem;color:var(--text3);">暂无</div>'}<div class="st" style="margin-top:10px;">待审批草稿</div>${drafts||'<div style="font-size:0.65rem;color:var(--text3);">暂无</div>'}<div class="st" style="margin-top:10px;">已完成</div><div style="padding:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);">${comp||'暂无'}</div>`;
  } else {
    const audit=D.agentAuditLog.map(a=>{
      const stC=a.status==='completed'?'done':a.status==='pending_approval'?'pend':'err';
      const stL=a.status==='completed'?`✓ ${a.time}`:a.status==='pending_approval'?'待审批':'错误';
      return `<div class="ae"><div class="ad"><div class="aa">${a.action==='draft'?'✏️ 起草':a.action==='summarize'?'📋 摘要':a.action==='analyze'?'📊 分析':a.action==='remind'?'🔔 提醒':a.action==='send'?'📨 发送':a.action} — ${a.target}</div><div class="at">${a.detail}</div></div>${a.undoable?`<button class="undo-btn" onclick="undoAction('${a.id}')">撤销</button>`:''}<span class="ast ${stC}">${stL}</span></div>`;
    }).join('');
    s.innerHTML+=`<div class="st">审批设置</div><div style="padding:8px 10px;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:8px;"><div style="display:flex;align-items:center;justify-content:space-between;font-size:0.65rem;"><span style="color:var(--text2);">低风险自动执行</span><span class="tg on" onclick="this.classList.toggle('on')"></span></div><div style="display:flex;align-items:center;justify-content:space-between;font-size:0.65rem;margin-top:4px;"><span style="color:var(--text2);">起草/发送需审批</span><span class="tg on" onclick="this.classList.toggle('on')"></span></div></div><div class="st">操作日志</div>${audit||'暂无'}`;
  }
  s.innerHTML+=`<div class="tsk" style="margin-top:auto;border-color:rgba(59,130,246,0.15);"><div style="font-size:0.72rem;font-weight:500;">本周影响</div><div style="display:flex;gap:12px;margin-top:4px;font-size:0.6rem;color:var(--text3);"><span>✓ 8 个任务</span><span>⏱ 节省 3.2h</span><span>📨 47 条处理</span></div></div>`;
}
function switchAgentTab(t){agentSideTab=t;rs();}
function undoAction(id){
  const a=D.agentAuditLog.find(l=>l.id===id);if(!a)return;
  showToast(`已撤销：${a.action} ${a.target}`,null);
}
function sam(){
  const inp=document.getElementById('ai'),txt=inp.value.trim();if(!txt)return;
  const box=document.getElementById('ams');
  const u=document.createElement('div');u.className='agv-m u';
  u.innerHTML='<div class="av" style="background:var(--accent-dim);color:var(--accent);">E</div><div class="b">'+txt+'</div>';
  box.appendChild(u);inp.value='';box.scrollTop=box.scrollHeight;
  setTimeout(()=>{
    const r=document.createElement('div');r.className='agv-m r';
    let reply;
    if(txt.includes('邮件')||txt.includes('跟进')||txt.includes('写')||txt.includes('草稿')){
      reply='好的，草稿已写好：<div class="dr">Hi 王洋，<br><br>希望一切顺利。之前发您的Q4提案，想了解一下内部对齐的进展。不知下周是否有空通个电话？<br><br>Edwin<div class="ac"><button class="apr">✓ 批准发送</button><button>编辑</button><button class="undo">撤销</button></div></div>';
      showToast('✏️ 已起草给王洋的邮件',null);
    } else if(txt.includes('总结')||txt.includes('汇总')){
      reply='正在分析中。本周有 47 条消息、3 个进行中项目、8 个待审批草稿。详细报告 2 分钟后生成。<br><br><span style="font-size:0.6rem;color:var(--text3);">来源：Gmail · Slack · 微信</span>';
    } else if(txt.includes('会议')||txt.includes('简报')){
      reply='已生成明天 Q4 合同评审会议简报。包含：张磊邮件历史摘要、3 份附件关键内容、双方待办事项。';
    } else if(txt.includes('李晨')||txt.includes('激活')){
      reply='已起草给李晨的问候：<div class="dr">Hi 李晨，好久不见！最近在看技术合作的新方向，想起之前我们聊的方案，方便的话约个时间聊聊。<br><br>Edwin<div class="ac"><button class="apr">✓ 批准发送</button><button>编辑</button></div></div>';
    } else {reply='收到，正在处理中。完成后通知你。';}
    r.innerHTML='<div class="av" style="background:rgba(59,130,246,0.15);color:var(--accent);">R</div><div class="b">'+reply+'</div>';
    box.appendChild(r);box.scrollTop=box.scrollHeight;
  },1200);
}

// ===== INBOX =====
function ri(){
  const l=document.getElementById('il');const grp={};
  D.contacts.forEach(c=>{const ms=D.getMsgs(c.id);if(ms.length)grp[c.id]={p:c,ms};});
  if(!Object.keys(grp).length){l.innerHTML='<div class="empty" style="height:200px;"><p>暂无消息</p><div class="sub">连接账户后自动同步</div></div>';document.getElementById('idd').innerHTML='<div class="empty"><p>选择一条消息</p></div>';return;}
  l.innerHTML=Object.values(grp).map((g,i)=>`<div class="ii ${i===ia?'active':''}" onclick="sii(this,${i})"><div class="tp"><div class="pc" style="padding:0;background:none;width:auto;display:inline-flex;"><div class="av" style="width:22px;height:22px;font-size:0.55rem;background:${g.p.scC}15;color:${g.p.scC}">${g.p.name[0]}</div></div><span class="nm">${g.p.name}</span><span class="tg">${g.ms[0].ch}</span></div><div class="subj">${g.ms[0].subj}</div><div class="prev">${g.ms[0].prev}</div><div class="tm">${g.ms[0].tm} · ${g.ms.length}条</div>${g.ms.some(m=>m.fl==='todo')?'<span class="fl todo">○ 待跟进</span>':''}</div>`).join('');
  const first=l.querySelector('.ii');if(first)sii(first,0);
}
function sii(el,idx){
  document.querySelectorAll('.ii').forEach(e=>e.classList.remove('active'));el.classList.add('active');ia=idx;
  const grp={};D.contacts.forEach(c=>{const ms=D.getMsgs(c.id);if(ms.length)grp[c.id]={p:c,ms};});
  const vals=Object.values(grp);if(idx>=vals.length)return;
  const g=vals[idx];if(!g)return;const m=g.ms[0];const d=document.getElementById('idd');
  let ctxH='';
  if(m.ctx&&m.ctx.topic){
    const c=D.contextLinks[m.ctx.topic];
    if(c){
      const people=c.people.map(pid=>{const p2=D.getP(pid);return p2?`<span class="s" onclick="sv('people')">👤 ${p2.name}</span>`:'';}).join('');
      ctxH=`<div class="ctx-panel"><div class="t">📎 相关知识上下文</div>${people?`<div class="ctx-row">相关联系人：${people}</div>`:''}${c.files.length?`<div class="ctx-row">📄 关联文件：${c.files.map((f,i)=>{const fi=D._files.find(x=>x.id===f);return fi?`<span>${fi.name}</span>`:'';}).filter(Boolean).join('')}</div>`:''}${c.meetings.length?`<div class="ctx-row">📅 关联会议：${c.meetings.map(mid=>{const mi=D._meetings.find(x=>x.id===mid);return mi?`<span>${mi.title}</span>`:'';}).filter(Boolean).join('')}</div>`:''}<div style="font-size:0.5rem;color:var(--text3);margin-top:4px;">话题「${m.ctx.topic}」涉及 ${c.people.length} 人、${c.files.length} 个文件、${c.meetings.length} 个会议</div></div>`;
    }
  }
  d.innerHTML=`<div class="subj">${m.subj}</div><div class="from"><span style="font-weight:500;">${g.p.name}</span> · ${g.p.em} · ${m.tm}</div><div class="acts"><button>回复</button><button onclick="sv('agent')">交给 AI 处理</button><button onclick="sv('people')">查看联系人</button><button>归档</button></div><div class="body">${m.prev}<br><br>——<br>来自 ${m.ch} · Relay 统一收件箱${m.at.length?'<br><br>📎 附件：'+m.at.join(', '):''}</div>${ctxH}`;
}

// ===== FILES =====
function rf(){
  const g=document.getElementById('fg');
  let fs=[...D._files];if(fftype!=='all')fs=fs.filter(f=>f.tp===fftype);
  g.innerHTML=fs.map(f=>{const p=D.getP(f.pid);return `<div class="fc"><div class="ic">${f.tp==='image'?'🖼️':'📄'}</div><div class="nm">${f.name}</div><div class="mt">${p?.name||'未知'} · ${f.sz} · ${f.dt}</div></div>`;}).join('')||'<div class="empty" style="grid-column:1/-1;"><p>无匹配文件</p></div>';
}
function ff(q){document.querySelectorAll('.fc').forEach(c=>{c.style.display=(c.querySelector('.nm')?.textContent||'').includes(q)?'':'none';});}
function fft(f,btn){fftype=f;document.querySelectorAll('#ff button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');rf();}

// ===== CALENDAR =====
function rc(){
  document.getElementById('cal').innerHTML=D._meetings.map(m=>{
    const pp=m.pids.map(pid=>D.getP(pid)).filter(Boolean);
    return `<div class="ci"><div class="dt"><div class="dy">${m.dt.split('/')[1]||m.dt.split(' ')[0]}</div><div class="mn">${m.dt.includes('明天')?'今':m.dt.includes('下')?'下':m.dt.includes('已')?'上':m.dt.split('/')[0]}月</div></div><div class="inf"><div class="t">${m.title}</div><div class="p">${m.ppl} · ${m.tm}</div><div class="mt">${m.br?'<span class="tag">✅ 简报已生成</span>':'<span class="tag" style="background:rgba(250,204,21,0.1);color:#facc15;">⏳ 待生成简报</span>'}${pp.map(p=>`<span style="font-size:0.5rem;padding:1px 5px;border-radius:3px;background:${p.scC}15;color:${p.scC};">${p.name} ${p.sc}/100</span>`).join('')}</div><div style="font-size:0.58rem;color:var(--text3);margin-top:4px;">${m.notes}</div>${m.prep.length?`<div style="font-size:0.55rem;color:var(--text2);margin-top:4px;">📋 准备清单：${m.prep.join(' · ')}</div>`:''}${m.post?`<div style="font-size:0.55rem;color:#4ade80;margin-top:2px;">${m.post}</div>`:''}<div style="display:flex;gap:6px;margin-top:6px;">${pp.map(p=>`<button style="padding:2px 8px;border:1px solid var(--border);border-radius:4px;font-size:0.55rem;color:var(--text2);background:transparent;cursor:pointer;" onclick="sv('people')"><span style="width:4px;height:4px;border-radius:50%;background:${p.scC};display:inline-block;"></span>${p.name}</button>`).join('')}${m.br?'<button style="padding:2px 8px;border:1px solid var(--accent);border-radius:4px;font-size:0.55rem;color:var(--accent);background:rgba(59,130,246,0.06);cursor:pointer;">📄 查看简报</button>':'<button style="padding:2px 8px;border:1px solid var(--border);border-radius:4px;font-size:0.55rem;color:var(--text2);background:transparent;cursor:pointer;" onclick="sv(\'agent\')">让 AI 生成简报</button>'}</div></div></div>`;
  }).join('');
}

// ===== SETTINGS =====
function rs2(){
  document.getElementById('ss').innerHTML=`<div class="sg"><div class="st">已连接的账户</div><div class="card" style="padding:0 18px;">${accounts.map(a=>{
    const st=a.status==='connected'?'已连接':a.status==='error'?'错误':a.status==='syncing'?`同步中 ${a.syncProgress?.done||0}/${a.syncProgress?.total||0}`:'未连接';
    const cl=a.status==='connected'?'#22c55e':a.status==='error'?'#f87171':'#facc15';
    return `<div class="si"><div><div class="nm"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${cl};margin-right:6px;"></span>${a.label}</div><div class="dc">${a.email||''} · ${a.synced}条 · 隐私模式: ${a.privacy==='unified'?'统一图谱':'独立视图'}</div></div><div class="vl" style="color:${cl};">${st}</div></div>`;
  }).join('')}</div></div>
  <div class="sg"><div class="st">安全</div><div class="card" style="padding:0 18px;">
    <div class="si"><div><div class="nm">应用锁（PIN）</div><div class="dc">锁定后需要 PIN 码解锁</div></div><div class="tg on" onclick="this.classList.toggle('on')"></div></div>
    <div class="si"><div><div class="nm">截屏保护</div><div class="dc">防止截屏工具捕获窗口内容</div></div><div class="tg on" onclick="this.classList.toggle('on')"></div></div>
    <div class="si"><div><div class="nm">剪贴板清理</div><div class="dc">离开应用后自动清除剪贴板</div></div><div class="tg on" onclick="this.classList.toggle('on')"></div></div>
    <div class="si" style="border-bottom:none;"><div><div class="nm">自动锁定</div><div class="dc">5 分钟无操作后自动锁定</div></div><div class="tg on" onclick="this.classList.toggle('on')"></div></div>
  </div></div>
  <div class="sg"><div class="st">通知偏好</div><div class="card" style="padding:0 18px;">
    <div class="si"><div><div class="nm">关系健康预警</div><div class="dc">联系人冷淡时通知</div></div><div class="tg on" onclick="this.classList.toggle('on')"></div></div>
    <div class="si"><div><div class="nm">草稿待审批</div><div class="dc">AI 草稿生成后提醒</div></div><div class="tg on" onclick="this.classList.toggle('on')"></div></div>
    <div class="si"><div><div class="nm">跟进提醒</div><div class="dc">待跟进超时未处理</div></div><div class="tg on" onclick="this.classList.toggle('on')"></div></div>
    <div class="si" style="border-bottom:none;"><div><div class="nm">安静时段</div><div class="dc">22:00 - 08:00 不推送</div></div><div class="tg on" onclick="this.classList.toggle('on')"></div></div>
  </div></div>
  <div class="sg"><div class="st">数据管理</div><div class="card" style="padding:0 18px;">
    <div class="si"><div><div class="nm">本地数据库</div><div class="dc">284 MB · 2,139 条 · ${D.contacts.length} 个联系人</div></div><div class="vl" style="color:var(--accent);cursor:pointer;">重建索引</div></div>
    <div class="si"><div><div class="nm">导出数据</div><div class="dc">关系图谱 + 偏好 (JSON)</div></div><div class="vl" style="color:var(--accent);cursor:pointer;">导出</div></div>
    <div class="si" style="border-bottom:none;"><div><div class="nm">清除所有数据</div><div class="dc">删除索引和缓存，账户保持连接</div></div><div class="vl" style="color:#f87171;cursor:pointer;">清除</div></div>
  </div></div>
  <div class="sg"><div class="st">快捷键</div><div class="card" style="padding:12px 18px;">${[{k:'⌘K',d:'全局搜索'},{k:'⌘1-7',d:'切换视图'},{k:'⌘N',d:'给联系人发消息'},{k:'⌘I',d:'打开收件箱'},{k:'⌘.',d:'打开设置'},{k:'Esc',d:'关闭面板'}].map(s=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:0.72rem;"><span style="color:var(--text2);">${s.d}</span><span style="font-family:var(--fm);font-size:0.6rem;color:var(--text3);background:rgba(255,255,255,0.04);padding:2px 8px;border-radius:4px;">${s.k}</span></div>`).join('')}</div></div>`;
}

// ===== NAV =====
const vn={people:'联系人',agent:'AI 助手',inbox:'收件箱',analytics:'洞察',files:'文件',calendar:'日历',settings:'设置'};
function sv(v){
  document.querySelectorAll('.sb-item').forEach(e=>e.classList.remove('active'));
  document.querySelector(`.sb-item[data-v="${v}"]`).classList.add('active');
  document.querySelectorAll('.content').forEach(e=>e.classList.remove('active'));
  const mid={p:'vp',a:'va',i:'vi',n:'van',f:'vf',c:'vc',s:'vs'};
  document.getElementById(mid[v[0]]||'vp').classList.add('active');
  document.getElementById('vt').textContent=vn[v]||v;
  if(v==='agent')rs();if(v==='inbox')ri();if(v==='files')rf();if(v==='calendar')rc();if(v==='settings')rs2();
}
document.querySelectorAll('.sb-item[data-v]').forEach(el=>{el.addEventListener('click',()=>sv(el.dataset.v));});

// ===== INIT =====
ra();ri();rf();rc();rs2();
</script></body></html>
