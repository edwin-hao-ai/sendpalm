<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A8F63" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="SendPalm — 一个安静的、HEY 风格的邮件 + 日历 + IM + Agent 工作区。100% 本地、端到端。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SendPalm" />

    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="/src/assets/logo.svg" />

    <title>SendPalm</title>

    <style>
      /* Render the splash screen instantly, before the JS bundle loads.
         Hidden the moment SolidJS mounts and shows its own UI. */
      :root { color-scheme: light; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto,
                     "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #0a8f63;
        color: #fff;
        overflow: hidden;
      }
      #splash {
        position: fixed; inset: 0;
        min-height: 100dvh;
        padding-bottom: env(safe-area-inset-bottom);
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 18px;
        background: radial-gradient(120% 80% at 50% 0%, #0cb87d 0%, #0a8f63 55%, #087f56 100%);
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.55s ease-in;
      }
      body.app-ready #splash {
        opacity: 0;
        pointer-events: none;
      }
      #splash .logo {
        width: 112px; height: 112px;
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.18));
      }
      #splash .word {
        font-family: var(--font-display, -apple-system, "SF Pro Display", "Segoe UI", sans-serif);
        font-size: 26px; font-weight: 800; letter-spacing: -0.02em;
        color: #fff;
      }
      #splash .word .accent { color: #c8f6dd; }
      #splash .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.7);
        animation: splash-pulse 1.4s ease-in-out 0.5s infinite;
      }
      @keyframes splash-pulse { 0%, 100% { opacity: 0.4 } 50% { opacity: 1 } }
    </style>

    <script>
      window.__sendpalmBootErrors = [];

      // Browser noise that is not a failure and must never cover the app.
      // "ResizeObserver loop completed with undelivered notifications" is a
      // spec-blessed warning browsers emit routinely.
      function isBenignError(message) {
        return /ResizeObserver loop/i.test(String(message || ""));
      }

      // Before the shell paints there is nothing to salvage, so a boot
      // failure still gets the full-screen diagnostic panel. Once the app is
      // up, covering it would be exactly the 黑屏 the user complained about:
      // one bad component would take the whole window. Ready-state errors
      // surface as a dismissible bar with a reload action instead.
      function isReady() {
        return document.body && document.body.classList.contains("app-ready");
      }

      function renderBootPanel() {
        var box = document.getElementById("sendpalm-boot-errors");
        if (!box) {
          box = document.createElement("div");
          box.id = "sendpalm-boot-errors";
          box.style.cssText =
            "position:fixed;inset:0;z-index:99999;background:#000;color:#0f0;font:14px/1.5 monospace;padding:20px;white-space:pre-wrap;overflow:auto;";
          document.body.appendChild(box);
        }
        box.textContent = window.__sendpalmBootErrors.join("\n");
      }

      function renderRuntimeBar() {
        var bar = document.getElementById("sendpalm-runtime-errors");
        if (!bar) {
          bar = document.createElement("div");
          bar.id = "sendpalm-runtime-errors";
          bar.setAttribute("role", "status");
          bar.style.cssText = [
            "position:fixed",
            "right:16px",
            "bottom:calc(16px + env(safe-area-inset-bottom, 0px))",
            "z-index:9999",
            "max-width:min(420px, calc(100vw - 32px))",
            "display:flex",
            "align-items:center",
            "gap:10px",
            "padding:10px 12px",
            "border-radius:12px",
            "background:var(--paper-light, #fffdf7)",
            "border:0.5px solid var(--border, rgba(0,0,0,0.12))",
            "box-shadow:0 8px 28px rgba(0,0,0,0.14)",
            "font:12px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
            "color:var(--text-primary, #2b2b28)",
          ].join(";");

          var text = document.createElement("span");
          text.id = "sendpalm-runtime-errors-text";
          text.style.cssText = "flex:1;min-width:0;";

          var reload = document.createElement("button");
          reload.type = "button";
          reload.textContent = "重新载入";
          reload.style.cssText =
            "min-height:28px;padding:4px 10px;border-radius:999px;border:none;background:var(--palm, #0a8f63);color:#fff;font:600 11px/1 -apple-system, sans-serif;cursor:pointer;white-space:nowrap;";
          reload.onclick = function () {
            window.location.reload();
          };

          var dismiss = document.createElement("button");
          dismiss.type = "button";
          dismiss.setAttribute("aria-label", "关闭");
          dismiss.textContent = "×";
          dismiss.style.cssText =
            "width:24px;height:24px;border-radius:50%;border:none;background:transparent;color:inherit;font-size:16px;line-height:1;cursor:pointer;opacity:0.6;";
          dismiss.onclick = function () {
            bar.remove();
          };

          bar.appendChild(text);
          bar.appendChild(reload);
          bar.appendChild(dismiss);
          document.body.appendChild(bar);
        }
        var label = document.getElementById("sendpalm-runtime-errors-text");
        if (label) {
          var last = window.__sendpalmBootErrors[
            window.__sendpalmBootErrors.length - 1
          ];
          label.textContent =
            "运行中遇到问题：" +
            last +
            (window.__sendpalmBootErrors.length > 1
              ? "（共 " + window.__sendpalmBootErrors.length + " 条，详见错误日志）"
              : "（详见错误日志）");
          label.title = window.__sendpalmBootErrors.join("\n");
        }
      }

      // Tauri command errors arrive as plain objects, and `String({})` is
      // "[object Object]" — which is what the phone showed instead of the one
      // sentence that mattered (a -34018 keychain failure). Turn anything into
      // something a human can act on.
      function describeError(reason) {
        if (reason === null || reason === undefined) return String(reason);
        if (typeof reason === "string") return reason;
        if (reason instanceof Error) {
          return (reason.name ? reason.name + ": " : "") + (reason.message || "");
        }
        try {
          var message = reason.message || reason.error || reason.detail || reason.reason;
          if (typeof message === "string" && message) return message;
          var json = JSON.stringify(reason);
          if (json && json !== "{}") return json;
        } catch (_) {}
        return Object.prototype.toString.call(reason);
      }

      function reportError(message) {
        window.__sendpalmBootErrors.push(message);
        try {
          if (isReady()) renderRuntimeBar();
          else renderBootPanel();
        } catch (_) {}
      }

      window.addEventListener("error", function (e) {
        if (isBenignError(e.message)) return;
        reportError(
          e.message + " @ " + (e.filename || "") + ":" + (e.lineno || "")
        );
      });
      window.addEventListener("unhandledrejection", function (e) {
        if (isBenignError(e.reason)) return;
        reportError("Unhandled: " + describeError(e.reason));
      });
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run SendPalm.</noscript>

    <div id="splash" aria-hidden="true">
      <img class="logo" src="/src/assets/logo.svg" alt="" onerror="this.style.display='none'" />
      <div class="word">Send<span class="accent">Palm</span></div>
      <div class="dot"></div>
    </div>

    <div id="root"></div>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
