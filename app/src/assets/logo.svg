<?xml version="1.0" encoding="UTF-8"?>
<!--
  SendPalm full logo (256 viewBox)
  Used for the launch splash, apple-touch-icon, and as the source for
  every Tauri bundle icon (icon.icns / icon.png / icon.ico / *Square*.png).
  Direct upscale of the prototype-v11 topbar-logo-mark: rounded green
  plate + Phosphor paper-plane-tilt (white) + canary dot in the
  top-right with a white halo. No decorative gradients or palm-leaf
  accents — the prototype is the spec.
-->
