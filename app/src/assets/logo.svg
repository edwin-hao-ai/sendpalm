<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="SendPalm">
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0cb87d"/>
      <stop offset="100%" stop-color="#0a8f63"/>
    </linearGradient>
    <linearGradient id="sp-leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="sp-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Rounded square plate -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#sp-bg)"/>

  <!-- Soft inner highlight (top-left) -->
  <path d="M16 72 Q16 16 72 16 L160 16 Q120 32 96 56 Q72 80 56 120 Q40 160 32 200 Q24 224 16 224 Z"
        fill="#ffffff" fill-opacity="0.07"/>

  <!-- Paper-plane envelope silhouette -->
  <g transform="translate(128 134)">
    <!-- back flap (the envelope's body) -->
    <path d="M-72 -28 L72 -28 L72 56 L-72 56 Z" fill="#ffffff" fill-opacity="0.18"/>
    <!-- side diagonals (open envelope V) -->
    <path d="M-72 -28 L0 28 L72 -28 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-opacity="0.45"/>
    <!-- the paper plane (send mark) -->
    <path d="M-50 -4 L62 -36 L26 24 L8 6 L-50 -4 Z M8 6 L26 24"
          fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- speed lines -->
    <path d="M-66 14 L-44 14 M-66 24 L-50 24 M-66 34 L-56 34"
          stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55"/>
  </g>

  <!-- Palm leaf accent (top-right) -->
  <g transform="translate(178 70) rotate(20)">
    <!-- stem -->
    <path d="M0 30 Q20 10 50 -10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" stroke-opacity="0.8"/>
    <!-- 4 leaflets -->
    <path d="M50 -10 Q40 -22 30 -16 Q40 -10 50 -10 Z" fill="url(#sp-leaf)"/>
    <path d="M40 -2  Q28 -10 22 -2  Q34 -2  40 -2 Z" fill="url(#sp-leaf)" transform="translate(0 4)"/>
    <path d="M30 6   Q18 0   14 8    Q26 8   30 6 Z" fill="url(#sp-leaf)" transform="translate(0 8)"/>
    <path d="M20 14  Q10 10  8 18    Q18 18  20 14 Z" fill="url(#sp-leaf)" transform="translate(0 12)"/>
  </g>
</svg>