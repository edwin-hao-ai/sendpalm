[package]
name = "sendpalm-app"
version = "0.1.0"
description = "SendPalm — calm HEY-inspired email + calendar + agent workspace"
authors = ["SendPalm Team"]
edition = "2021"

[lib]
name = "sendpalm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# M10 — real backend
async-imap = { version = "0.10", features = ["tokio"] }
async-native-tls = "0.5"
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "ring", "rustls-native-certs", "builder", "smtp-transport"] }
mailparse = "0.16"
dotenvy = "0.15"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["compat"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
